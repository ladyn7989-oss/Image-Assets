name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Ren'Py SDK
        run: |
          wget -q "https://www.renpy.org/dl/8.2.3/renpy-8.2.3-sdk.tar.bz2" -O renpy-sdk.tar.bz2
          tar xjf renpy-sdk.tar.bz2
          echo "=== SDK contents ==="
          ls -la renpy-8.2.3-sdk/

      - name: Install RAPT (Android build tool)
        run: |
          ${{ github.workspace }}/renpy-8.2.3-sdk/renpy.sh install android
        continue-on-error: true

      - name: Verify project structure
        run: |
          echo "=== Project structure ==="
          find renpy_project -type f | sort
          echo "=== RAPT check ==="
          ls -la renpy-8.2.3-sdk/rapt/ 2>/dev/null || echo "RAPT not found in SDK"
          find ${{ github.workspace }} -name "rapt" -type d 2>/dev/null || echo "No rapt directory found"
          find ${{ github.workspace }} -name "*.apk" 2>/dev/null || echo "No APKs yet (expected)"

      - name: Download sprite assets
        run: |
          cd renpy_project
          python3 scripts/download_assets.py || echo "Some assets may be missing, continuing"
        continue-on-error: true

      - name: Build Android APK
        run: |
          cd ${{ github.workspace }}
          # The Ren'Py project is at renpy_project/ (contains game/ subdirectory)
          # First try with the full path
          echo "=== Attempting build ==="
          ./renpy-8.2.3-sdk/renpy.sh renpy_project android build --release 2>&1 || BUILD_FAILED=1
          
          if [ -n "$BUILD_FAILED" ]; then
            echo "=== First attempt failed, trying alternative ==="
            # Try without --release flag
            ./renpy-8.2.3-sdk/renpy.sh renpy_project android build 2>&1 || true
          fi
          
          echo "=== Searching for built APKs ==="
          find ${{ github.workspace }} -name "*.apk" -type f 2>/dev/null || echo "No APKs found"
          
          # Also check common output locations
          ls -la renpy_project/bin/ 2>/dev/null || echo "No bin/ in project"
          ls -la renpy-8.2.3-sdk/rapt/ 2>/dev/null || echo "No rapt/ in SDK"

      - name: Find and list APK files
        id: find_apk
        run: |
          echo "=== All APK files ==="
          find ${{ github.workspace }} -name "*.apk" -type f 2>/dev/null
          APK_PATH=$(find ${{ github.workspace }} -name "*.apk" -type f 2>/dev/null | head -1)
          echo "Found APK: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: date-with-destiny-apk
          path: |
            **/*.apk
            renpy_project/bin/**/*.apk
          if-no-files-found: warn

      - name: Create Release with APK
        if: startsWith(github.ref, 'refs/tags/') && steps.find_apk.outputs.apk_path != ''
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Create Release (no APK found)
        if: startsWith(github.ref, 'refs/tags/') && steps.find_apk.outputs.apk_path == ''
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: true
          body: |
            ## Build completed but no APK was found
            
            The Ren'Py build process ran but no .apk file was detected.
            Check the Actions logs for build errors.
            
            The project structure is ready — further build configuration may be needed.
