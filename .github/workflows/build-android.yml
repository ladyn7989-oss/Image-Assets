name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download Ren'Py SDK
        run: |
          curl -sL "https://www.renpy.org/dl/8.2.3/renpy-8.2.3-sdk.tar.bz2" -o renpy-sdk.tar.bz2
          tar xjf renpy-sdk.tar.bz2
          echo "SDK extracted"
          ls renpy-8.2.3-sdk/

      - name: Download and install RAPT
        run: |
          echo "Downloading RAPT (61MB)..."
          curl -sL "https://www.renpy.org/dl/8.2.3/renpy-8.2.3-rapt.zip" -o rapt.zip
          python3 -c "import zipfile; zipfile.ZipFile('rapt.zip').extractall('.')"
          cp -r rapt renpy-8.2.3-sdk/
          echo "RAPT installed at renpy-8.2.3-sdk/rapt/"
          ls renpy-8.2.3-sdk/rapt/android.py

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34" "platform-tools" || true
          # Create sdk.txt so RAPT knows where the SDK is
          echo "$ANDROID_HOME" > renpy-8.2.3-sdk/rapt/sdk.txt

      - name: Download sprite assets
        run: |
          cd renpy_project
          python3 scripts/download_assets.py || echo "Some assets may be missing"
        continue-on-error: true

      - name: Build Android APK
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          cd ${{ github.workspace }}
          
          echo "=== Building APK with launcher android_build ==="
          ./renpy-8.2.3-sdk/renpy.sh launcher android_build renpy_project 2>&1
          BUILD_EXIT=$?
          echo "=== Build exit code: $BUILD_EXIT ==="
          
          echo "=== Searching for APKs ==="
          find . -name "*.apk" -type f 2>/dev/null
          ls -la renpy_project/bin/ 2>/dev/null || echo "No bin directory in project"
          ls -la renpy-8.2.3-sdk/rapt/bin/ 2>/dev/null || echo "No bin in rapt"

      - name: Find APK files
        id: find_apk
        run: |
          echo "=== All APK files ==="
          find ${{ github.workspace }} -name "*.apk" -type f 2>/dev/null
          APK_PATH=$(find ${{ github.workspace }} -name "*.apk" -type f 2>/dev/null | head -1)
          echo "Found APK: ${APK_PATH:-NONE}"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "apk_found=$([ -n "$APK_PATH" ] && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: date-with-destiny-apk
          path: |
            **/*.apk
          if-no-files-found: warn

      - name: Create Release with APK
        if: startsWith(github.ref, 'refs/tags/') && steps.find_apk.outputs.apk_found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/*.apk
          generate_release_notes: true

      - name: Create Draft Release (no APK)
        if: startsWith(github.ref, 'refs/tags/') && steps.find_apk.outputs.apk_found != 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: true
          body: |
            ## APK Build Status
            Build attempted. Check Actions logs for details.
