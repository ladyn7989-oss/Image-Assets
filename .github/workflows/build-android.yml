name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download Ren'Py SDK
        run: |
          curl -sL "https://www.renpy.org/dl/8.2.3/renpy-8.2.3-sdk.tar.bz2" -o renpy-sdk.tar.bz2
          tar xjf renpy-sdk.tar.bz2
          ls renpy-8.2.3-sdk/

      - name: Download and install RAPT
        run: |
          curl -sL "https://www.renpy.org/dl/8.2.3/renpy-8.2.3-rapt.zip" -o rapt.zip
          python3 -c "import zipfile; zipfile.ZipFile('rapt.zip').extractall('.')"
          cp -r rapt renpy-8.2.3-sdk/
          ls renpy-8.2.3-sdk/rapt/android.py

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          # RAPT expects android-33, not android-34
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "platforms;android-33" "platform-tools" || true
          echo "$ANDROID_HOME" > renpy-8.2.3-sdk/rapt/sdk.txt

      - name: Generate Android signing keys
        run: |
          cd renpy_project
          keytool -genkey -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -keypass android -storepass android -dname "CN=DateWithDestiny" -validity 20000
          keytool -genkey -keystore bundle.keystore -alias bundle -keyalg RSA -keysize 2048 -keypass android -storepass android -dname "CN=DateWithDestiny" -validity 20000
          ls -la *.keystore

      - name: Configure android.json
        run: |
          cd renpy_project
          cat > android.json << 'JSONEOF'
          {
              "expansion": false,
              "google_play_key": null,
              "google_play_salt": null,
              "heap_size": null,
              "icon_name": "Date With Destiny",
              "include_pil": false,
              "include_sqlite": false,
              "layout": "standard",
              "name": "Date With Destiny",
              "numeric_version": 1,
              "orientation": "sensorPortrait",
              "package": "com.dwd.datewithdestiny",
              "permissions": ["VIBRATE"],
              "source": false,
              "store": "none",
              "update_always": true,
              "update_icons": true,
              "update_keystores": true,
              "version": "1.0"
          }
          JSONEOF

      - name: Download sprite assets
        run: |
          cd renpy_project
          python3 scripts/download_assets.py || echo "Some assets may be missing"
        continue-on-error: true

      - name: Build Android APK (with full error capture)
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          cd ${{ github.workspace }}
          
          echo "=== Verifying prerequisites ==="
          echo "Project structure:"
          find renpy_project -maxdepth 2 -type f | sort | head -20
          echo "---"
          echo "android.json:"
          cat renpy_project/android.json
          echo "---"
          echo "Keystores:"
          ls -la renpy_project/*.keystore
          echo "---"
          echo "SDK:"
          ls $ANDROID_HOME/platforms/ 2>/dev/null || echo "No platforms dir"
          echo "---"
          
          echo "=== Running lint first ==="
          ./renpy-8.2.3-sdk/renpy.sh renpy_project lint 2>&1 || echo "Lint had warnings (ok)"
          echo "---"
          
          echo "=== Building APK ==="
          # Use || true so the step doesn't fail and we can see full output
          ./renpy-8.2.3-sdk/renpy.sh launcher android_build renpy_project 2>&1 || true
          
          echo "=== Build complete, searching for APKs ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "No APKs found"
          
          echo "=== Check for error files ==="
          cat renpy_project/errors.txt 2>/dev/null || echo "No errors.txt"
          cat renpy_project/android.txt 2>/dev/null || echo "No android.txt"
          
          echo "=== Check rapt bin directory ==="
          ls -la renpy-8.2.3-sdk/rapt/bin/ 2>/dev/null || echo "No rapt/bin"
          ls -la renpy-8.2.3-sdk/rapt/project/ 2>/dev/null || echo "No rapt/project"

      - name: Find APK files
        id: find_apk
        run: |
          find ${{ github.workspace }} -name "*.apk" -type f 2>/dev/null
          APK_PATH=$(find ${{ github.workspace }} -name "*.apk" -type f 2>/dev/null | head -1)
          echo "Found APK: ${APK_PATH:-NONE}"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "apk_found=$([ -n "$APK_PATH" ] && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: date-with-destiny-apk
          path: |
            **/*.apk
          if-no-files-found: warn

      - name: Create Release with APK
        if: startsWith(github.ref, 'refs/tags/') && steps.find_apk.outputs.apk_found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/*.apk
          generate_release_notes: true

      - name: Create Draft Release (no APK)
        if: startsWith(github.ref, 'refs/tags/') && steps.find_apk.outputs.apk_found != 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: true
          body: |
            ## APK Build Status
            Build attempted. Check Actions logs for details.
