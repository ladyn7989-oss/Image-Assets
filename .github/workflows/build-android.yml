name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download Ren'Py SDK
        run: |
          set -e
          curl -sL "https://www.renpy.org/dl/8.2.3/renpy-8.2.3-sdk.tar.bz2" -o renpy-sdk.tar.bz2
          tar xjf renpy-sdk.tar.bz2
          ls renpy-8.2.3-sdk/

      - name: Download and install RAPT
        run: |
          set -e
          curl -sL "https://www.renpy.org/dl/8.2.3/renpy-8.2.3-rapt.zip" -o rapt.zip
          python3 -c "import zipfile; zipfile.ZipFile('rapt.zip').extractall('.')"
          cp -r rapt renpy-8.2.3-sdk/
          chmod +x renpy-8.2.3-sdk/rapt/prototype/gradlew
          chmod +x renpy-8.2.3-sdk/rapt/project/gradlew 2>/dev/null || true
          ls -l renpy-8.2.3-sdk/rapt/android.py
          ls -l renpy-8.2.3-sdk/rapt/prototype/gradlew

      - name: Set up Android SDK
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "platforms;android-33" "platform-tools" || true
          echo "$ANDROID_HOME" > renpy-8.2.3-sdk/rapt/sdk.txt
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Pre-setup RAPT project
        run: |
          set -e
          rm -rf renpy-8.2.3-sdk/rapt/project
          cp -r renpy-8.2.3-sdk/rapt/prototype renpy-8.2.3-sdk/rapt/project
          chmod +x renpy-8.2.3-sdk/rapt/prototype/gradlew
          chmod +x renpy-8.2.3-sdk/rapt/project/gradlew
          echo "sdk.dir=$ANDROID_HOME" > renpy-8.2.3-sdk/rapt/project/local.properties
          echo "key.alias=android" >> renpy-8.2.3-sdk/rapt/project/local.properties
          echo "key.store.password=android" >> renpy-8.2.3-sdk/rapt/project/local.properties
          echo "key.alias.password=android" >> renpy-8.2.3-sdk/rapt/project/local.properties
          KEYSTORE_ABS=$(realpath renpy_project/android.keystore 2>/dev/null || echo "")
          echo "key.store=$KEYSTORE_ABS" >> renpy-8.2.3-sdk/rapt/project/local.properties
          echo "sdk.dir=$ANDROID_HOME" > renpy-8.2.3-sdk/rapt/project/bundle.properties
          echo "key.alias=android" >> renpy-8.2.3-sdk/rapt/project/bundle.properties
          echo "key.store.password=android" >> renpy-8.2.3-sdk/rapt/project/bundle.properties
          echo "key.alias.password=android" >> renpy-8.2.3-sdk/rapt/project/bundle.properties
          ls -l renpy-8.2.3-sdk/rapt/prototype/gradlew renpy-8.2.3-sdk/rapt/project/gradlew

      - name: Generate Android signing keys
        run: |
          set -e
          cd renpy_project
          keytool -genkey -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -keypass android -storepass android -dname "CN=DateWithDestiny" -validity 20000
          keytool -genkey -keystore bundle.keystore -alias bundle -keyalg RSA -keysize 2048 -keypass android -storepass android -dname "CN=DateWithDestiny" -validity 20000

      - name: Configure android.json
        run: |
          set -e
          cd renpy_project
          cat > android.json << 'JSONEOF'
          {
              "expansion": false,
              "google_play_key": null,
              "google_play_salt": null,
              "heap_size": null,
              "icon_name": "Date With Destiny",
              "include_pil": false,
              "include_sqlite": false,
              "layout": "standard",
              "name": "Date With Destiny",
              "numeric_version": 1,
              "orientation": "sensorPortrait",
              "package": "com.dwd.datewithdestiny",
              "permissions": ["VIBRATE"],
              "source": false,
              "store": "none",
              "update_always": true,
              "update_icons": true,
              "update_keystores": true,
              "version": "1.0"
          }
          JSONEOF

      - name: Download sprite assets
        run: |
          cd renpy_project
          python3 scripts/download_assets.py || echo "Some assets may be missing"
        continue-on-error: true

      - name: Build Android APK
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          set -euo pipefail
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          cd ${{ github.workspace }}

          echo "=== Java check ==="
          javac -version
          echo "=== gradlew check ==="
          ls -l renpy-8.2.3-sdk/rapt/prototype/gradlew renpy-8.2.3-sdk/rapt/project/gradlew
          test -x renpy-8.2.3-sdk/rapt/prototype/gradlew
          test -x renpy-8.2.3-sdk/rapt/project/gradlew

          echo "=== Building APK ==="
          ./renpy-8.2.3-sdk/renpy.sh renpy-8.2.3-sdk/launcher android_build renpy_project 2>&1 | tee build_output.txt

          echo "=== Searching for APKs ==="
          find . -name "*.apk" -type f -print

      - name: Upload build log to repo
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f build_output.txt ]; then
            CONTENT=$(base64 -w 0 build_output.txt)
            SHA=$(curl -s \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/contents/build_log.txt" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('sha',''))")
            if [ -n "$SHA" ]; then
              curl -s -X PUT \
                -H "Authorization: token $GH_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/${{ github.repository }}/contents/build_log.txt" \
                -d "{\"message\":\"Update build log\",\"content\":\"$CONTENT\",\"sha\":\"$SHA\"}" >/dev/null
            fi
          fi

      - name: Find APK files
        id: find_apk
        run: |
          APK_PATH=$(find "${{ github.workspace }}" -name "*.apk" -type f 2>/dev/null | head -1)
          echo "Found APK: ${APK_PATH:-NONE}"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          if [ -n "$APK_PATH" ]; then
            echo "apk_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "apk_found=false" >> "$GITHUB_OUTPUT"
            echo "ERROR: Ren'Py build completed without producing an APK."
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: date-with-destiny-apk
          path: |
            **/*.apk
          if-no-files-found: error

      - name: Create Release with APK
        if: startsWith(github.ref, 'refs/tags/') && steps.find_apk.outputs.apk_found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/*.apk
          generate_release_notes: true
