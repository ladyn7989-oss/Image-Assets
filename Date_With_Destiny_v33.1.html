.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;padding:14px}

.vch:active{transform:scale(.97);background:rgba(167,139,250,.15)}
.vt2{font-size:12px;color:#a78bfa;text-align:center;padding:10px;cursor:pointer}
.ew{flex:1;display:flex;flex-direction:column;overflow:hidden}
.ei{flex:1;position:relative;overflow:hidden;min-height:200px}

.gi img{width:100%;height:100%;object-fit:cover}
.gi .l{position:absolute;bottom:0;left:0;right:0;padding:6px 8px;background:linear-gradient(transparent,rgba(26,14,46,.95));font-size:11px;font-weight:600}

.gv img{flex:1;object-fit:contain;max-width:100%;border-radius:10px}
.mf{padding:14px;display:flex;flex-direction:column;gap:12px}
.mfl{font-size:12px;font-weight:600;color:#a78bfa}
.mfi{padding:9px 10px;border-radius:8px;border:1px solid rgba(167,139,250,.2);background:rgba(167,139,250,.05);font-size:13px;color:#e9d5ff;font-family:inherit}
.mft{padding:9px 10px;border-radius:8px;border:1px solid rgba(167,139,250,.2);background:rgba(167,139,250,.05);font-size:11px;color:#e9d5ff;font-family:monospace;min-height:60px;resize:vertical}
.tt{display:flex;border-bottom:1px solid rgba(167,139,250,.15)}
.tt div{flex:1;padding:10px;text-align:center;font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;color:#a78bfa}

.to{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#7c3aed;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;z-index:200;animation:ti .3s}
@keyframes ti{from{transform:translateX(-50%) translateY(20px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
.dv{height:1px;background:rgba(167,139,250,.15);margin:4px 0}

/* VN Engine CSS */
.vnbg{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.vnbg img{width:100%;height:100%;object-fit:cover;animation:vni .5s ease-in forwards}
@keyframes vni{from{opacity:0}to{opacity:1}}
.vnch{position:relative;z-index:1;flex:1;display:flex;align-items:center;justify-content:center;animation:vci .4s ease-out forwards}
@keyframes vci{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.vnbar{display:flex;gap:4px;padding:4px 8px;justify-content:flex-end;background:rgba(26,14,46,.5);position:relative;z-index:5}
.vnbar .b{font-size:11px;padding:4px 10px;border-radius:6px}
.vnbar .b.act{background:#7c3aed;color:#fff}
.vnbar .b.inact{background:rgba(167,139,250,.15);color:#a78bfa}
.vnfade{position:absolute;inset:0;background:#1a0e2e;z-index:50;pointer-events:none;opacity:0;transition:opacity .3s}
.vnfade.show{opacity:1;pointer-events:all}
.twc{display:inline-block;width:2px;height:14px;background:#e9d5ff;animation:tbk .5s infinite;margin-left:2px;vertical-align:middle}
@keyframes tbk{0%,50%{opacity:1}51%,100%{opacity:0}}
.dbox{position:relative;z-index:5;padding:10px 16px 4px;background:linear-gradient(180deg,rgba(26,14,46,.85),rgba(26,14,46,.98));border-top:1px solid rgba(167,139,250,.2);max-height:45vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.dname{display:inline-block;font-size:13px;font-weight:700;padding:3px 12px;border-radius:6px;margin-bottom:6px}
.dtext{font-size:14px;line-height:1.5;min-height:48px;max-height:180px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.slots{display:flex;flex-direction:column;gap:8px;padding:14px}
.slot{border:1px solid rgba(167,139,250,.2);border-radius:10px;padding:12px;cursor:pointer;background:rgba(167,139,250,.05)}
.slot:active{transform:scale(.98)}
.slot .sh{font-size:12px;color:#a78bfa;margin-bottom:4px}
.slot .sd{font-size:14px;font-weight:600}
.slot .ss{font-size:11px;color:#a78bfa;margin-top:4px}
.slot.empty .sd{color:#a78bfa;font-style:italic}


.vnb{position:relative;z-index:4;padding:4px 12px;background:rgba(26,14,46,.6);display:flex;justify-content:space-between;align-items:center;font-size:12px}

/* === LANDSCAPE & TABLET SUPPORT === */

  #g{max-width:100%!important;height:100dvh}

fb5_generated_image.png", "gm": "https://media.base44.com/images/public/6a65151d5dd046764e8de589/455e06bb2_generated_image.png", "ap": "https://media.base44.com/images/public/6a65151d5dd046764e8de589/3b7d23a75_generated_image.png", "ae": "https://media.base44.com/images/public/6a65151d5dd046764e8de589/af55f7ba1_generated_image.png", "ah": "https://media.base44.com/images/public/6a65151d5dd046764e8de589/76520c828_generated_image.png", "aan": "https://media.base44.com/images/public/6a65151d5dd046764e8de589/71aa953d7_generated_image.png", "asd": "https://media.base44.com/images/public/6a65151d5dd046764e8de589/77b77e636_generated_image.png", "au": "https://media.base44.com/images/public/6a65151d5dd046764e8de589/ce9e43376_generated_image.png", "al": "https://media.base44.com/images/public/6a65151d5dd046764e8de589/403a23ba8_generated_image.png", "am": "https://media.base44.com/images/public/6a65151d5dd046764e8de589/163233f5d_generated_image.png", "ab": "https://media.base44.com/images/public/6a65151d5dd046764e8de589/4e1cb2c2d_generated_image.png", "bbelly": "https://media.base44.com/images/public/6a65151d5dd046764e8de589/760a86295_generated_image.png", "cbelly": "https://media.base44.com/images/public/6a65151d5dd046764e8de589/163f5cff1_generated_image.png", "hbelly": "https://media.base44.com/images/public/6a65151d5dd046764e8de589/768a0b863_generated_image.png", "vbelly": "https://media.base44.com/images/public/6a65151d5dd046764e8de589/0acacf8b3_generated_image.png", "gbelly": "https://media.base44.com/images/public/6a65151d5dd046764e8de589/d8965db5d_generated_image.png", "abelly": "https://media.base44.com/images/public/6a65151d5dd046764e8de589/96bc4174b_generated_image.png", "op": "https://media.base44.com/images/public/6a65151d5dd046764e8de589/55db71b56_generated_image.png", "oe": "https://media.base44.com/images/public/6a65151d5dd046764e8de589/467eadddc_generated_image.png", "obg": "https://media.base44.com/images/public/6a65151d5dd046764e8de589/41cdcb4a5_generated_im
