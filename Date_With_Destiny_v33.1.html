fomo:{squirm:["O-oh! *giggles* That tickles! Keep doing that and I might blush forever.","Hey now, don't squirm so much! You'll make me hiccup! *hic* See? Told you.","*ears flatten* Careful in there! I don't want to squeeze too tight... you're precious cargo."],massage:["Mmm... that feels really nice, actually. Nobody's ever been this gentle with me before.","*purrs* Oh, you're good at that. You sure you don't want to stay in there forever?","*happy sigh* You know, I didn't expect to like having company this much. You're warm."],talk:["Oh, them? *pats stomach softly* They wandered into the pool looking for a midnight swim. I couldn't just let them go... they looked lonely. Now they're part of something warmer.","Hey, you two getting along in there? *listens to belly* Sounds like it! Good. I don't want anyone to feel alone in there.","*smiles shyly* I talk to my belly sometimes. Is that weird? I just... want them to know they're wanted."]},
wolf:{squirm:["Heh, squirm all you want, kid. This ship's got the best holding cell in the system \u2014 right inside me.","*chuckles* That actually feels kinda good. Keep it up, I might fall asleep.","Careful, runt. You keep wiggling like that and I might decide to keep you longer."],massage:["*groans* Where'd you learn to do that? Don't stop. A merc could get used to this kind of treatment.","Easy there, kid. You keep massaging like that and I might actually start liking you. Can't have that, can we?","*smirks* Good. Real good. You're earning your keep in there."],talk:["Yeah, your buddy's in here too. Found them poking around my ship's cargo hold. Now the cargo's inside me. *pats gut* They're fine. I take care of what's mine.","You two behave in there. Last thing I need is a brawl in my belly. *grins* Though watching you sort it out would be entertaining.","So. You comfy in there or what? I'm not letting you out, just curious. A good captain checks on their cargo."]},
glacia:{squirm:["*shivers* Oh my, you're a lively one! Squirming in the ice cavern, are we? You'll warm up eventually.","Careful now \u2014 the walls are slick in here. You'll just tire yourself out. *amused hum*","Mmm. I can feel you moving. It's... nice, actually. Like a little heartbeat against the cold."],massage:["Oh... that's lovely. You're melting all the tension away. Stay still like that, won't you?","*contented sigh* You know, most people are too scared to relax in here. You're different. I like that.","*purrs* A little to the left... yes, there. Perfect. You're a natural at this."],talk:["Another wanderer found their way into my cavern. The ice has a way of drawing curious things in. *small smile* They're quite comfortable now. Preserved nicely.","You're both so warm in there. It's been a long time since I had company in the cold. I don't think I want to give that up.","*hums softly* My guests always end up staying longer than planned. The cold preserves, you know. And so do I."]},
aether:{squirm:["*gentle laugh* It's alright. You can move around in there. This isn't a cage \u2014 it's a resting place.","Easy, easy. There's no rush. You're safe here. Nothing is going to hurt you in my belly.","*soothing hum* I know it feels strange at first. Give it a moment. The warmth will settle you."],massage:["*soft exhale* That's... unexpected. Nobody's ever been that gentle with me. Thank you.","You don't have to earn your keep in here. Just rest. But if massaging makes you feel better, I won't stop you.","*closes eyes* You're kind. That's rare. Stay as long as you need."],talk:["Someone else is resting in here too. They came in carrying something heavy \u2014 grief, I think. Now they're lighter. That's how it works here.","*warm smile* You two can talk if you'd like. Just keep it quiet. This is a place for resting, not arguing.","I know it feels strange, being kept by someone who doesn't want anything from you. But that's all I want \u2014 for you to rest."]},
luna:{squirm:["*sharp grin* Squirm all you like. My womb is patient. You'll settle in eventually.","Oh, you're a wiggly one! My kits love it when their new sibling wiggles like that.","*chuckles* Careful in there, little one. The walls are warm and close. My Riolu twins are purring on the outside \u2014 they can feel you in there."],massage:["Mmm... that's nice. You're already learning to be gentle in there. Good. My kits like a calm womb.","*contented sigh* You know, my brother's belly heals people. My womb? I keep them. And you're doing just fine in there. The twins think so too.","*soft hum* A little slower... yes. You're a natural. Luna Jr. and Sol are curled up against my belly from the outside, listening to your heartbeat."],talk:["Oh, them? *pats her middle warmly* That's someone I'm keeping in my womb. My Riolu twins \u2014 Luna Jr. and Sol \u2014 are excited to have a new sibling in here.","Your buddy's in here too. *grins* Same deal \u2014 warm walls, gentle closeness. My kits keep asking when you'll come out to play. I keep telling them: you're not coming out.","*hums* My brother lets people leave. I... don't, usually. But I'm not cruel about it. Luna Jr. says hi, by the way. She's been pressing her ear to my belly all day."]},
nyx:{squirm:["*soft laugh* Wiggle all you want, little dreamer. The dark is warm in here, isn't it?","Careful now \u2014 you'll tangle the dream threads. *bell jingles* Just breathe. We'll be at the next window soon.","Mmm. I can feel you settling in. Good. The route is long, and I like having company for it."],massage:["*surprised* Oh! That's... nobody's ever done that from the inside before. *purrs* Don't stop.","*bell rings softly* You're good at that. The dreams are delivery tonight, and you're making the route feel shorter.","*contented hum* Stay still like that. The city is asleep below us, and we have all the time between the lanterns."],talk:["Another dream joined you in here. They were wandering the rooftops alone \u2014 I couldn't leave them out in the cold dark. *adjusts cloak* Now they ride with us.","*whispers* You two be quiet in there. The sleeping city can hear if you're too loud. We pass their windows like ghosts, and I like it that way.","*bell jingles* My passengers always end up staying. The route between dreams is long, and it's warmer in here than out there. *smiles* You'll see."]},
zero:{squirm:["*soft voice* You can move, little star. The illusion bends around you. There's nowhere to go, but you're free to try.","Careful. The dark in here is mine. It shapes itself around you whether you fight it or not.","*amused* I felt that. You're stronger than you look. But the hollow is stronger still. Settle in."],massage:["*quiet exhale* That's... unexpected. Nobody's ever been gentle with the dark before. *pause* Do that again.","*whispers* You're learning. The illusion responds to kindness, not force. That's rare. Stay gentle in there.","*blue eyes soften* I keep the dark close because it protects what's mine. You're mine now. And you're safe. Don't forget that."],talk:["Your companion is in here too. *pats belly* They followed the voice, same as you. The hollow takes everyone who listens. They're settling in nicely \u2014 the illusion makes it feel like home.","*softly* I don't keep people out of cruelty. I keep them because the outside is colder than the dark. In here, at least, I know you're safe.","Luce says I'm too possessive. *small smile* Maybe she's right. But I watched the world forget you once. I won't let it happen again."]},
luce:{squirm:["*gentle laugh* Oh, you're a squirmy one! That's okay \u2014 my illusions are soft. Squirm all you like, little dreamer.","*tilts head* You're testing the walls? They're made of moonlight and gentleness. You'll find they give before they break.","*warm purr* The more you move, the more the dream folds around you. It's okay. Fighting is part of the process."],massage:["*surprised* Oh! That's... that's lovely. *pale mane fluffs* Nobody's ever been that gentle inside a dream before.","*blushes* You're sweet. Zero would never admit it, but he likes being cared for too. You're teaching us both something.","*soft giggle* Stay still like that and I might just make this dream permanent. Would that be so bad?"],talk:["Your friend is in here too. *pats belly gently* They followed the voice through the mist. I made their corner of the dream extra soft \u2014 I do that for the shy ones.","*whispers* Zero keeps his dark tight. I keep mine loose, like a warm blanket. You can stretch in here. The dream will make room.","*smiles* My illusions don't lie, you know. They just... comfort. And right now, you need comfort. That's why you're here. That's why you're staying."]}};

const TALK={
aether:[
  {id:0,r:"Welcome back. Tea\'s still hot. Sit. Or don\'t \u2014 you can also just stand here and breathe. I don\'t mind.",a:0,next:[1,2,3]},
  {id:1,t:"What is this place?",r:"A cafe. Wood floors, ferns, old books, one window seat that gets the evening light. People come here to put things down. Some of them put them in my belly instead. Same result, fewer stairs.",a:2,next:[4]},
  {id:2,t:"Does it hurt, being kept?",r:"Not in here. The warmth runs backwards in my womb \u2014 every day you spend inside me, you carry a little less. When it reaches zero, you leave lighter than you came. No one stays who doesn\'t choose to.",a:3,next:[4]},
  {id:3,t:"Why do you do this?",r:"Because someone let me rest once, and I never forgot what it felt like. I just... pass it along. Quietly.",a:2,next:[4]},
  {id:4,t:"Can I stay a while?",r:"The door\'s open. Slide in, rest, let the warmth settle in. I\'ll be right here when you\'re ready to speak, and I won\'t ask for more than you want to give.",a:3,next:[]},
],
luna:[
  {id:0,r:"Hey there, stranger. Don\'t mind me \u2014 I\'m just watching the door. Someone has to. My brother lets everyone in.",a:0,next:[1,2,3]},
  {id:1,t:"Are you really his sister?",r:"Same litter, different lesson. He learned to hold people gently. I learned that if you hold on long enough, they stop wanting to leave. We balance each other out.",a:2,next:[4]},
  {id:2,t:"What\'s it like in your womb?",r:"Slow. Warm. The closeness creeps up about six a day \u2014 you\'d have a week or more to decide if forever sounds good. Most decide it does.",a:3,next:[4]},
  {id:3,t:"You\'re kind of intense.",r:"*grins* I\'m a sister. Intense is the job description. But I\'m also the safest place in this city to be kept \u2014 I don\'t push anyone past 50% closeness unless they want to stay there.",a:2,next:[4]},
  {id:4,t:"Maybe I\'ll let you keep me.",r:"Good answer. Let me draw you in, warm up, and let the days tick by. I\'ve got you. And I\'ve got all the time in the world.",a:3,next:[]},
],
beerus:[
  {id:0,r:"Hmph. You want to talk, belly pet? Fine. I'm feeling generous today. Choose your words wisely.",a:0,next:[1,2,3]},
  {id:1,t:"What's it like being a God of Destruction?",r:"Exactly what it sounds like. I destroy what needs destroying. The universe keeps its balance, and I nap afterward. Simple, elegant, satisfying. Much like having you in there.",a:2,next:[4]},
  {id:2,t:"What's your favorite food?",r:"Earth pudding. Don't tell Whis I said that. He'd make me sit through another century-long lecture on 'balanced diets.' As if a god needs diet advice from his attendant.",a:1,next:[4]},
  {id:3,t:"Do you ever get lonely up there?",r:"Lonely? I have Whis. I have my naps. And now I have you, snug inside me. That's more company than most destroyers get. *pats belly* Cherish that thought.",a:3,next:[4]},
  {id:4,t:"Will you ever let me out?",r:"*pats belly* And ruin this perfect arrangement? You're warm, safe, and mine. I think not, little pet. Now hush \u2014 nap time.",a:2,next:[]},
],
champa:[
  {id:0,r:"OH! You wanna talk to ME? Finally! Nobody ever wants to talk to ME, they always go to BEERUS first! What do you wanna know? Ask me anything!",a:1,next:[1,2,3]},
  {id:1,t:"How are you different from Beerus?",r:"HEY! I'm NOTHING like my stick-in-the-mud brother! I'm FUN! I'm GENEROUS! I also destroy things, but with STYLE! And I share my food! Beerus would NEVER share his pudding!",a:2,next:[4]},
  {id:2,t:"What's your favorite snack?",r:"Everything! But if I HAD to choose... donuts. Glazed. Powdered. Jelly-filled. ALL of them. At once. In my belly. With YOU in there too! It's like a party in there!",a:2,next:[4]},
  {id:3,t:"Do you miss Universe 6?",r:"Miss it? I visit it all the time! Universe 6 has the BEST food, you know. You should try it. Oh wait \u2014 you CAN'T. You're in my belly! Hahahaha! VIP tour, no refunds!",a:1,next:[4]},
  {id:4,t:"Could I ever visit Universe 6?",r:"You already ARE visiting! Consider this a behind-the-scenes tour of a God of Destruction. Nobody else gets this experience. You're SPECIAL, you know that? Now stop squirming, you're making me hungry again.",a:2,next:[]},
],
husk:[
  {id:0,r:"*grunts* You want to talk? Sure. Not like I've got anything better to do. You're in there, I'm out here. Might as well make conversation.",a:1,next:[1,2,3]},
  {id:1,t:"Tell me about this bar.",r:"This place? *gestures vaguely* Been here longer than I can remember. Or care to. Good booze. Bad decisions. Perfect combination. The drinks are cheap and the company is... well, you're literally inside me, so make of that what you will.",a:1,next:[4]},
  {id:2,t:"Were you always... like this?",r:"A bartender? An angel? A sinner? Which part you asking about, kid? Answer's the same for all of it: yeah. Always was. Always will be. Some of us don't get the luxury of change.",a:2,next:[4]},
  {id:3,t:"Why did you keep me?",r:"*grunts* Didn't want to, if I'm honest. But you grew on me. Like a bad habit. Now get comfortable in there, I got customers to serve and you got... whatever you do in there.",a:3,next:[4]},
  {id:4,t:"Will I ever get out?",r:"Maybe. Maybe not. Depends on whether I ever sober up enough to care. *pours another drink* Don't hold your breath, kid. The booze is good and the company is warm. *pats belly*",a:0,next:[]},
],
vox:[
  {id:0,r:"Oh, you want to CHAT? How delightfully analog. Very well, little pet \u2014 I'm feeling generous between board meetings. What's on your mind?",a:1,next:[1,2,3]},
  {id:1,t:"How did you build your empire?",r:"Vision. Ruthlessness. And the complete absence of a conscience. You'd be amazed what you can accomplish when nothing holds you back. No morals, no guilt, no weakness. Just pure, unfiltered ambition.",a:1,next:[4]},
  {id:2,t:"Do you miss being alive?",r:"Miss being ALIVE? *laughs* I'm MORE alive now than I ever was. Flesh is weakness. Digital is forever. You're experiencing that firsthand, pet \u2014 preserved, contained, MINE. Consider it an upgrade.",a:2,next:[4]},
  {id:3,t:"Why did you eat me?",r:"Because you were interesting enough to keep and too valuable to lose. Consider it a promotion. You're now part of the V Tower permanent collection. Exclusive. Limited edition. No returns accepted.",a:3,next:[4]},
  {id:4,t:"Can I at least get WiFi in here?",r:"*actual static laugh* Oh, I LIKE you. You might just be my favorite belly pet yet. The signal's a little spotty through all the stomach acid, but I'll see what I can do. Maybe.",a:2,next:[]},
],
vegeta:[
  {id:0,r:"GRRRROOOAAAR! You want TALK? Vegeta not good at talk! Vegeta good at SMASH! But... okay. Vegeta try. For you, little belly pet. What you want know?",a:1,next:[1,2,3]},
  {id:1,t:"How did you become Great Ape?",r:"MOON! Full moon make Vegeta BIG! Was always big inside \u2014 prince pride! Now big outside too! Same Saiyan warrior! Just... more. More hair. More ROAR. More belly. With YOU in it!",a:2,next:[4]},
  {id:2,t:"What do you eat?",r:"Everything! Trees! Rocks! Sometimes big monster! Whole pizza! But now Vegeta eat YOU! You in belly! Best meal! Very warm! Very good! You stay forever!",a:3,next:[4]},
  {id:3,t:"Don't you miss being small?",r:"Rrrrr... Vegeta always big INSIDE. Size not matter! Pride matter! Power matter! Now Vegeta biggest! Strongest! Nothing beat Great Ape Vegeta! Nothing!",a:2,next:[4]},
  {id:4,t:"Is it safe in here?",r:"Rrrrr... safe? Vegeta belly SAFEST place in universe! Nothing hurt you in here! Vegeta PROTECT! You sleep now, little pet. Vegeta keep watch. Nothing get past Great Ape.",a:3,next:[]},
],
anubis:[
  {id:0,r:"You wish to speak? Very well. I have stood guard for millennia \u2014 a conversation is a pleasant change from silence. What would you know, little warrior?",a:1,next:[1,2,3]},
  {id:1,t:"What's your shrine like?",r:"Ancient. Powerful. Built by hands that no longer exist in this world. The thunder never stops here \u2014 it is the heartbeat of something older than memory. It suits me.",a:2,next:[4]},
  {id:2,t:"Are you a god or a warrior?",r:"Both. Neither. I was built to guard, and I chose to fight. The line between divine and mortal blurs when you have lived as long as I have. Titles lose meaning. Actions remain.",a:2,next:[4]},
  {id:3,t:"Why did you swallow me?",r:"You showed courage. Rare, in these soft times. Most flee. You stood. I keep what impresses me, and you impressed me. *thumps chest* So here you stay, little warrior.",a:3,next:[4]},
  {id:4,t:"Will you ever release me?",r:"Perhaps. When I have seen enough of your spirit. Or when the thunder finally stops. Neither is likely to happen soon. Rest well in there \u2014 I will not let harm come to what is mine.",a:1,next:[]},
],
vincent:[
  {id:0,r:"Heh, you wanna chat? Sure thing, mate. I don't get many visitors \u2014 well, visitors who can actually hold a conversation from inside my gut. What do you wanna know?",a:1,next:[1,2,3]},
  {id:1,t:"How'd you end up in this alley?",r:"Long story, mate. Streets raised me, alley kept me. Found my people here, found my music, found my rhythm. Then you wandered in and I thought... yeah, this one's staying. So here you are.",a:2,next:[4]},
  {id:2,t:"What's with the star-shaped eyes?",r:"Born with 'em. Rare trait among my kind \u2014 Obstagoon with star eyes are said to be destined for greatness. Or trouble. Usually both. *winks* You tell me which one this is.",a:2,next:[4]},
  {id:3,t:"Why'd you eat me?",r:"Couldn't let you walk away, could I? Not after you chose this alley. You walked into MY territory, chose ME. That means something on these streets. So now you're mine. Simple as that.",a:3,next:[4]},
  {id:4,t:"Do you ever think about leaving the alley?",r:"Sometimes. But the streets need someone who knows 'em. Someone who speaks the language. I'm that someone. And now, so are you \u2014 just... on the inside. *chuckles* Home sweet home, right?",a:1,next:[]},
],
fomo:[
  {id:0,r:"Mm? Oh, hey. Didn\'t hear you creep up on me. Come on, sit \u2014 the water\'s nice this time of night. What\'s on your mind?",a:1,next:[1,2,3]},
  {id:1,t:"What is this place?",r:"Old public pool. Shut down years ago, but nobody bothered to tell the water to stop glowing pretty like that. I come here when I want to be alone. Or... not alone, depending on who wanders by.",a:1,next:[4]},
  {id:2,t:"What\'s with all those spots?",r:"*grins, tail flicking* Curious little thing, aren\'t you? Let\'s just say every spot\'s got a story. Some of those stories... are still going. You keep asking questions like that, you might end up part of one.",a:2,next:[4]},
  {id:3,t:"You seem hungrier than the others...",r:"Heh. Perceptive. Most predators just want to hold onto something. Me? I want to *keep* it. All the way. There\'s a difference, and it\'s a good one \u2014 trust me.",a:2,next:[4]},
  {id:4,t:"Is it true you can... digest people?",r:"*soft, sly smile* Now why would you want to know that? ...Some things don\'t just get swallowed, sweetheart. Some things get absorbed. Become part of you. Permanently. Lucky for you, I only do that to the ones I really, really like.",a:3,next:[]},
],
wolf:[
  {id:0,r:"Heh, you're up here talkin' to me instead of running for the escape pod. Ballsy. Or dumb. What's on your mind, kid?",a:1,next:[1,2,3]},
  {id:1,t:"How'd you get this ship?",r:"Won it fair and square in a bounty dispute. Some things you take, some things you earn. This ship? Earned it the hard way. Same as everything else I've got.",a:2,next:[4]},
  {id:2,t:"Do you miss your old crew?",r:"...Sometimes. Ship gets quiet without a squad backing you up. But hey, silver lining \u2014 more room for you now. Funny how that works out.",a:2,next:[4]},
  {id:3,t:"Why'd you keep me here?",r:"Because you didn't run. Because you looked me in the eye instead of bolting for the airlock. That earns you a permanent seat on this ship \u2014 preferably somewhere close. Real close.",a:3,next:[4]},
  {id:4,t:"Ever gonna let me go?",r:"Let you go? Kid, you're the best thing that's docked on this ship in years. Get comfortable. Star Wolf doesn't give refunds.",a:1,next:[]},
],
glacia:[
  {id:0,r:"You came back. Interesting. Most don't return to the cold twice. What is it you want to know?",a:1,next:[1,2,3]},
  {id:1,t:"Why do you live all the way out here?",r:"The cave is quiet. Honest. Warmth complicates things \u2014 feelings, decisions, mistakes. Out here, everything stays crystal clear. Mostly.",a:2,next:[4]},
  {id:2,t:"Are you always this cool and composed?",r:"Usually, yes. It's rather effortless when you're an ice-type. Though... you seem to be one of the few things that unsettles that composure. Curious.",a:2,next:[4]},
  {id:3,t:"Why did you keep me?",r:"Because warmth found its way into my cave, and I decided I quite liked it. Rare things are worth preserving carefully. Permanently, in this case.",a:3,next:[4]},
  {id:4,t:"Will the ice ever melt?",r:"For you? Perhaps already has, a little. Don't tell the others. I do have a reputation to maintain, even from in here.",a:1,next:[]},
],
riko:[
  {id:0,r:"Oh, YOU\'re back. Most people don\'t visit a low-level mob twice. Either you\'re braver than most or dumber than most. Which is it?",a:1,next:[1,2,3]},
  {id:1,t:"What\'s your deal anyway?",r:"Me? I\'m a nobody. Level 3 mob, weakest in the district. Can\'t fight, can\'t cast, can\'t do squat \u2014 except one thing. *taps belly* I can put things in here that shouldn\'t fit. Strong things. Big things. And they don\'t come back out.",a:2,next:[4]},
  {id:2,t:"Who\'s in your belly right now?",r:"Heh, you noticed? *pats gut* Level 40 barbarian. Big guy, huge axe, zero brain cells. Thought he could farm me for XP. Now he\'s my warm little roommate. He\'s STILL grumbling in there \u2014 been three days. Very stubborn man.",a:2,next:[4]},
  {id:3,t:"Why don\'t you just eat me then?",r:"...I could. Easy. You\'re what, level 15? Light snack. But... *looks away, ears twitching* I don\'t want to. Not you. You actually talk to me like I\'m a person, not a loot pinata. That\'s... rare, down here.",a:3,next:[4]},
  {id:4,t:"Ever think about leveling up normally?",r:"And do what? Become another generic mid-boss? Get farmed by adventurers for drops? Nah. I like being the weak one with the secret. Nobody expects you, nobody respects you, nobody sees you coming. That\'s the whole game, friend.",a:1,next:[]},
],
zero:[
  {id:0,r:"You came back to the hollow. Most people hear an impossible voice once and spend the rest of the night denying it. You listened. What do you want to know?",a:1,next:[1,2,3]},
  {id:1,t:"Why did you call me?",r:"Because your thoughts were loud enough to reach through the illusion. I wanted to know whether the person beneath them would answer. You did. That makes you unusual.",a:2,next:[4]},
  {id:2,t:"What is the difference between you and Luce?",r:"I make the dark convincing. Luce makes it gentle. I guard the edges; she fills the center with warmth. We are twins, not reflections.",a:2,next:[4]},
  {id:3,t:"What happens if I stay?",r:"The city becomes harder to remember, but never because I force it from you. My belly keeps what you willingly give it: noise, fear, the need to keep moving. You can still choose.",a:3,next:[4]},
  {id:4,t:"Can I hear the voice again?",r:"You are hearing it now. Come closer, little star. I will let the illusion close only as far as you ask.",a:3,next:[]},
],
luce:[
  {id:0,r:"The moon looks kinder when you return. Zero pretends not to worry, but he has been watching the path since you left. What would you like to ask me?",a:1,next:[1,2,3]},
  {id:1,t:"How do you make the haunting feel safe?",r:"I do not erase the frightening parts. I give them a hand to hold. Hisuian ghosts know something about being remembered badly; I would rather be remembered as warm.",a:2,next:[4]},
  {id:2,t:"Do you and Zero share everything?",r:"Not everything. We share a voice, a home, and the instinct to keep watch. But my dreams are mine, and his shadows are his. That is why choosing one of us still matters.",a:2,next:[4]},
  {id:3,t:"Would you let me wake up?",r:"If you asked, yes. I would be sad, but I would open every door. If you stay, though, I will make the dream beautiful enough that waking feels like the stranger choice.",a:3,next:[4]},
  {id:4,t:"Can I stay with both of you?",r:"Of course. Zero can guard the outside while I hold you close. The hollow has room for every honest choice.",a:3,next:[]}
],
nyx:[
  {id:0,r:"*bell jingles softly* Back again? Good. The route doesn\'t end just because you close your eyes. Sit with me a while.",a:0,next:[1,2,3]},
  {id:1,t:"What do you deliver?",r:"Dreams. The good ones go in silk envelopes. The dangerous ones get a bell tied to them. I carry both \u2014 that\'s the job.",a:2,next:[4]},
  {id:2,t:"Do you ever get lost?",r:"*shakes head* The lanterns are a map. Each one is a door. I\'ve walked this route so many times the city dreams it for me now.",a:1,next:[4]},
  {id:3,t:"You seem lonely up here.",r:"*pauses* The night is not lonely. It is... full of sleeping windows. But yes. Sometimes I wish someone would stay awake with me on the route.",a:3,next:[4]},
  {id:4,t:"I\'ll stay on the route with you.",r:"*bell rings* Good answer. The lanterns are lighting up. Follow me across the rooftops \u2014 the city is dreaming, and we have work to do.",a:3,next:[]}
],

    try{const m=localStorage.getItem('snd_muted');if(m!==null)this.muted=m==='true';const v=localStorage.getItem('snd_volume');if(v!==null)this.volume=Math.max(0,Math.min(100,parseInt(v,10)||100));const mm=localStorage.getItem('snd_music_muted');if(mm!==null)this.musicMuted=mm==='true'}catch(e){}

  },

      neg: ["That's it? THAT'S IT?! I've eaten better responses than that!", "Ugh, you're worse than Beerus! And that's saying something!", "What is WRONG with you? I was rooting for you!"],
      neu: ["Eh, could be better. Could be worse. Mostly worse.", "Meh. I've seen worse. Not from someone I liked though.", "Alright I guess. Want some food? It helps me think."]
    },
    husk: {

      neg: ["Are you KIDDING me right now?", "Ugh. You're killing me here. And not in the fun way.", "That's what you went with? In my bar? To MY face?"],
      neu: ["Eh. Could be worse. Not great, but could be worse.", "Sure, whatever. You do you, kid.", "...Interesting. I've seen worse at the poker table."]
    },
    vox: {

      neg: ["Error 404: Good choice not found. Try again.", "You're testing my patience. I have a VERY low tolerance for failure.", "That was... disappointing. Filing that under 'delete'."],
      neu: ["Hmm. Interesting data point. Filing that away.", "Noted. Not great, not terrible. Adequate.", "Curious. Tell me more. Or don't. I'll figure you out regardless."]
    },
    anubis: {
      pos: ["Heh. Not bad. You might just earn my respect yet.", "Hmph. Color me impressed. Don't let it go to your head.", "That's the kind of nerve I like to see. Good."],
      neg: ["Tch. Weak. I expected more from you.", "That's disappointing. Even temple recruits do better.", "Really? That's what you're going with? Pathetic."],
      neu: ["Hmm. Not bad, not great. You'll need to do better.", "Acceptable, I suppose. Barely.", "...Interesting. I'll keep watching you."]
    },

      neg: ["GRAAH! Why would you do that?!", "*sad rumble* ...That hurt the great ape's feelings.", "No. Wrong. The great ape is displeased. Try again, little one."],
      neu: ["Hmm. *sniffs you carefully* The great ape considers this.", "You are... strange. But not unpleasant. *gentle huff*", "...Interesting, little one. The great ape is watching you."]
    }
  };

function isPrey(cid){for(var p in S.bp){if(getPets(p).indexOf(cid)!==-1)return true}return false}

  return fomoLead+"What about the ones you keep?\" Fomo's ears lift as he hugs his belly. \"They're "+summary+". I don't want anyone to be lonely, okay? They can stay as long as they need.\"";

function getHomeLoc(cid){for(var i=0;i<LOC.length;i++){if(LOC[i].chars&&LOC[i].chars.indexOf(cid)!==-1)return LOC[i].id}return null}
function initWorld(){
  if(!S.cpos||Object.keys(S.cpos).length===0){
    S.cpos={};C.forEach((c)=>{var home=getHomeLoc(c.id);S.cpos[c.id]=home||"home"});
  }
  if(!S.bp)S.bp={};
  if(!S.bd)S.bd={};
  for(var pn in S.bp){if(typeof S.bp[pn]==="string")S.bp[pn]=[S.bp[pn]]}
  if(S.worldDay===undefined)S.worldDay=S.day;
}
function updateWorld(){
  initWorld();
  // Characters only move when the day changes, not on every time-of-day tick
  if(S.worldDay!==S.day){
    S.worldDay=S.day;
    C.forEach((c)=>{
    if(!isDiscovered(c.id)||isPrey(c.id))return;
    if(Math.random()<0.3){
      var locs=LOC.filter((l)=>{return l.id!=="home"});
      S.cpos[c.id]=locs[Math.floor(Math.random()*locs.length)].id;
    }else{
      var home=getHomeLoc(c.id);if(home)S.cpos[c.id]=home;
    }
  });
  // ==== BELLY PET CYCLE v4 ====
  // Riko is the only character with a strength drain. At 50% an occupant's
  // escape route seals permanently, but the drain continues to 100%.
  // Other hosts do not inherit Riko's drain mechanic.
  var notes=[];
  C.forEach((c)=>{
    var pets=getPets(c.id);
    if(pets.length===0)return;
    S.bd[c.id]=S.bd[c.id]||{};
    var out=[];
    pets.forEach((pid)=>{
      var g=gc(pid);
      if(c.id==="riko"){
        var previous=S.bd[c.id][pid]||0;
        var d=Math.min(100,previous+10);
        S.bd[c.id][pid]=d;
        if(previous<50&&d>=50){
          S.ach=S.ach||{};S.ach.keep=true;
          notes.push(g.name+" hit 50% drain in Riko\'s belly. Escape sealed permanently; drain continues.");
        }else if(previous<100&&d>=100){
          notes.push(g.name+" reached 100% drain in Riko\'s belly. Completely settled.");
        }
        if(d<50&&Math.random()<0.3){
          delete S.bd[c.id][pid];
          notes.push(g.name+" escaped Riko\'s belly at "+Math.round(d)+"% drain.");
        }else{
          out.push(pid);
        }
      }else if(c.id==="aether"){
        delete S.bd[c.id][pid];
        notes.push(g.name+" rested in Aether\'s belly and left refreshed.");
      }else if(c.id==="luna"){out.push(pid);if(isLunaRegressed(pid)){notes.push(g.name+" stays curled up in Luna\'s womb as a content Riolu kit.");}else{notes.push(g.name+" rests peacefully in Luna\'s womb.");}}else{
        delete S.bd[c.id][pid];
        out.push(pid);
      }
    });
    if(out.length===0)delete S.bp[c.id];else S.bp[c.id]=out;
  });
  // Riko: 45% chance per day to hold ALL his options at once, each with their own drain
  var avail=C.map((c)=>{return c.id}).filter((id)=>{return isDiscovered(id)&&!isPrey(id)});
  var RIKO_PREY=["vegeta","champa","wolf","anubis"];
  if(avail.indexOf("riko")!==-1&&Math.random()<0.45){
      var opts=RIKO_PREY.filter((id)=>{return avail.indexOf(id)!==-1&&!isBellyHost(id)});
    if(opts.length>0){
      var existing=getPets("riko");
      var merged=existing.slice();
      opts.forEach((id)=>{if(merged.indexOf(id)===-1)merged.push(id)});
      S.bp.riko=merged;
      S.bd.riko=S.bd.riko||{};
      opts.forEach((id)=>{S.bd.riko[id]=S.bd.riko[id]||0;S.cpos[id]=S.cpos["riko"]});
      opts.forEach((id)=>{avail.splice(avail.indexOf(id),1)});
      avail.splice(avail.indexOf("riko"),1);
      if(merged.length>=4){S.ach=S.ach||{};S.ach.fullHouse=true;}
      // Check if all 4 permanent prey are kept (drain>=50) and player hasn't been offered
      if(!S.rikoOfferMade){
        var keptCount=0;
        var rikoPets=getPets("riko");
        rikoPets.forEach(function(pid){if(pid!=="player"&&petDrain("riko",pid)>=50)keptCount++});
        if(keptCount>=4){
          S.rikoOfferMade=true;
          // Check affection - if >=65, trigger the offer event
          var rikoAff=S.af||0;
          if(S.cid==="riko")rikoAff=S.af;
          // Also check stored affection in S.dated
          if(S.dated&&S.dated.riko)rikoAff=Math.max(rikoAff,S.dated.riko);
          if(rikoAff>=65){
            S.scr="rikoOffer";sv();return;
          }else{
            notes.push("Riko eyes you from across the city, belly full and round. \u201cSoon,\u201d he mouths silently. You shiver.");
          }
        }
      }
      notes.push("Riko swallowed "+opts.map((id)=>gc(id).name).join(", ")+" in one go. "+merged.length+" occupants now, each draining separately.");
    }
  }
  // Everyone can belly pet anyone now: up to 2 fresh pairs per day
  var tries=0;
  var preyAvail=avail.filter((id)=>{return !isBellyHost(id)&&id!=="fomo"});
  while(tries<2&&avail.length>=2&&preyAvail.length>0){
    tries++;
    if(Math.random()<0.65){
      var pi=Math.floor(Math.random()*avail.length);var pred=avail.splice(pi,1)[0];
      var predPreyIndex=preyAvail.indexOf(pred);
      if(predPreyIndex!==-1)preyAvail.splice(predPreyIndex,1);
      if(preyAvail.length===0)break;
      var yi=Math.floor(Math.random()*preyAvail.length);var prey=preyAvail.splice(yi,1)[0];
      var preyAvailIndex=avail.indexOf(prey);
      if(preyAvailIndex!==-1)avail.splice(preyAvailIndex,1);
      S.bp[pred]=[prey];S.bd[pred]=S.bd[pred]||{};S.bd[pred][prey]=(gc(pred).dr||7)<0?30:0;
      S.cpos[prey]=S.cpos[pred];
      var regNote="";if(pred==="luna"&&prey!=="aether"&&Math.random()<0.25){S.lunaRegs=S.lunaRegs||{};S.lunaRegs[prey]=true;regNote=" (regressed into a Riolu kit!)"}notes.push(gc(pred).name+" swallowed "+gc(prey).name+"."+regNote);
    }else break;
  }
  if(notes.length>0)toast("\u{1F47D} "+notes.slice(0,3).join(" ")+(notes.length>3?" (+"+(notes.length-3)+" more)":""));
  }
  sv();
  // Check for special day event
  if(DAY_EVENTS[S.day]&&S.dayEventShown!==S.day){S.dayEventShown=S.day;S.scr="dayEvent";sv();return}

  // Riko returns after being gone for 3 days
  if(S.rikoGone&&S.rikoGoneDay>0&&(S.day-S.rikoGoneDay)>=3){
    S.rikoGone=false;
    S.rikoGoneDay=0;
    notes.push("Riko has returned to Destiny City, belly swaying with his permanent collection.");
  }
}

function evalBranchCond(cond,cid){
  S.branches=S.branches||{};
  if(cond===true)return true;
  if(typeof cond==="string"){
    // Check if branch flag is set
    return !!S.branches[cid+"_"+cond];
  }
  if(cond.not){
    // Negative check - scene shows if branch NOT taken
    return !S.branches[cid+"_"+cond.not];
  }
  if(cond.any){
    // Any of these branches
    return cond.any.some((b)=>S.branches[cid+"_"+b]);
  }
  return true;
}

// VN Engine core
let twTimer=null, twIdx=0, twFull="";
function startTypewriter(text, cb){
  stopTypewriter();
  twFull=text; twIdx=0;
  const el=document.getElementById("tw");
  if(!el)return;
  el.innerHTML='<span id="twc"></span>';
  var ts=S.settings||{};
  const speed=(!ts.typewriter||ts.textSpeed===0)?0:(S.skip?8:(ts.textSpeed||35));
  if(speed===0){el.innerHTML=twFull;if(cb)cb();return}
  twTimer=setInterval(()=>{SND.play("type");
    if(twIdx>=twFull.length){stopTypewriter();if(cb)cb();return}
    twIdx++;
    el.innerHTML=twFull.substring(0,twIdx)+'<span class="twc"></span>';
  },speed);
  // Tap to skip typewriter - use addEventListener for better mobile support
  var dbox=el.parentElement;
  dbox.addEventListener('click',(ev)=>{
    if(twIdx<twFull.length){stopTypewriter();el.innerHTML=twFull;if(cb)cb()}
    else if(cb)cb();
  });
  dbox.style.cursor='pointer';
}
function stopTypewriter(){if(twTimer){clearInterval(twTimer);twTimer=null}}
function showChoices(){const ch=document.getElementById("ch");if(ch){ch.style.display="flex";ch.style.opacity="1";ch.style.animation="f .3s forwards"}}
function vnAdvance(){
  if(twIdx<twFull.length){stopTypewriter();const el=document.getElementById("tw");if(el)el.innerHTML=twFull;showChoices();return}
  S.si++;R();
}
function fade(cb){const f=document.getElementById("fade");if(!f){cb();return}f.classList.add("show");setTimeout(()=>{cb();setTimeout(()=>f.classList.remove("show"),100)},300)}
function toggleAuto(){S.auto=!S.auto;toast(S.auto?"Auto-advance ON":"Auto-advance OFF");R()}
function toggleSkip(){S.skip=!S.skip;toast(S.skip?"Skip ON":"Skip OFF");R()}
function saveSlot(slot){
  const saves=JSON.parse(mem.get("dwd_saves")||"[]");
  saves[slot]={cid:S.cid,si:S.si,af:S.af,sc:S.sc,date:new Date().toISOString().substring(0,16).replace("T"," ")};
  mem.set("dwd_saves",JSON.stringify(saves));
  toast("Saved to slot "+(slot+1));
}
function loadSlot(slot){
  const saves=JSON.parse(mem.get("dwd_saves")||"[]");
  const s=saves[slot];
  if(!s)return;
  S.cid=s.cid;S.si=s.si;S.af=s.af;S.sc=s.sc;S.scr="vn";R();
}
function saveScreen(){
  const saves=JSON.parse(mem.get("dwd_saves")||"[]");
  let slots="";
  for(let i=0;i<3;i++){
    const s=saves[i];
    if(s){const c=gc(s.cid);slots+='<div class="slot" data-a="sl'+i+'"><div class="sh">Slot '+(i+1)+' — '+s.date+'</div><div class="sd">'+(c?c.name:'Unknown')+'</div><div class="ss">Scene '+(s.si+1)+' | ♥ '+s.af+' | Score '+s.sc+'</div></div>'}
    else{slots+='<div class="slot empty" data-a="sl'+i+'"><div class="sh">Slot '+(i+1)+'</div><div class="sd">Empty</div></div>'}
  }
  return '<div class="s"><div class="h"><button class="b bs" data-a="back2vn">← Back</button><h2>Save Game</h2></div><div class="sc"><div class="slots">'+slots+'</div></div></div>';
}
function loadScreen(){
  const saves=JSON.parse(mem.get("dwd_saves")||"[]");
  let slots="";
  for(let i=0;i<3;i++){
    const s=saves[i];
    if(s){const c=gc(s.cid);slots+='<div class="slot" data-a="ll'+i+'"><div class="sh">Slot '+(i+1)+' — '+s.date+'</div><div class="sd">'+(c?c.name:'Unknown')+'</div><div class="ss">Scene '+(s.si+1)+' | ♥ '+s.af+' | Score '+s.sc+'</div></div>'}
    else{slots+='<div class="slot empty"><div class="sh">Slot '+(i+1)+'</div><div class="sd">Empty</div></div>'}
  }
  return '<div class="s"><div class="h"><button class="b bs" data-a="back2vn">← Back</button><h2>Load Game</h2></div><div class="sc"><div class="slots">'+slots+'</div></div></div>';
}

else if(a==="sndMusicToggle"){var m=SND.toggleMusic();toast(m?"Music muted":"Music on");R()}if(a==="sndToggle"){SND.toggle();R()}

  else if(a==="dayEventChoice"){var event=DAY_EVENTS[S.day];var ch=event.choices[+el.dataset.idx];if(ch){S.coins=(S.coins||0)+(ch.r.coins||0);S.af=(S.af||0)+(ch.r.af||0);if(ch.r.drain){S.drain=(S.drain||0)+ch.r.drain}if(ch.r.ach){S.ach=S.ach||{};S.ach[ch.r.ach]=true;SND.play("levelup")}if(ch.r.twins){S.twinsUnlocked=true}S.stats=S.stats||{};S.stats.dayEvents=(S.stats.dayEvents||0)+1;sv();toast("\u{1F389} "+event.title+" complete!");S.scr="cityMap";R()}}
