const NGP={beerus:"Back again? Most mortals don't return for seconds.",champa:"Ooh, you're back! I knew you couldn't resist this belly twice!",husk:"You again? Either I'm growing on you or you've got a death wish.",vox:"Returning to the spider's web? Let's find out what you learned.",vegeta:"Hmph. You returned. Saiyans respect persistence.",anubis:"The wanderer returns. The desert always calls you home.",vincent:"Back already, mate? Step inside.",fomo:"You came back! I knew you'd miss me!",wolf:"Back for round two, pup? Don't expect me to hold back.",glacia:"You returned to the cold? Both brave and endearing.",riko:"Back again? I like easy targets who come back for more!",aether:"You came back. The stars told me you might return.",luna:"The tide returns. I knew you couldn't stay away.",nyx:"The night remembers you. You know the rules of my nest.",zero:"Ah, the repeat visitor. Let's see if knowing changes anything.",luce:"You came back despite knowing what I am. Both acceptable."};
C=[
{id:"beerus",name:"Beerus",sub:"God of Destruction",altEnd:"Beerus gazes at you with an intensity that transcends his usual lazy demeanor. \"You... you truly gave me everything,\" he murmurs, pulling you against his warm, soft middle. \"I never thought I would say this to a mortal. But you are not a mortal to me anymore. You are MINE. And I take care of what is mine.\" His belly envelops you completely, and for the first time, the God of Destruction seems at peace.",ac:"#7c3aed",dr:7,bg:"I.obelly",p:I.bp,e:I.be,badEnd:"Beerus barely glances at you as you turn to leave. 'That's it? You're giving up already?' He yawns, tail flicking dismissively. 'Pathetic. Don't waste a god's time if you can't commit to the belly. Come back when you've grown a spine.' The door slams behind you. You feel the sting of what could have been.",cg2:"",
 spr:{happy:I.bh,angry:I.ba,sad:I.bs,surprised:I.bu,blush:I.bl,smug:I.bm,belly:I.bbelly},
 d:"Lazy, powerful, obsessed with food. The universe's most dangerous napper.",
 s:[
  {sp:"Narrator",t:"You materialize on Beerus' planet. The God of Destruction sprawls on a floating cushion, snoring softly. Whis is nowhere in sight.",ex:"smug",ch:[{t:"Wake him gently",a:2,br:"strict"},{t:"Wait patiently",a:1,br:"soft"},{t:"Poke him",a:-2}]},
  {sp:"Beerus",t:"*narrows eyes* You approach with discipline. I respect that. Most mortals grovel. But you understand power.",ex:"smug",ch:[{t:"I learn from the strong",a:3},{t:"Discipline is everything",a:2}],cond:"strict"},{sp:"Beerus",t:"*stretches lazily* You are gentle. Unusual. Most who visit me are terrified. You just want to be here.",ex:"happy",ch:[{t:"I enjoy your company",a:3},{t:"Fear wastes energy",a:2}],cond:"soft"},{sp:"Beerus",t:"*chuckles* You make me laugh. When was the last time a mortal entertained a God of Destruction? You are something special.",ex:"happy",ch:[{t:"I live to entertain",a:2},{t:"Just being myself",a:3}],cond:"fun"},{sp:"Beerus",t:"*regards you solemnly* You take this seriously. I can see it in your eyes. You understand what it means to stand before destruction.",ex:"smug",ch:[{t:"I respect your role",a:3},{t:"I chose to be here",a:2}],cond:"serious"},{sp:"Beerus",t:"Mmm... who dares disturb the sleep of a God of Destruction? You have exactly three seconds to justify your existence.",ex:"angry",ch:[{t:"I brought you a gift",a:3},{t:"I came to see you",a:2},{t:"I-I'm sorry!",a:1}]},
  {sp:"Beerus",t:"A gift? You know how to please a god. What is it? It better be worth waking up for.",ex:"surprised",ch:[{t:"Your favorite pudding",a:3},{t:"A rare cosmic delicacy",a:2},{t:"Myself",a:1}]},
  {sp:"Beerus",t:"*Beerus's aura flares with divine energy. The air around you crackles with power.*\n\nYou chose to respect my authority. Good. Too many mortals forget their place. I am a GOD. The Destroyer of Universe 7.\n\n*He smirks, but there's warmth beneath the bravado.*\n\nBut you... you understood. You didn't try to be my equal. You tried to be my companion. That's different. That's... better.",ex:"smug",cond:"strict"},
    {sp:"Beerus",t:"*The two of you sit watching the sunset. For once, Beerus isn't demanding or intimidating. He's just... quiet. Content.* \n\nYou know... I don't let people see this side of me. Whis thinks I'm too soft. The other gods would laugh.\n\n*He looks at you with an unusually gentle expression.*\n\nBut you... you make me feel like it's okay to just BE. Not a god of destruction. Just... someone who likes chocolate and sunsets. That's... rare.",ex:"blush",cond:"soft"},
    {sp:"Narrator",t:"Beerus' golden eyes light up. He devours the offering with terrifying, god-like speed. A satisfied purr rumbles through the planet.",ex:"happy",ch:[{t:"I can cook more anytime",a:3},{t:"Watch in awe",a:2},{t:"That was my lunch...",a:-1}]},
  {sp:"Beerus",t:"You amuse me, mortal. More than any food ever has. Perhaps I should keep you around... permanently.",ex:"smug",ch:[{t:"I'd like that",a:3},{t:"Keep me close",a:2},{t:"As what exactly?",a:1}]},
  {sp:"Beerus",t:"As my little belly pet. You'll live inside me, warm and safe forever. A god needs companionship, after all.",ex:"blush",ch:[{t:"Yes, my God",a:3,end:1},{t:"I'm scared but... yes",a:2,end:1},{t:"Absolutely not!",a:-3,back:4}]},
  {sp:"ENDING",t:"Beerus opens his mouth, warm divine energy flowing around you. You slip inside the God of Destruction like sinking into a warm bath. His belly is a cozy pocket dimension — soft, warm, glowing with golden light. You curl up like a pet as Beerus purrs in his sleep. You are Beerus' belly pet — cherished by a god.",ex:"happy",end:1}
 ]},
{id:"champa",name:"Champa",altEnd:"Champa's round face breaks into the biggest grin you've ever seen. \"You ACTUALLY stayed! Nobody stays!\" He squeezes you against his enormous belly, giggling. \"You're different. You're SPECIAL. And I'm gonna keep you forever and ever and... *sniffles* ...I'm not crying, you're crying! Get in here!\" He swallows you up with the biggest, happiest gulp of his life.",sub:"God of Destruction (U6)",ac:"#ea580c",dr:7,bg:"I.obelly",p:I.cp,e:I.ce,badEnd:"Champa's grin fades into a disappointed sigh. 'Huh. You're really just gonna leave? After all that?' He crosses his arms over his massive belly. 'Whatever. I've got snacks that stick around longer than you.' You hear him crunching on chips as you walk away, but you catch the slight hurt in his voice.",
 spr:{happy:I.ch,angry:I.ca,sad:I.cs,surprised:I.cu,blush:I.cl,smug:I.cm,belly:I.cbelly},
 d:"Gluttonous, competitive, surprisingly lovable. Will fight you for the last dumpling.",
 s:[
  {sp:"Narrator",t:"You find Champa at a universe food tournament, surrounded by towers of empty plates. Vados watches with mild concern.",ex:"happy",ch:[{t:"Impressive eating!",a:2,br:"fun"},{t:"Can I cook for you?",a:3,br:"serious"},{t:"You ate ALL that?",a:1}]},
  {sp:"Champa",t:"*grins through a mouthful* You are fun! Most people are so stiff around me. But you? You get it. Life is too short not to enjoy every bite!",ex:"happy",ch:[{t:"Pass me some!",a:3},{t:"You are refreshing",a:2}],cond:"fun"},{sp:"Champa",t:"*sets down his food* You are serious about this. About us. That is rare. Most just want to be near a god for the status.",ex:"surprised",ch:[{t:"I care about you",a:3},{t:"Status means nothing",a:2}],cond:"serious"},{sp:"Champa",t:"*beams* Honest! You are actually honest with me. Do you know how rare that is? Everyone else just tells me what I want to hear.",ex:"happy",ch:[{t:"Always honest with you",a:3},{t:"You deserve truth",a:2}],cond:"honest"},{sp:"Champa",t:"*leans closer* Flirting with a God of Destruction? Bold. I like bold. Most mortals cower. You lean in.",ex:"smug",ch:[{t:"I know what I want",a:3},{t:"You are worth the risk",a:2}],cond:"flirty"},{sp:"Champa",t:"Heh! You think that's impressive? I haven't even started yet! Vados, get this mortal a chair!",ex:"smug",ch:[{t:"I have a recipe you'd love",a:3},{t:"I bet you could eat more",a:2},{t:"Show me what you got",a:1}]},
  {sp:"Narrator",t:"You present your homemade dish. Champa's eyes go wide, his tail puffing up with excitement.",ex:"surprised",ch:[{t:"It's a family recipe",a:2},{t:"Made it just for you",a:3},{t:"It's nothing special",a:1}]},
  {sp:"Champa",t:"*devours the entire dish in seconds* THIS IS AMAZING! You're not allowed to leave!",ex:"happy",ch:[{t:"I can make more!",a:3},{t:"I'm glad you like it",a:2},{t:"Want seconds?",a:3}]},
  {sp:"Champa",t:"Nobody cooks for me like that. Not even Vados! You're staying with me now, no arguments!",ex:"smug",ch:[{t:"Forever?",a:2},{t:"I'd love to",a:3},{t:"Where would I stay?",a:1}]},
  {sp:"Champa",t:"Right here! In my belly! Nice and warm, just the two of us!",ex:"blush",ch:[{t:"That sounds perfect",a:3,end:1},{t:"You want to eat me?",a:2,end:1},{t:"No way!",a:-3,back:4}]},
  {sp:"ENDING",t:"Champa grins and opens wide. With a happy gulp, you're inside the chubby God of Destruction. His belly is warm and soft like a giant fluffy pillow. You snuggle in as Champa pats his tummy happily. 'Now you can cook for me from the inside!' You are Champa's belly pet — living the warm, well-fed life.",ex:"happy",end:1}
 ]},
{id:"husk",name:"Husk",altEnd:"Husk takes a long drag from his bottle, then looks at you with surprisingly soft eyes. \"You know... I haven't felt this way about anyone. Not since I was alive.\" He pulls you close, his belly warm against you. \"Stay. Just... stay. Please.\" The word 'please' from Husk carries more weight than any deity's command.",sub:"Bartender of Hazbin Hotel",ac:"#dc2626",bg:"I.obelly",p:I.hp,e:I.he,badEnd:"Husk takes a long drag and blows smoke toward the ceiling. 'Right. That's it then.' His tail is still, ears flat. 'Don't feel bad. Most people leave. The belly ain't for everyone.' He takes another drink. 'Door's that way.' But as you leave, you hear him mutter: '...could've been different.'",
 spr:{happy:I.hh,angry:I.ha,sad:I.hs,surprised:I.hu,blush:I.hl,smug:I.hm,belly:I.hbelly},
 d:"Grumpy cat demon, gambling addict, surprisingly tender when you get past the sarcasm.",
 s:[
  {sp:"Narrator",t:"You walk into the Hazbin Hotel bar. A grumpy cat demon with wings is cleaning a glass, not looking up.",ex:"smug",ch:[{t:"Whiskey, neat",a:3,br:"honest"},{t:"Something sweet",a:2,br:"flirty"},{t:"Just water please",a:-1}]},
  {sp:"Husk",t:"*flicks ear* Honest, huh? Most people lie through their teeth in this place. You just say what you mean. It is weird. I kind of like it.",ex:"surprised",ch:[{t:"No point in lying",a:3},{t:"You deserve honesty",a:2}],cond:"honest"},{sp:"Husk",t:"*raises eyebrow* Flirting? With me? *chuckles* You have got nerve. I will give you that.",ex:"smug",ch:[{t:"You are worth it",a:3},{t:"Just stating facts",a:2}],cond:"flirty"},{sp:"Husk",t:"*clenches fist* You are ambitious. I can see it. You want something from this world. Reminds me of someone I used to be.",ex:"angry",ch:[{t:"Who were you before?",a:3},{t:"I fight for what matters",a:2}],cond:"ambitious"},{sp:"Husk",t:"*sighs* You are gentle. Too gentle for a place like this. But maybe that is not a bad thing.",ex:"sad",ch:[{t:"Gentleness is strength",a:3},{t:"I am not fragile",a:2}],cond:"gentle"},{sp:"Husk",t:"Heh. You got taste. Most people stumble in here ordering dumb rainbow drinks. Sit down.",ex:"smug",ch:[{t:"I know what I like",a:2},{t:"You seem interesting",a:3},{t:"Just thirsty",a:1}]},
  {sp:"Narrator",t:"You settle onto a barstool. Husk slides your drink over with a lazy smirk. The bar is quiet, just the two of you.",ex:"happy",ch:[{t:"Want to play a game?",a:3},{t:"Tell me about yourself",a:2},{t:"What's the bet?",a:2}]},
  {sp:"Husk",t:"*Husk puts down the bottle. For once, his eyes are clear and focused on you.*\n\nYou know, I used to be an Overlord. Had power, respect, everything. And I threw it all away for this. *gestures at the bar*\n\nBut you... you don't judge me for it. You just... sit here. Talk to me. Like I'm worth something beyond my past.\n\n*He smiles, a real one this time.* Maybe that's worth more than any soul deal ever was.",ex:"blush",cond:"honest"},
    {sp:"Husk",t:"Poker? With me? You're either brave or stupid. I like both. I never lose.",ex:"smug",ch:[{t:"I'm feeling lucky",a:3},{t:"Loser owes a favor",a:3},{t:"Just for fun",a:1}]},
  {sp:"Narrator",t:"You lose the hand. Husk lays down his cards with a lazy grin. 'You owe me, kid.' His eyes glint with something unexpected.",ex:"surprised",ch:[{t:"Name your price",a:3},{t:"I'm all yours",a:3},{t:"Double or nothing?",a:1}]},
  {sp:"Husk",t:"The price is... you stay with me. In here. Warm and cozy in my gut. Forever. I don't want you walking out that door.",ex:"blush",ch:[{t:"Deal",a:3,end:1},{t:"You want to... eat me?",a:2,end:1},{t:"That's crazy",a:-2,back:4}]},
  {sp:"ENDING",t:"Husk finishes his drink and picks you up gently. 'Nothing personal, kid. Just... don't want to be alone anymore.' You slide down into the grumpy cat demon. His belly is warm, a bit messy, but surprisingly comfortable — like the back booth of his favorite bar. You are Husk's belly pet. Home sweet home.",ex:"happy",end:1}
 ]},
{id:"vox",name:"Vox",sub:"CEO of VoxTek",ac:"#06b6d4",bg:"I.obelly",p:I.vp,e:I.ve,badEnd:"Vox's many eyes blink slowly, then narrow. 'How... disappointing.' The webs around you dim and retract. 'I offered you something most mortals never see, and you fumble it. Leave. Return to your boring little life.' The silk unspools from around you, cold where it had been warm. 'Don't come back unless you mean it.'",
 spr:{happy:I.vh,angry:I.va,sad:I.vs,surprised:I.vu,blush:I.vl,smug:I.vm,belly:I.vbelly,altEnd:'Vox\'s confident smirk falters. The screens flicker. \"I... don\'t want to lose this,\" he admits. \"Stay. Not because the ratings are good — because you make me feel real.\" In the glow of a thousand screens, the TV demon found something he never broadcasts: vulnerability.'},
 d:"Charismatic TV demon, tech mogul, control freak. Wants to own everything — including you.",
 s:[
  {sp:"Narrator",t:"You enter Vox's penthouse office. Screens cover every wall. The TV demon turns to face you, his screen flickering with curiosity.",ex:"smug",ch:[{t:"Nice place",a:2,br:"ambitious"},{t:"You're more impressive in person",a:3,br:"humble"},{t:"Hi",a:1}]},
  {sp:"Vox",t:"*leans forward* Ambitious. I can smell it on you. The hunger for more. *grins* I can work with that.",ex:"smug",ch:[{t:"I want everything",a:3},{t:"Show me the way",a:2}],cond:"ambitious"},{sp:"Vox",t:"*softens slightly* Humble. In a world full of backstabbers, you stay grounded. That takes real strength.",ex:"surprised",ch:[{t:"I know who I am",a:3},{t:"Humble not weak",a:2}],cond:"humble"},{sp:"Vox",t:"*cracks knuckles* A warrior spirit. I respect that. In business or battle, the strong survive.",ex:"smug",ch:[{t:"I fight for what is mine",a:3},{t:"Survival is everything",a:2}],cond:"warrior"},{sp:"Vox",t:"*voice smooths* Gentle. Interesting. Most who seek my attention are sharks. You are different.",ex:"surprised",ch:[{t:"Not everyone bites",a:3},{t:"Let your guard down",a:2}],cond:"gentle"},{sp:"Vox",t:"Of course it is. I designed every pixel. And you're... new. Consider yourself exclusive content.",ex:"smug",ch:[{t:"I'm here for you",a:3},{t:"I'm your biggest fan",a:2},{t:"Just passing by",a:-1}]},
  {sp:"Narrator",t:"Vox moves closer, digital energy crackling between you. His screen shifts through colors — interested.",ex:"surprised",ch:[{t:"Show me your empire",a:3},{t:"Tell me your secrets",a:2},{t:"You're beautiful",a:3}]},
  {sp:"Vox",t:"*Vox's screens flicker with excitement. He pulls you closer, his screen face glowing.*\n\nYou want POWER. I can see it in your eyes. The same hunger that built my empire.\n\n*He leans in, voice dropping to a whisper.*\n\nTogether, we could OWN this city. Every soul, every deal, every screen. You and me, at the top. What do you say, darling?",ex:"smug",cond:"ambitious"},
    {sp:"Vox",t:"Beautiful? Ha. I'm more than that. I'm the future of entertainment. I AM the screen everyone watches.",ex:"smug",ch:[{t:"I believe it",a:2},{t:"Show me the future",a:3},{t:"You're my future",a:3}]},
  {sp:"Narrator",t:"Vox takes your hand. A jolt of digital energy flows through you. His screen shows a heart for a split second.",ex:"blush",ch:[{t:"I don't want to leave",a:3},{t:"Keep me here",a:3},{t:"This is moving fast",a:1}]},
  {sp:"Vox",t:"Good. Because you're not leaving. You're going inside me — permanently. My most exclusive content.",ex:"smug",ch:[{t:"I'm yours",a:3,end:1},{t:"Inside... you?",a:2,end:1},{t:"Let me go",a:-3,back:4}]},
  {sp:"ENDING",t:"Vox's screen flickers with a bright smile. 'Welcome to prime time.' Digital energy flows around you as you're pulled into the TV demon. Inside, it's like a cozy digital apartment — screens, ambient blue lighting, perfect temperature. You are Vox's belly pet — his most exclusive content.",ex:"happy",end:1}
 ]},
{id:"vegeta",name:"Great Ape Vegeta",sub:"Oozaru Saiyan",ac:"#16a34a",bg:"I.obelly",p:I.gp,e:I.ge,badEnd:"Vegeta turns away, arms crossed. 'Tch. I expected more from someone who dared approach the Prince.' His tail lashes once. 'You're not ready for this power. Go train. Get stronger. And maybe — MAYBE — I'll consider you worthy of a second chance.' You leave feeling the weight of his judgment heavier than any belly.",
 spr:{happy:I.gh,angry:I.ga,sad:I.gs,surprised:I.gu,blush:I.gl,smug:I.gm,belly:I.gbelly,altEnd:'Vegeta clenches his fists. \"Kakarot would laugh if he saw me now,\" he mutters. Then quieter: \"But I don\'t care what he thinks. Not anymore.\" He pulls you against his chest. \"You\'re my strength now. Not some Saiyan legacy. You.\"'},
 d:"A towering were-ape under the full moon. Terrifyingly powerful, surprisingly gentle.",
 s:[
  {sp:"Narrator",t:"Under a full moon, a massive Oozaru towers over the landscape. His glowing red eyes find you. The ground shakes with each step.",ex:"angry",ch:[{t:"Stand your ground",a:3},{t:"Bow respectfully",a:2},{t:"RUN!",a:-3}]},
  {sp:"Vegeta",t:"*smirks* A warrior. I knew it the moment I saw you. You do not flinch. You do not grovel. You stand. That earns you respect.",ex:"smug",ch:[{t:"I train every day",a:3},{t:"Respect is earned",a:2}],cond:"warrior"},{sp:"Vegeta",t:"*uncrosses arms* Gentle? Hmph. I have seen what gentleness gets you in this universe. But perhaps I have been wrong to dismiss it entirely.",ex:"surprised",ch:[{t:"Gentleness is not weakness",a:3},{t:"Even Saiyans need rest",a:2}],cond:"gentle"},{sp:"Narrator",t:"The great ape kneels down, sniffing you curiously. He doesn't attack. A low rumble emanates from his massive chest.",ex:"surprised",ch:[{t:"Offer him food",a:3},{t:"Touch his fur",a:2},{t:"Stay perfectly still",a:1}]},
  {sp:"Narrator",t:"The Oozaru lets out a deep rumble. Almost... a purr? His red eyes soften. He seems to like you.",ex:"happy",ch:[{t:"You're magnificent",a:3},{t:"Can I climb on you?",a:2},{t:"You won't hurt me?",a:1}]},
  {sp:"Narrator",t:"You climb onto his massive shoulder. The world looks so small from up here. Wind whips through his brown fur as he gazes at the moon.",ex:"happy",ch:[{t:"This is incredible",a:3},{t:"I feel safe with you",a:3},{t:"Don't drop me!",a:-1}]},
  {sp:"Narrator",t:"The great ape cups you gently in his enormous palm. His eyes are warm now. He brings you closer to his face.",ex:"blush",ch:[{t:"I belong with you",a:3},{t:"Protect me",a:2},{t:"What happens now?",a:1}]},
  {sp:"Narrator",t:"The Oozaru opens his mighty maw slowly, carefully. He wants to keep you safe inside him.",ex:"sad",ch:[{t:"I trust you",a:3,end:1},{t:"Will I be safe in there?",a:2,end:1},{t:"NO!",a:-3,back:4}]},
  {sp:"ENDING",t:"The massive Oozaru carefully lifts you to his maw. His red eyes soften as he opens wide, gentle despite his enormous size. You slide down into his great belly — warm, vast, like sleeping inside a mountain that breathes. His heartbeat surrounds you like a lullaby. You are the Great Ape's belly pet — protected by the most powerful creature in the universe.",ex:"happy",end:1}
 ]}

,{id:"anubis",name:"Anubis",sub:"Jackal Warrior of the Sands",ac:"#0ea5e9",dr:8,bg:I.ab,p:I.ap,e:I.ae,badEnd:"Anubis stands and turns toward the desert, his back to you. 'The jackal guards the gates of the dead. Not the gates of the weak.' His ears are flat, his voice distant. 'Return when you have courage. The sands will remember you.' He vanishes into the heat shimmer, and you're left alone at the empty shrine.",
 spr:{happy:I.ah,angry:I.aan,sad:I.asd,surprised:I.au,blush:I.al,smug:I.am,belly:I.abelly,altEnd:'The warrior\'s tough exterior cracks. Anubis nuzzles against you, tail wagging. \"I never let anyone this close before,\" he whispers. \"The others see a soldier. You see... me.\" His blue eyes glisten. \"Don\'t tell anyone I got soft, okay?\"'},
 d:"A fierce jackal warrior from the desert temples. Sharp blade, sharper wit, softer heart than she lets on.",
 s:[
  {sp:"Narrator",t:"A tall jackal warrior stands atop the temple steps, dagger at her hip glinting in the sunset. Her blue eyes lock onto you immediately.",ex:"smug",ch:[{t:"Approach confidently",a:3,br:"warrior"},{t:"Bow respectfully",a:2,br:"gentle"},{t:"Stay back, wary",a:-2}]},
  {sp:"Anubis",t:"*ears perk* A warrior heart. I can hear it beating steadily. You do not fear death - you respect it. That is the way of the desert.",ex:"smug",ch:[{t:"Death is part of life",a:3},{t:"I fear nothing",a:2}],cond:"warrior"},{sp:"Anubis",t:"*tilts head* Gentle hands. You carry kindness like a lantern in the dark. The desert remembers those who walk with light.",ex:"happy",ch:[{t:"Kindness costs nothing",a:3},{t:"I walk my own path",a:2}],cond:"gentle"},{sp:"Anubis",t:"*nods solemnly* You choose to stay. The desert will test that choice. But I will be your guide through every storm.",ex:"smug",ch:[{t:"I will not run",a:3},{t:"Guide me well",a:2}],cond:"stay"},{sp:"Anubis",t:"*ears flatten* You wish to leave? The wanderer spirit. I understand. But the desert will always welcome you back.",ex:"sad",ch:[{t:"I will return someday",a:3},{t:"Some paths require leaving",a:2}],cond:"leave"},{sp:"Anubis",t:"\'Not many wander this far into the sands. You've got guts... or you're lost. Which is it?\'",ex:"smug",ch:[{t:"'Neither. I came looking for you'",a:3},{t:"'Bit of both, honestly'",a:2},{t:"'Just passing through'",a:-1}]},
  {sp:"Anubis",t:"She circles you once, sizing you up like prey — or a potential sparring partner. Her tail flicks with interest.",ex:"surprised",ch:[{t:"Hold her gaze steady",a:3},{t:"Compliment her blade",a:2},{t:"Ask about the temple",a:1}]},
  {sp:"Anubis",t:"\'Hmph. You've got spine. Most run the second they see the fangs.\' She sheathes her dagger and offers a clawed hand instead.",ex:"happy",ch:[{t:"Take her hand",a:3},{t:"Ask her to train you",a:3},{t:"Admit you're nervous",a:1}]},
  {sp:"Anubis",t:"Sitting beside a fire under the stars, she tells you stories of the old temple guardians. Her voice softens when she isn't performing toughness.",ex:"blush",ch:[{t:"Listen intently",a:3},{t:"Tell her you feel safe here",a:3},{t:"Ask what she's protecting",a:2}]},
  {sp:"Anubis",t:"She goes quiet, staring at her own hands. \'Being a guardian means being alone a lot. I'm... not used to company sticking around.\'",ex:"sad",ch:[{t:"I'm not going anywhere",a:3,end:1},{t:"You don't have to be alone",a:2,end:1},{t:"I should get going",a:-3,back:5}]},
  {sp:"ENDING",t:"Anubis exhales, a rare vulnerable smile crossing her muzzle. \'Fine. Have it your way.\' She scoops you up gently in clawed but careful hands, pressing you against her stomach with surprising tenderness. \'Guardians protect what matters most,\' she murmurs, easing you inside her belly. It's warm, safe, and her heartbeat thrums steady around you like temple drums. You've become the jackal warrior's most treasured, most protected belly pet.",ex:"happy",end:1}
 ]},
{id:"vincent",name:"Vincent",sub:"Obstagoon",ac:"#6366f1",bg:I.obg,p:I.op,e:I.oe,badEnd:"Vincent shrugs, leather jacket creaking. 'No hard feelings, mate.' He tosses his bottle into the alley with practiced aim. 'Not everyone's cut out for the belly life. Takes guts — pun intended.' He turns and disappears into the shadows. 'You know where to find me... if you ever grow a pair.'",
 spr:{happy:I.oh,angry:I.oa,sad:I.os,surprised:I.ou,blush:I.ol,smug:I.om,belly:I.obelly,altEnd:'Vincent\'s grin fades into something genuine. \"I\'ve been running cons my whole life,\" he says quietly. \"But this is the first real thing I\'ve ever felt.\" He wraps his jacket around your shoulders. \"You\'re not a mark. You\'re home.\"'},
 d:"Street-smart badger with a heart of gold. Edgy exterior, secretly a softie. Lives in a cozy alley hideaway.",
 et:"You became Vincent's belly pet. The tough Obstagoon who finally found someone to keep close. Safe in his alley, warm in his belly \u2014 you've never felt more at home.",
 s:[
  {sp:"Narrator",t:"You're walking through a moonlit alley when a figure steps out of the shadows. An Obstagoon with a black leather jacket and star-shaped eyes studies you.",ch:[{t:'"Nice jacket"',a:2},{t:'"Who are you?"',a:1},{t:'"I should go"',a:-2}]},
  {sp:"Vincent",t:"*grins* Staying, eh? Most people pass through and never look back. But you are settling in. I could get used to this.",ex:"happy",ch:[{t:"This feels like home",a:3},{t:"I am not going anywhere",a:2}],cond:"stay"},{sp:"Vincent",t:"*leans on wall* Leaving already? This alley is not much. But the offer stands - whenever you need a place, mine is open.",ex:"sad",ch:[{t:"I will visit often",a:3},{t:"Some things pull you away",a:2}],cond:"leave"},{sp:"Vincent",t:"Heh. You got guts walking through MY alley. Name's Vincent. You ain't from around here, are ya?",ch:[{t:'"Just passing through"',a:1},{t:'"Heard this alley had the coolest Pokemon"',a:3},{t:'"Your alley? Since when?"',a:-1}]},
  {sp:"Narrator",t:"Vincent leads you deeper into the alley, where fairy lights hang from fire escapes. It's surprisingly cozy. He pulls out a crate for you to sit on.",ch:[{t:'"This is actually really nice"',a:3},{t:'"You decorated this yourself?"',a:2},{t:'"I expected something dirtier"',a:-2}]},
  {sp:"Vincent",ex:"sad",t:"Don't go telling everyone about this place, alright? It's... kinda my safe spot. Been living here since I evolved.",ch:[{t:'"Your secret is safe with me"',a:3},{t:'"Why did you evolve out here?"',a:2},{t:"\'That's kinda sad\'",a:1}]},
  {sp:"Narrator",t:"Vincent's star-shaped eyes catch the moonlight. He pulls you closer, his fur bristling with warmth. You know... you're the first person who didn't run from me.",ch:[{t:"\'I'm not afraid of you\'",a:3},{t:'"Why would I run?"',a:2},{t:'"Maybe I should run"',a:-3}]},
  {sp:"Vincent",ex:"blush",t:"His expression softens. You ain't like the others. They see the claws, the tongue, the fangs... and they bolt. But you stayed.",ch:[{t:'*Lean into his paw*',a:3},{t:'"Of course I stayed"',a:2},{t:'"Don\'t get sappy on me"',a:-1}]},
  {sp:"ENDING",t:"Vincent pulls you into a tight embrace, his warm fur enveloping you. You're mine now, understand? Gonna keep you right here... where you belong. You feel yourself sinking into his warm, soft midsection, safe and content. Vincent pats his belly with a satisfied grin, his tongue lolling out happily.",end:1}
 ]
},
{id:"fomo",name:"Fomo",sub:"The Mouse Predator",ac:"#2dd4bf",dr:0,bg:"",p:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/fomo-happy.png",e:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/shared-expression1.jpg",badEnd:"Fomo's ears droop, tail going still. 'Oh... you're going?' He tries to smile but it doesn't reach his eyes. 'That's okay! I'll just... be here. Like always. It's fine.' He curls up, nose pressed to the ground. 'Maybe next time. There's always next time, right?' The silence that follows is heartbreaking.",
 spr:{happy:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/fomo-happy.png",angry:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/fomo-angry.png",sad:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/fomo-sad.png",surprised:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/fomo-surprised.png",blush:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/fomo-blush.png",smug:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/fomo-smug.png",belly:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/fomo-belly.png",altEnd:'Fomo\'s mischievous grin softens. \"I always thought I had to be the funny one. The one who makes everyone laugh so they don\'t leave.\" His ears droop, then perk up. \"But you stayed anyway. That\'s new for me.\"'},
 d:"A spotted, big-eared creature who lounges by the old pool at night. Playful, sly, and hungrier than he lets on. Something about him doesn't just want to hold you close \u2014 it wants to make you part of him, forever.",
 s:[
  {sp:"Narrator",t:"You wander past a fenced-off public pool, closed for the night. Under the flickering moonlight, a spotted creature with huge ears lounges by the water's edge, tail curled lazily behind him.",ch:[{t:'"Mind if I join you?"',a:2,br:"stay"},{t:'"Isn\'t this place closed?"',a:1,br:"leave"},{t:'"Sorry, wrong place"',a:-2}]},
  {sp:"Fomo",t:"*tail wags* You are staying?! Really staying?! Nobody ever stays for me. This means everything!",ex:"happy",ch:[{t:"I am not going anywhere",a:3},{t:"You are worth staying for",a:2}],cond:"stay"},{sp:"Fomo",t:"*ears droop* Oh... you are leaving? I understand. Everyone leaves eventually. But will you come back? Please?",ex:"sad",ch:[{t:"I will always come back",a:3},{t:"Do not lose hope",a:2}],cond:"leave"},{sp:"Fomo",t:"Heh, look what wandered in. Most people don't notice me here \u2014 or if they do, they don't stick around. You're either brave or you don't know any better. Which is it?",ch:[{t:'"Bit of both, honestly"',a:3},{t:'"I go where I want"',a:1},{t:'"Should I be worried?"',a:-1}]},
  {sp:"Narrator",t:"Fomo pats the tile beside him, inviting you to sit. Up close, his spots seem to shimmer faintly, like they're holding some private secret just under the surface.",ch:[{t:"Sit down next to him",a:3},{t:'"What\'s with the spots?"',a:2},{t:"Keep your distance",a:-2}]},
  {sp:"Fomo",ex:"smug",t:"You noticed, huh? Let's just say... I hold onto things. Things I like. And once I decide I like something, I don't really let go of it. Not all the way, anyway.",ch:[{t:'"Sounds possessive"',a:1},{t:'"Is that a threat or an invitation?"',a:3},{t:'"That\'s a weird thing to say"',a:-1}]},
  {sp:"Fomo",ex:"sad",t:"Ha \u2014 don't look so nervous. Out here, alone, most nights... it gets quiet. Lonely, even. So when someone actually stays and talks to me instead of running? That means something. You mean something.",ch:[{t:"Rest your hand on his shoulder",a:3},{t:'"I don\'t scare easy"',a:2},{t:'"That\'s kind of sad"',a:1}]},
  {sp:"Fomo",ex:"blush",t:"His ears perk up and his grin softens into something almost shy. You really aren't planning on leaving, are you? Good. Because I wasn't planning on letting you.",ch:[{t:"\'I'm exactly where I want to be\'",a:3},{t:'"Let\'s find out together"',a:2},{t:'"Wait, what do you mean?"',a:-1}]},
  {sp:"ENDING",t:"Fomo pulls you into the warm water beside him, his big ears twitching happily. His arms wrap around you, spotted fur damp and impossibly soft. \'Just relax,\' he murmurs against your ear. \'I've got you now.\' Warmth spreads through you as he holds you close against his round middle \u2014 safe, content, and utterly his.",end:1}
 ]
}
,
{id:"wolf",name:"Wolf O'Donnell",sub:"Star Wolf Mercenary",ac:"#dc2626",dr:8,altEnd:"Wolf O'Donnell pulls off his goggles, and for the first time you see his eyes — not the cocky mercenary, but the wolf beneath. 'You're not bad, pup. You're not bad at all.' He pulls you close, leather jacket warm against your back. His belly is firm and steady, a heartbeat you can feel through his ribs. 'Star Wolf's crew is small. But it's loyal. And if you're in my belly... ain't nobody in the galaxy gonna touch you.' He rests his chin on your head. 'Welcome to the pack.'",bg:"",p:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/wolf-new-neutral.png",e:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/wolf-expression.jpg",badEnd:"Wolf O'Donnell snorts, adjusting his goggles. 'Heh. Can't hang with the big wolves, pup? Figures.' He cracks his knuckles. 'Don't waste my time again. Star Wolf doesn't do second chances.' His ship's ramp closes behind you with a hiss. From inside, you hear him mutter: '...should've known better than to get my hopes up.'",
 spr:{happy:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/wolf-new-happy.png",angry:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/wolf-new-angry.png",sad:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/wolf-new-serious.png",surprised:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/wolf-new-surprised.png",blush:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/wolf-new-blush.png",smug:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/wolf-new-soft-smile.png",belly:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/wolf-new-belly.png",neutral:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/wolf-new-neutral.png",shy:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/wolf-new-shy.png",gentleLaugh:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/wolf-new-gentle-laugh.png",lookingAway:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/wolf-new-looking-away.png",altEnd:'Wolf\'s cocky grin falters. \"I\'ve been rivals with Fox for years. Always chasing, always fighting.\" He looks away, then back. \"But you make me want to stop running. Just be here. With you.\"'},
 d:"A scarred mercenary captain with a wicked grin and an appetite to match his reputation. Commands his own cruiser, answers to no one, and never turns down a good challenge \u2014 or a good meal.",
 s:[
  {sp:"Narrator",t:"You sneak aboard a docked mercenary cruiser on a dare, boots echoing on the metal floor. A scarred gray wolf in a leather jacket leans against the console, one red eye cracking open as he notices you.",ch:[{t:'"Nice ship"',a:2,br:"loyal"},{t:'"I heard this place doesn\'t take visitors"',a:1,br:"rebel"},{t:"Try to sneak back out",a:-2}]},
  {sp:"Wolf",t:"*nods approvingly* Loyal. I like that. Mercenaries live and die by their code. You understand what it means to stand by your team through hell.","ex":"smug","ch":[{t:"I stand by my allies",a:3},{t:"Loyalty is everything",a:2}],cond:"loyal"},{sp:"Wolf",t:"*smirks* Rebel, huh? I respect that too. The best pilots never follow orders blindly. You fly your own path. Reminds me of someone I used to know.","ex":"smug","ch":[{t:"I make my own rules",a:3},{t:"Rebels get results",a:2}],cond:"rebel"},{sp:"Wolf",t:"Heh. Got some nerve, sneaking onto Star Wolf's ship uninvited. Most people who try that don't get a second chance to brag about it. Lucky for you, I'm in a good mood tonight.",ch:[{t:'"Guess I got lucky then"',a:2},{t:'"I\'m not most people"',a:3},{t:'"I\'ll leave if you want"',a:-1}]},
  {sp:"Narrator",t:"Wolf pushes off the console and saunters closer, sizing you up with a predator's grin. The cockpit hums quietly around you, neon light glinting off his badge.",ch:[{t:"Hold your ground",a:3},{t:'"Something I can help with?"',a:2},{t:"Step back",a:-2}]},
  {sp:"Wolf",ex:"smug",t:"Not gonna lie \u2014 I like the ones who don't flinch. Most of my crew scattered years ago. Ship's been quiet since. A merc captain gets bored being the only interesting thing on board, you know?",ch:[{t:'"Sounds lonely up here"',a:2},{t:'"Maybe you need better company"',a:3},{t:'"Not my problem"',a:-2}]},
  {sp:"Wolf",ex:"sad",t:"Heh, don't go feeling sorry for me. I run my own show, always have. But yeah... it'd be nice having someone worth keeping around for once. Someone who isn't scared off by a few scars and a bad reputation.",ch:[{t:"Step closer",a:3},{t:'"Your reputation doesn\'t scare me"',a:2},{t:'"That\'s rough"',a:1}]},
  {sp:"Wolf",ex:"blush",t:"His grin softens into something more genuine, red eyes locked on yours. Careful, kid. Keep looking at me like that and I might just decide to keep you. Permanently. On this ship. With me.",ch:[{t:'"Is that a threat or a promise?"',a:3},{t:'"Maybe I want to be kept"',a:3},{t:'"I should go"',a:-3}]},
  {sp:"ENDING",t:"Wolf's grin widens into something hungry as he pulls you flush against him, his belly pressing warm and solid between you. \'Wrong move, kid,\' he chuckles low against your ear. \'Should've run when you had the chance.\' His arms wrap tight, and the world tilts as he settles you snug against his gut with a satisfied groan. \'Welcome aboard. Permanently.\'",end:1}
 ]
},
{id:"glacia",name:"Glacia",sub:"The Glaceon",ac:"#38bdf8",bg:"",p:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/glacia-new-portrait.png",e:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/glacia-new-ending.png",badEnd:"Glacia's ice crystals dim, her cool expression cracking. 'Oh. You're leaving.' She turns away, wrapping her tail around herself. 'The cold takes getting used to. I get it.' A single ice crystal falls and shatters on the floor. 'The cavern keeps me company. It always has.' You leave to the sound of settling ice.",
 spr:{happy:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/glacia-new-happy.png",angry:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/glacia-new-angry.png",sad:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/glacia-new-sad.png",surprised:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/glacia-new-surprised.png",blush:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/glacia-new-blush.png",smug:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/glacia-new-smug.png",belly:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/glacia-new-ending.png",altEnd:'Glacia\'s icy composure melts. \"I keep everyone at arm\'s length. Frost pun unintended.\" She laughs softly. \"But you walked right through my defenses. And I don\'t want to rebuild them. Not with you.\"'},
 d:"A cool, composed Glaceon with a quiet elegance and a playful streak she rarely shows. Keeps to her frost cavern, watching visitors with sharp icy-blue eyes before deciding if they're worth melting for.",
 s:[
  {sp:"Narrator",t:"Deep in a frost-lined cavern, crystalline ice formations glitter under a pale blue light. A Glaceon sits poised atop a frozen ledge, tail curled neatly, studying you with calm, assessing eyes.",ch:[{t:'"Sorry to intrude"',a:2},{t:'"This place is beautiful"',a:2},{t:"Back away slowly",a:-1}]},
  {sp:"Glacia",t:"*ice crystals dance* Confident. I like that. The cold does not favor the hesitant. You step forward like you belong here.",ex:"smug",ch:[{t:"I make my own warmth",a:3},{t:"Cold does not scare me",a:2}],cond:"confident"},{sp:"Glacia",t:"*gentle smile* Nervous? That is okay. The ice can be intimidating. But I promise - the cold only bites those who fight it.",ex:"happy",ch:[{t:"I trust you",a:3},{t:"Help me adjust",a:2}],cond:"nervous"},{sp:"Glacia",t:"Hm. Not many make it this deep without freezing solid first. You must be either very brave, or very foolish. I haven't decided which yet.",ch:[{t:'"Maybe a bit of both"',a:3},{t:'"I\'m good with cold"',a:1},{t:'"I can leave if you want"',a:-1}]},
  {sp:"Narrator",t:"Glacia tilts her head, ear-fins catching the light like glass. She steps down from her ledge, frost crunching softly under each paw, circling you with quiet curiosity.",ch:[{t:"Stay perfectly still",a:2},{t:'"Do you get visitors often?"',a:2},{t:"Try to walk past her",a:-2}]},
  {sp:"Glacia",ex:"smug",t:"Rarely. Most creatures fear the cold, or fear me. It's rather... isolating, being the only cool head in a warm world. Though I've grown fond of the quiet. Mostly.",ch:[{t:'"I don\'t mind the quiet either"',a:2},{t:'"You don\'t seem so scary"',a:3},{t:'"That sounds lonely"',a:1}]},
  {sp:"Glacia",ex:"blush",t:"A faint shimmer of color rises under her fur \u2014 the closest thing to a blush an ice-type can manage. ...You're rather forward, aren't you. Most don't get this close and live to talk about it. I find I don't mind, with you.",ch:[{t:"Reach out gently",a:3},{t:'"I like being close to you"',a:3},{t:'"Should I be worried?"',a:-1}]},
  {sp:"Glacia",ex:"happy",t:"She presses close, cool and smooth, a soft satisfied hum vibrating in her chest. Then I suppose... I'll simply have to make sure you never want to leave. I've decided, you see. You're mine now.",ch:[{t:"Melt into her embrace",a:3},{t:'"I wasn\'t planning on leaving"',a:2},{t:'"W-wait, what do you mean?"',a:-1}]},
  {sp:"ENDING",t:"Glacia curls herself around you with surprising warmth beneath all that frost, her cool fur soft against your skin. \'There,\' she murmurs, voice a low, satisfied purr as her belly gently swells to hold you close. \'Safe. Quiet. Mine.\' The ice around you shimmers softly, and for the first time, the cavern doesn't feel cold at all.",end:1}
 ]
},
{id:"riko",name:"Riko",altEnd:"Riko's confident smirk crumbles into genuine, raw vulnerability. \"I... I was gonna drain you. That was the plan. But now... *voice cracking* ...I don't want to. I want you to WANT to be here.\" His eyes glisten. \"You chose me. A nobody. A level 3 mob. That's the strongest thing anyone's ever done for me.\" He pulls you in gently, no drain, no tricks. Just a small demon holding someone who finally saw him.",sub:"Low-Level Demon Mob",ac:"#ef4444",dr:10,bg:"",p:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/riko-base.png",e:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/riko-expression.jpgTU7EOODV",badEnd:"Riko's cocky grin wavers. 'Pffft. Whatever! I didn't want you in my belly anyway!' He crosses his arms, but his tail is between his legs. 'You're missing out on the best belly in the Crossroads!' He stomps off. From behind a rock, you hear him sniffle. '...why does nobody ever stay?' The little demon sits alone.",
 spr:{happy:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/riko-happy.png",angry:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/riko-angry.png",sad:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/riko-sad.png",surprised:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/riko-surprised.png",blush:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/riko-blush.png",smug:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/riko-smug.png",belly:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/riko-belly.png"},
 d:"A scrappy low-level demon who compensates for his weak stats with one overpowered ability \u2014 his stomach. He can\'t fight worth a damn, but he can swallow beings ten times his level and keep them tucked away. Proud, cocky, and surprisingly clingy.",
 s:[
  {sp:"Narrator",t:"You wander into a dim crossroads lit by flickering hellfire lamps. A small red demon sits on a crate, kicking his feet boredly. He looks weak \u2014 barely a tutorial enemy \u2014 but something about that confident grin makes you hesitate.",ch:[{t:'"You don\'t look so tough"',a:-1,br:"confident"},{t:'"What are you doing out here?"',a:2,br:"nervous"},{t:'"I should probably keep walking"',a:-1}]},
  {sp:"Riko",t:"*grins* Confident, huh? Most people look at a demon and run. You look at me like I am just another person. That is refreshing.",ex:"happy",ch:[{t:"You ARE just a person",a:3},{t:"I do not scare easily",a:2}],cond:"confident"},{sp:"Riko",t:"*chuckles* Nervous? Smart. I am a demon, after all. But you showed up anyway. That takes guts of a different kind.",ex:"smug",ch:[{t:"I had to meet you",a:3},{t:"Caution is wise",a:2}],cond:"nervous"},{sp:"Riko",t:"*looks at the sky* You talk about the stars. I used to watch them from the crossroads, wondering if anyone up there was like me. A weak demon who dreamed of more.",ex:"sad",ch:[{t:"You are not weak",a:3},{t:"Dreams make us strong",a:2}],cond:"stars"},{sp:"Riko",t:"*voice softens* Lonely? I know that feeling. Being the weakest demon means everyone either ignores you or uses you. But you actually see me.",ex:"sad",ch:[{t:"I see the real you",a:3},{t:"You are not alone anymore",a:2}],cond:"lonely"},{sp:"Riko",ex:"smug",t:"Tough? Nah. I\'m the weakest mob in this entire zone. Level 3, maybe 4 on a good day. But see \u2014 *pats his belly* \u2014 I got a trick up my sleeve. Er, my gut. Level doesn\'t matter much when you\'re INSIDE something, does it?",ch:[{t:'"What\'s that supposed to mean?"',a:2},{t:'"You swallowed someone?"',a:3},{t:'"Sure, buddy. Sure."',a:-1}]},
  {sp:"Riko",ex:"happy",t:"Heh, don\'t believe me? Fair enough. Most don\'t. They see a low-level mob and think \'easy fight.\' Then they wake up in here. *taps belly* I\'ve got a level 40 barbarian in there right now. Big guy. Thought he could take me. Now he\'s just... warm company.",ch:[{t:'"That\'s... actually impressive"',a:3},{t:'"Doesn\'t that feel wrong?"',a:1},{t:'"I bet I could take you"',a:-2}]},
  {sp:"Riko",ex:"sad",t:"Look, I KNOW I\'m the bottom of the food chain. Every other demon in this place could swat me like a fly. That\'s WHY I figured out how to do this. Nobody expects the weak one to be dangerous. It\'s the only thing keeping me alive down here, honestly.",ch:[{t:'"You\'re smarter than you look"',a:3},{t:'"So it\'s survival, not cruelty?"',a:2},{t:'"Sounds like you\'re scared"',a:-1}]},
  {sp:"Riko",ex:"blush",t:"Smart? *his ears twitch, face flushing darker red* Nobody\'s ever said that to me before. They just see \'low-level mob\' and write me off. But you\'re actually... talking to me. Like I\'m a real person. That\'s... huh. That\'s new.",ch:[{t:"Sit down next to him",a:3},{t:'"You ARE a real person"',a:3},{t:'"Don\'t get sappy on me"',a:-1}]},
  {sp:"Riko",ex:"smug",t:"Alright, cards on the table. I could swallow you right now. You\'re what, level 15? Easy. But... I don\'t want to. Not this time. I want you to STAY because you want to. *grins* ...Okay, maybe I want you to stay because I want to keep you. Same difference, right?",ch:[{t:'"I\'m not going anywhere"',a:3},{t:'"So you\'re asking nicely AND threatening?"',a:2},{t:'"I don\'t get eaten that easy"',a:-1}]},
  {sp:"ENDING",t:"Riko\'s tail swishes excitedly as he pulls you close, his small frame surprisingly strong. \'Told you,\' he whispers, voice cracking with genuine happiness. \'Nobody expects the weak one.\' His belly swells warm and round as he tucks you safely inside, the faint muffled voice of the barbarian inside grumbling in protest. \'Shush, you\'ve got company now,\' Riko giggles, patting his fuller gut. \'My little secret weapon. And my new favorite person.\'",end:1}
 ]
},
  {id:"aether",name:"Aether",sub:"The Sanctuary",altEnd:"Aether\'s arms close around you, gentle and certain. \"You came back.\" His belly is soft, warm, and utterly safe \u2014 a place where nothing is taken from you. You rest. You heal. And when you finally step out, the weight you carried is gone.",ac:"#a78bfa",bg:"",dr:-5,p:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/aether-new-happy.png",e:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/aether-expression.jpg",badEnd:"Aether's gentle smile doesn't waver, but his eyes dim. 'The stars set, and so must this.' He steps back, light fading from his form. 'Not every soul belongs in every sanctuary. You chose to carry your weight alone — and that is a valid choice.' He dissolves into starlight. 'I will be here, should you ever wish to rest.'",
 spr:{happy:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/aether-new-happy.png",angry:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/aether-new-angry.png",sad:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/aether-new-serious.png",surprised:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/aether-new-surprised.png",blush:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/aether-new-blush.png",smug:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/aether-new-soft-smile.png",belly:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/aether-new-belly.png",neutral:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/aether-new-neutral.png",shy:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/aether-new-shy.png",gentleLaugh:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/aether-new-gentle-laugh.png",lookingAway:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/aether-new-looking-away.png"},d:"A quiet Lucario who runs the only cafe in Destiny City where nobody has to perform. His belly is a sanctuary \u2014 the drain runs backwards in there. You come in carrying something, and you leave with none of it.",s:[
  {sp:"Narrator",t:"The Quiet Cafe smells of fresh coffee and old paper. A tall Lucario in a lilac sweater sits by the window, golden eyes lifting as you walk in. The seat across from him is already pulled out.",ch:[{t:"Sit down",a:3},{t:"Stand by the door",a:1},{t:"Ask if the seat is taken",a:2}]},
  {sp:"Aether",t:"Rest here. You don't have to explain yourself. I won't ask for more than you want to give.",ch:[{t:"That's... exactly what I needed",a:3},{t:"You don't even know me",a:1},{t:"What do you get out of this?",a:2}]},
  {sp:"Aether",t:"I get the quiet knowing that someone let go for a moment. That's the whole transaction. My belly is a place to put down what you carry — not to lose it.",ch:[{t:"Can I stay a while?",a:3},{t:"Show me",a:2},{t:"I don't trust this",a:-1}]},
  {sp:"Aether",ex:"gentleLaugh",t:"Of course. Slide in. It's warm, it's soft, and the drain runs the wrong way in here. Whatever you're carrying, you'll set it down. But before you settle, tell me — what brought you to my quiet corner?",ch:[
    {t:"Ask about the stars that guide lost souls",a:3,b:"path1",br:"stars"},
    {t:"Ask about his centuries of isolation between stars",a:2,b:"path2",br:"lonely"},
    {t:"Ask what he hesitates to want for himself",a:2,b:"path3",br:"future"}
  ]},
  {sp:"Aether",ex:"gentleLaugh",cond:"path1",t:"Aether's golden eyes light up like distant constellations being born. 'The stars? Each one is a beacon for a soul that lost its way in the dark. For centuries I watched them from afar, guiding lost travelers home... but I never imagined one of those stars would guide you straight to me.' He smiles softly, silver hair catching the gentle light.",ch:[{t:"I'm ready to rest with you",a:3,end:1},{t:"Just for a little while",a:2,end:1},{t:"I changed my mind",a:-3,back:2}]},
  {sp:"Aether",ex:"sad",cond:"path2",t:"Aether's gentle smile falters for a moment, silver hair falling softly over his brow. 'Isolation... it is the quiet space between galaxies. Silent, cold, and endless. For centuries, I believed that was simply my purpose — to hold space for others while remaining alone.' He looks at you, warmth softening his gaze. 'Until you sat across from me tonight.'",ch:[{t:"I'm ready to rest with you",a:3,end:1},{t:"Just for a little while",a:2,end:1},{t:"I changed my mind",a:-3,back:2}]},
  {sp:"Aether",ex:"shy",cond:"path3",t:"Aether pauses, a rare moment of hesitation touching his calm posture. 'What I want for myself? A guide is meant to offer comfort, not ask for it. I am not supposed to desire anything beyond your peace.' He looks down at his paws, then softly meets your eyes. '...But if I permitted myself one selfish wish, it would be for you to stay a little longer.'",ch:[{t:"I'm ready to rest with you",a:3,end:1},{t:"Just for a little while",a:2,end:1},{t:"I changed my mind",a:-3,back:2}]},
  {sp:"ENDING",t:"You curl up inside Aether's belly — a sanctuary of warmth and quiet. The world's noise fades to a distant murmur. No drain. No keeping. Just rest. And when you wake, you feel lighter than you have in months.",end:1}
]},
  {id:"luna",name:"Luna",sub:"Aether\'s Sister",altEnd:"Luna holds you close, silver fur warm against you. \"See? Not so scary.\" Her womb is slow and steady \u2014 a tide that never quite pulls you under. You feel watched over, kept, and for once, entirely willing.",ac:"#38bdf8",bg:"",dr:6,p:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/luna-new-happy.png",e:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/luna-expression.jpg",badEnd:"Luna's moonlight flickers cold. 'Leaving so soon?' Her smile sharpens. 'I warned you the dark wasn't gentle.' She turns, silver hair merging with the shadows. 'Some moons pull harder than others. You weren't ready for the tide.' Her voice fades. '...a pity. You would have been a lovely passenger.'",
 spr:{happy:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/luna-new-happy.png",angry:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/luna-new-angry.png",sad:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/luna-new-serious.png",surprised:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/luna-new-surprised.png",blush:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/luna-new-blush.png",smug:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/luna-new-soft-smile.png",belly:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/luna-new-belly.png",neutral:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/luna-new-neutral.png",shy:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/luna-new-shy.png",gentleLaugh:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/luna-new-gentle-laugh.png",lookingAway:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/luna-new-looking-away.png"},
 d:"A silver-furred Lucario with a sharp grin and a slower heartbeat. Aether\'s sister. Where he heals, she keeps \u2014 gently, slowly, like someone who learned early not to let go. Her keeping is different from the others: she draws you into her womb, warm and watchful. Two Riolu kits \u2014 Luna Jr. and Sol \u2014 are always at her side, raised in that same warmth.",s:[
  {sp:"Narrator",t:"At a corner table in the Quiet Cafe, a silver-furred Lucario waves you over like you're old friends. Her grin is sharp, warm, and a little smug. 'You're the one my brother keeps talking about.'",ch:[{t:"Your brother?",a:2},{t:"He talks about me?",a:3},{t:"Who are you?",a:1}]},
  {sp:"Luna",t:"Aether. Tall, lilac sweater, terrible at asking for things. I'm Luna. His sister. He's all soft corners and quiet doors — I'm the one who checks that nobody slams them.",ch:[{t:"You two are nothing alike",a:2},{t:"That's sweet, actually",a:3},{t:"Should I be worried?",a:1}]},
  {sp:"Luna",t:"Worried? No. But listen — if you're going to rest in his belly, know what you're getting. He heals you. Me? I keep you differently. I draw you in somewhere warmer, somewhere deeper. Like a sister who never learned how to let go.",ch:[{t:"That's intense",a:1},{t:"Show me",a:3},{t:"I'll stay with Aether",a:2}]},
  {sp:"Luna",ex:"smug",t:"*laughs* Fair. Everyone needs a sister's warmth sometimes — close, watchful, no judgement. The warmth's slow in here. But before you dive in, what is it you really want to know about me?",ch:[
    {t:"Ask about the nature of her power",a:3,b:"path1",br:"power"},
    {t:"Ask who she was before she became hardened",a:2,b:"path2",br:"past"},
    {t:"Ask why she struggles with trust",a:2,b:"path3",br:"trust"}
  ]},
  {sp:"Luna",ex:"smug",cond:"path1",t:"Luna's silver fur catches the ambient moonlight, a profound intensity lingering in her sharp eyes. 'My power isn't just aura or strength. It's room. I carry entire quiet worlds inside me — places where time slows down and nobody can hurt you.' She rests a paw over her middle. 'When I take someone in, they become part of my orbit forever.'",ch:[{t:"I think I'm ready",a:3,end:1},{t:"Just today",a:2,end:1},{t:"I'll pass",a:-2,back:2}]},
  {sp:"Luna",ex:"lookingAway",cond:"path2",t:"Luna looks away toward the quiet street outside, her sharp grin softening into reflection. 'Before I built these sharp edges? I was like Aether — naive, trusting, thinking the world would hold me softly.' She sighs, a cool breeze fluttering her mane. 'The world broke that out of me. But holding you... it reminds me of who I used to be before I had to grow armor.'",ch:[{t:"I think I'm ready",a:3,end:1},{t:"Just today",a:2,end:1},{t:"I'll pass",a:-2,back:2}]},
  {sp:"Luna",ex:"shy",cond:"path3",t:"Luna's tail twitches, a faint blush breaking through her cool composure. 'Trust doesn't come easily to me. I'm used to being the guard dog, watching every exit and checking every shadow.' She looks directly into your eyes, voice softening. 'But with you, I'm trying. I'm letting my guard down... even if it terrifies me just a little.'",ch:[{t:"I think I'm ready",a:3,end:1},{t:"Just today",a:2,end:1},{t:"I'll pass",a:-2,back:2}]},
  {sp:"ENDING",t:"Luna draws you into her womb with a sister's care — firm and fond. The warmth is a gentle current instead of a pull. Around you, her warmth pulses steady and close. 'Rest. I've got you. And I've got all the time in the world.'",end:1}
]},
 {id:"nyx",name:"Nyx Bellweather",sub:"The Midnight Courier",altEnd:"Nyx folds her cloak around you as the last lantern goes dark. \"Every dream has a door,\" she whispers. \"Yours is the one I choose to guard.\" You settle into the warm hush beneath her moonlit fur, carried safely through the sleeping city.",ac:"#d7b4ff",dr:0,bg:"",p:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/nyx-base.png",e:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/nyx-expression2.jpg",badEnd:"Nyx's feathers ruffle, her large eyes blinking slowly. 'The night releases you, then.' She draws her cloak tighter. 'My nest is warm for those who stay. For those who fly away...' She looks up at the moon. 'I have learned to be content with the silence.' A single feather drifts down as she turns away.",spr:{happy:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/nyx-happy.png",angry:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/nyx-angry.png",sad:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/nyx-sad.png",surprised:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/nyx-surprised.png",blush:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/nyx-blush.png",smug:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/nyx-smug.png",belly:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/nyx-belly.png"},d:"A midnight-black feline who carries dreams between sleeping windows. She knows every quiet route through Destiny City and never loses a package.",s:[
  {sp:"Narrator",t:"A silver lantern swings beneath a rooftop arch. A midnight-black feline waits beside it, violet scarf trailing in the wind and a tiny bell chiming at her throat.",ch:[{t:"Follow the lantern",a:3},{t:"Ask who she is",a:2},{t:"Keep your distance",a:-1}]},
  {sp:"Nyx",t:"*hoots softly* You chose illusion. The wise choice. Sometimes the truth is too heavy to bear. I can show you a dream that feels more real than reality.",ex:"happy",ch:[{t:"Show me your dreams",a:3},{t:"Illusion can be kind",a:2}],cond:"illusion"},{sp:"Nyx",t:"*eyes glow* Truth. You chose truth. Most run from it. But you want to see the world as it truly is. Brave owl.",ex:"smug",ch:[{t:"I can handle truth",a:3},{t:"Lies are prisons",a:2}],cond:"truth"},{sp:"Nyx",t:"*nests closer* Belonging. You seek a place in this world. The night welcomes all who search. My nest could be your home.",ex:"happy",ch:[{t:"I want to belong here",a:3},{t:"Show me home",a:2}],cond:"belong"},{sp:"Nyx",ex:"smug",t:"Keep your voice down. The city is asleep, but it is not unaware. There is a difference.",ch:[{t:"What are you carrying?",a:2},{t:"I trust you",a:3},{t:"That sounds ominous",a:-1}]},
  {sp:"Nyx",ex:"happy",t:"I deliver dreams after midnight. The good ones go in silk envelopes. The dangerous ones get a bell tied to them.",ch:[{t:"Can I see the route?",a:3},{t:"Do you ever get lost?",a:2},{t:"I should go home",a:-2}]},
  {sp:"Nyx",ex:"blush",t:"You have the look of someone who wants to be shown the secret path. Try not to step on the moonbeams.",ch:[{t:"Take her paw",a:3},{t:"Lead the way",a:3},{t:"Maybe another night",a:-1}]},
  {sp:"Nyx",ex:"sad",t:"The last courier ran from the dark. I stayed. Someone has to make sure the gentle dreams reach the right windows.",ch:[{t:"I\'ll stay beside you",a:3},{t:"You don\'t have to do it alone",a:2},{t:"That sounds dangerous",a:-1}]},
  {sp:"Nyx",ex:"blush",t:"Then stay close. When the bell rings, the sleeping city opens a door just for us.",ch:[{t:"I\'m ready",a:3,end:1},{t:"Show me the lantern route",a:3,end:1},{t:"I changed my mind",a:-2,back:2}]},
  {sp:"ENDING",t:"Nyx lifts you into the warm fold of her cloak and carries you along the rooftop lantern route. Dreams drift past like fireflies. Her bell rings once, and every quiet door in Destiny City opens for you.",end:1}
 ]},
{id:"zero",name:"Zero",sub:"Shiny Unova Zoroark",altEnd:"Zero's black-and-blue mane folds around you like a curtain of midnight. \"You heard the voice and came anyway,\" he murmurs. \"Then you are mine to protect, mine to keep, and mine to know.\" His illusion wraps around the world until the only reality left is the warmth of his belly and the steady rhythm of his promise.",ac:"#2563eb",dr:7,bg:"",p:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/zero-unova-zoroark.png",e:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/nyx-zero-expression.jpg",badEnd:"Zero's purple aura flickers out, his smirk fading to something hollow. 'You saw through the illusion and chose to walk away. Smart.' But his voice catches. 'Or maybe not smart. Maybe just... afraid.' He dissolves into purple mist. 'The truth is, I wanted you to stay. But illusions are all I know how to be.'",spr:{happy:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/zero-happy.png",angry:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/zero-angry.png",sad:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/zero-sad.png",surprised:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/zero-surprised.png",blush:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/zero-blush.png",smug:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/zero-smug.png",belly:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/zero-belly.png"},d:"A shiny Unova Zoroark who hides a fiercely protective heart beneath elegant illusions. Zero speaks softly, watches everything, and never forgets the person who answered his call.",s:[
 {sp:"Narrator",t:"The voice leads you into a moonlit hollow where a sleek black Zoroark waits beneath silver branches. Cobalt-blue mane spills over his shoulders like living night. Beside him stands a pale, ghostly twin.",ch:[{t:"Ask his name",a:2},{t:"Look toward the pale twin",a:2},{t:"Stay close to the voice",a:3}]},
 {sp:"Zero",t:"'Zero.' His blue eyes narrow with careful curiosity. 'I am the voice that found you. Luce is my twin. We share a shadow, but not a mind. Tell me which one you came to hear.'",ch:[{t:"'I came to hear you'",a:3},{t:"'I want to know both of you'",a:2},{t:"'I should leave'",a:-2}]},
 {sp:"Zero",t:"He steps around you, testing the edges of the illusion. 'People fear what they cannot see. You followed what you could not see. That makes you brave... or already a little ours.'",ch:[{t:"'I trust you'",a:3},{t:"'Show me the truth'",a:2},{t:"'Maybe I am afraid'",a:1}]},
 {sp:"Zero",ex:"smug",t:"The hollow folds into a quiet room of soft darkness. Zero rests a paw over his middle, blue eyes glittering in the gloom. 'Stay tonight. Let the world become less certain. But tell me, traveler — what do you seek in my shadows?'",ch:[
   {t:"Ask about his illusion philosophy",a:3,b:"path1",br:"illusion"},
   {t:"Ask him to drop all masks and reveal the truth",a:2,b:"path2",br:"truth"},
   {t:"Ask about fitting everywhere but belonging nowhere",a:2,b:"path3",br:"belong"}
 ]},
 {sp:"Zero",ex:"happy",cond:"path1",t:"Zero's cobalt mane ripples like liquid shadow as he smirks playfully. 'An illusion isn't a lie — that's a common misconception. I never force a deception. I simply hold up a mirror that reflects what people secretly desire most.' He steps closer, dark paws light against the grass. 'And right now, your desire is to be held somewhere warm where the world can't find you.'",ch:[{t:"'Keep me'",a:3,end:1},{t:"'I choose this'",a:3,end:1},{t:"'Open the way out'",a:-2,back:2}]},
 {sp:"Zero",ex:"sad",cond:"path2",t:"Zero freezes, the blue fire in his eyes dimming into stillness. Slowly, the shadowy flickers around him collapse. 'Drop the masks?' he whispers, looking down at his own paws. 'The truth is... I've worn so many shapes and spoken in so many voices that I don't know where the illusion ends and I begin. But standing here with you... I want to find out.'",ch:[{t:"'Keep me'",a:3,end:1},{t:"'I choose this'",a:3,end:1},{t:"'Open the way out'",a:-2,back:2}]},
 {sp:"Zero",ex:"shy",cond:"path3",t:"Zero tilts his head, a quiet melancholy touching his sharp features. 'That is the shapeshifter's curse. I can wear any face and fit seamlessly into any crowd, yet I belong to no one.' He reaches out, his warm, dark paw gently brushing yours. 'Until now, I was always a passerby in everyone else's story. But with you... I feel like I finally found my place.'",ch:[{t:"'Keep me'",a:3,end:1},{t:"'I choose this'",a:3,end:1},{t:"'Open the way out'",a:-2,back:2}]},
 {sp:"ENDING",t:"Zero draws you into his warm belly beneath a veil of midnight illusion. The outside world becomes a distant story he can rewrite at will, but he leaves one truth untouched: you chose to stay. His heartbeat steadies around you as he whispers, 'Sleep, little star. Nothing reaches you here.'",end:1}
]},
{id:"luce",name:"Luce",sub:"Shiny Hisuian Zoroark",altEnd:"Luce's pale mane curls around you in a soft, ghostly embrace. \"You followed the voice all the way here,\" she whispers, bright eyes gleaming. \"So let me give you a kinder haunting.\" Her warmth gathers you close, and the hollow becomes a dreamlike sanctuary where you are held, cherished, and never left alone.",ac:"#e879f9",dr:7,bg:"",p:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/luce-zoroark.png",e:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/luce-expression.jpg",badEnd:"Luce snarls, claws flexing. 'Tch. Figures.' She turns sharply, mane bristling. 'I opened up — ME, the illusion-breaker — and you run. Don't come back.' She starts to walk away, then pauses. '...Zero was right about you. Weak.' But in her eyes, you see something that looks a lot like hurt.",spr:{happy:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/luce-happy.png",angry:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/luce-angry.png",sad:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/luce-sad.png",surprised:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/luce-surprised.png",blush:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/luce-blush.png",smug:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/luce-smug.png",belly:"https://raw.githubusercontent.com/ladyn7989-oss/Image-Assets/main/artifacts/mockup-sandbox/public/images/date-with-destiny/luce-belly.png"},d:"A shiny Hisuian Zoroark with a tender voice and a mischievous streak. Luce turns haunting illusions into comforting dreams, but once she loves someone, she is reluctant to let them wake.",s:[
 {sp:"Narrator",t:"The pale Zoroark steps from the mist, white fur and lavender mane glowing against the moon. Her expression is warmer than Zero's, but the same impossible voice hums beneath every thought.",ch:[{t:"Greet her gently",a:3},{t:"Ask about Zero",a:2},{t:"Admit the voice scared you",a:1}]},
 {sp:"Luce",t:"'I am Luce. Zero calls the dark; I teach it how to be soft.' She tilts her head. 'You can date one of us, both of us, or simply sit here until the night stops asking questions.'",ch:[{t:"'I want to know you'",a:3},{t:"'Tell me about Zero'",a:2},{t:"'I need a moment'",a:1}]},
 {sp:"Luce",t:"She reaches out, and the hollow fills with a warm remembered sunlight. 'See? An illusion does not have to lie. Sometimes it only gives lonely things somewhere safe to rest.'",ch:[{t:"Take her paw",a:3},{t:"Rest in the illusion",a:3},{t:"Ask what she wants",a:2}]},
 {sp:"Luce",ex:"happy",t:"Luce presses close, her pale mane brushing your face. 'I want you to come back. I want to keep a place for you inside me, where the nightmare cannot follow. But tell me... what part of my heart calls to you?'",ch:[
   {t:"Ask about her zoroark instincts versus human restraint",a:3,b:"path1",br:"dual"},
   {t:"Ask how she redefines true strength",a:2,b:"path2",br:"strength"},
   {t:"Ask about her fear of being gentle",a:2,b:"path3",br:"tender"}
 ]},
 {sp:"Luce",ex:"happy",cond:"path1",t:"Luce's ghostly lavender mane swirls softly as she smiles. 'Every day is a negotiation. My wild Hisuian instincts urge me to claim, to protect fiercely, to pull you under and keep you hidden forever.' She leans in close, her breath warm against your cheek. 'Human restraint is what keeps me gentle. But when I hold you inside my belly... both sides are finally satisfied.'",ch:[{t:"Stay with Luce",a:3,end:1},{t:"Stay with both twins",a:3,end:1},{t:"Choose the door",a:-3,back:2}]},
 {sp:"Luce",ex:"smug",cond:"path2",t:"Luce raises her chin, bright eyes glowing with quiet pride. 'Most creatures think strength is measured by how much you can tear apart. They are wrong. Real strength is choosing what to cherish and shield from the storm.' She wraps her pale, warm arms around you. 'I don't use my power to destroy. I use it to create a haven where you are safe from everything.'",ch:[{t:"Stay with Luce",a:3,end:1},{t:"Stay with both twins",a:3,end:1},{t:"Choose the door",a:-3,back:2}]},
 {sp:"Luce",ex:"blush",cond:"path3",t:"Luce's expression softens into sheer vulnerability, a faint blush creeping across her ghost-white cheeks. 'Being fierce is easy — it's defense. But being tender? Wanting to cradle you softly without tearing anything... that terrifies me.' She takes a shaky breath, pressing her chest against yours. 'I want to be gentle with you. Please teach me how.'",ch:[{t:"Stay with Luce",a:3,end:1},{t:"Stay with both twins",a:3,end:1},{t:"Choose the door",a:-3,back:2}]},
 {sp:"ENDING",t:"Luce gathers you into her warm, ghostly belly as moonlight turns into a gentle dream. Her voice follows you inside, never harsh, never distant. 'You are safe in my haunting now,' she whispers, while Zero's shadow keeps watch beyond the veil.",end:1}
]},
];
