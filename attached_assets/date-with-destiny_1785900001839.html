<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Date With Destiny</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none}
body{font-family:system-ui,sans-serif;overflow:hidden;background:#1a0e2e;color:#e9d5ff}
#g{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;overflow:hidden;position:relative}
.s{flex:1;display:flex;flex-direction:column;overflow:hidden;animation:f .3s forwards}
@keyframes f{from{opacity:0}to{opacity:1}}
.sc{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.h{padding:10px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid rgba(167,139,250,.15);background:rgba(26,14,46,.95)}
.h h2{font-size:15px;font-weight:700;flex:1}
.b{border:none;cursor:pointer;border-radius:8px;font-weight:600;font-family:inherit;transition:.15s}
.b:active{transform:scale(.96)}
.bs{font-size:12px;padding:6px 12px;background:rgba(167,139,250,.15);color:#a78bfa}
.bp{font-size:14px;padding:10px 20px;background:#7c3aed;color:#fff}
.bo{font-size:13px;padding:8px 14px;background:transparent;border:1px solid rgba(167,139,250,.3);color:#e9d5ff}
.bl{font-size:16px;padding:14px 28px;width:100%;border-radius:10px}
.tw{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 24px}
.tm{font-size:30px;font-weight:900;text-align:center;background:linear-gradient(135deg,#a78bfa,#f472b6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1.15}
.ts{font-size:13px;color:#a78bfa;margin:4px 0 20px}
.ta{width:130px;height:130px;border-radius:50%;object-fit:cover;border:3px solid rgba(167,139,250,.3);margin-bottom:8px}
.tb{width:100%;max-width:280px;display:flex;flex-direction:column;gap:10px;margin-top:14px}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;padding:14px}
.cc{border-radius:12px;overflow:hidden;cursor:pointer;border:1px solid rgba(167,139,250,.15);background:rgba(167,139,250,.05);position:relative}
.cc:active{transform:scale(.97)}
.cc .i{aspect-ratio:3/4;overflow:hidden}
.cc img{width:100%;height:100%;object-fit:cover}
.cc .n{padding:8px 10px}
.cc .n b{font-size:13px;display:block}
.cc .n span{font-size:10px;color:#a78bfa}
.cc .d{position:absolute;top:6px;left:6px;background:#7c3aed;color:#fff;font-size:9px;font-weight:700;padding:2px 7px;border-radius:4px}
.vn{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.vp{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(26,14,46,.3),rgba(26,14,46,.8))}
.vp img{max-width:100%;max-height:100%;object-fit:contain}
.vp .gd{position:absolute;bottom:0;left:0;right:0;height:30%;background:linear-gradient(transparent,#1a0e2e)}
.va{position:absolute;top:0;left:0;right:0;padding:8px 12px;z-index:3;background:linear-gradient(rgba(26,14,46,.85),transparent)}
.vab{height:6px;border-radius:3px;background:rgba(167,139,250,.15);overflow:hidden;margin-top:4px}
.vaf{height:100%;border-radius:3px;transition:width .5s}
.val{font-size:10px;font-weight:700;display:flex;justify-content:space-between;color:#a78bfa}
.vs2{position:absolute;top:8px;right:12px;font-size:11px;font-weight:700;color:#7c3aed;z-index:3;background:rgba(26,14,46,.8);padding:3px 8px;border-radius:6px}
.vd{padding:12px 16px 6px;background:rgba(26,14,46,.97)}
.vsp{font-size:14px;font-weight:700;margin-bottom:4px}
.vt{font-size:14px;line-height:1.5;min-height:56px}
.vc{padding:6px 16px 14px;display:flex;flex-direction:column;gap:7px;background:rgba(26,14,46,.97);overflow-y:auto;max-height:44vh;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.vch{padding:11px 14px;border-radius:8px;border:1px solid rgba(167,139,250,.2);background:rgba(167,139,250,.08);font-size:13px;font-weight:500;cursor:pointer;text-align:left;color:#e9d5ff;font-family:inherit}
.vch:active{transform:scale(.97);background:rgba(167,139,250,.15)}
.vt2{font-size:12px;color:#a78bfa;text-align:center;padding:10px;cursor:pointer}
.ew{flex:1;display:flex;flex-direction:column;overflow:hidden}
.ei{flex:1;position:relative;overflow:hidden;min-height:200px}
.ei img{width:100%;height:100%;object-fit:cover}
.ei .gd{position:absolute;bottom:0;left:0;right:0;height:60%;background:linear-gradient(transparent,#1a0e2e)}
.et{padding:14px;max-height:50%;overflow-y:auto;background:rgba(26,14,46,.97)}
.etl{font-size:18px;font-weight:900;margin-bottom:8px}
.etb{font-size:13px;line-height:1.6;color:#c4b5fd}
.est{display:flex;gap:10px;margin:10px 0;font-size:12px}
.ess{background:rgba(167,139,250,.1);padding:6px 12px;border-radius:8px}
.ess b{display:block;font-size:16px;color:#7c3aed}
.eb{display:flex;gap:8px;padding:0 16px 14px}
.eb .b{flex:1}
.gg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:14px}
.gi{border-radius:10px;overflow:hidden;border:1px solid rgba(167,139,250,.15);cursor:pointer;position:relative;aspect-ratio:3/4}
.gi img{width:100%;height:100%;object-fit:cover}
.gi .l{position:absolute;bottom:0;left:0;right:0;padding:6px 8px;background:linear-gradient(transparent,rgba(26,14,46,.95));font-size:11px;font-weight:600}
.gi .lk{display:flex;align-items:center;justify-content:center;height:100%;background:rgba(167,139,250,.05);flex-direction:column;gap:6px}
.gi .lk span{font-size:30px}
.gi .lk p{font-size:11px;color:#a78bfa}
.gv{position:fixed;inset:0;z-index:100;background:rgba(26,14,46,.97);display:flex;flex-direction:column;padding:14px}
.gv img{flex:1;object-fit:contain;max-width:100%;border-radius:10px}
.mf{padding:14px;display:flex;flex-direction:column;gap:12px}
.mfl{font-size:12px;font-weight:600;color:#a78bfa}
.mfi{padding:9px 10px;border-radius:8px;border:1px solid rgba(167,139,250,.2);background:rgba(167,139,250,.05);font-size:13px;color:#e9d5ff;font-family:inherit}
.mft{padding:9px 10px;border-radius:8px;border:1px solid rgba(167,139,250,.2);background:rgba(167,139,250,.05);font-size:11px;color:#e9d5ff;font-family:monospace;min-height:60px;resize:vertical}
.tt{display:flex;border-bottom:1px solid rgba(167,139,250,.15)}
.tt div{flex:1;padding:10px;text-align:center;font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;color:#a78bfa}
.tt div.act{border-bottom-color:#7c3aed;color:#fff}
.to{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#7c3aed;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;z-index:200;animation:ti .3s}
@keyframes ti{from{transform:translateX(-50%) translateY(20px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
.dv{height:1px;background:rgba(167,139,250,.15);margin:4px 0}

/* VN Engine CSS */
.vnbg{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.vnbg img{width:100%;height:100%;object-fit:cover;animation:vni .5s ease-in forwards}
@keyframes vni{from{opacity:0}to{opacity:1}}
.vnch{position:relative;z-index:1;flex:1;display:flex;align-items:center;justify-content:center;animation:vci .4s ease-out forwards}
@keyframes vci{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.vnbar{display:flex;gap:4px;padding:4px 8px;justify-content:flex-end;background:rgba(26,14,46,.5);position:relative;z-index:5}
.vnbar .b{font-size:11px;padding:4px 10px;border-radius:6px}
.vnbar .b.act{background:#7c3aed;color:#fff}
.vnbar .b.inact{background:rgba(167,139,250,.15);color:#a78bfa}
.vnfade{position:absolute;inset:0;background:#1a0e2e;z-index:50;pointer-events:none;opacity:0;transition:opacity .3s}
.vnfade.show{opacity:1;pointer-events:all}
.twc{display:inline-block;width:2px;height:14px;background:#e9d5ff;animation:tbk .5s infinite;margin-left:2px;vertical-align:middle}
@keyframes tbk{0%,50%{opacity:1}51%,100%{opacity:0}}
.dbox{position:relative;z-index:5;padding:10px 16px 4px;background:linear-gradient(180deg,rgba(26,14,46,.85),rgba(26,14,46,.98));border-top:1px solid rgba(167,139,250,.2)}
.dname{display:inline-block;font-size:13px;font-weight:700;padding:3px 12px;border-radius:6px;margin-bottom:6px}
.dtext{font-size:14px;line-height:1.5;min-height:48px}
.slots{display:flex;flex-direction:column;gap:8px;padding:14px}
.slot{border:1px solid rgba(167,139,250,.2);border-radius:10px;padding:12px;cursor:pointer;background:rgba(167,139,250,.05)}
.slot:active{transform:scale(.98)}
.slot .sh{font-size:12px;color:#a78bfa;margin-bottom:4px}
.slot .sd{font-size:14px;font-weight:600}
.slot .ss{font-size:11px;color:#a78bfa;margin-top:4px}
.slot.empty .sd{color:#a78bfa;font-style:italic}


.vnb{position:relative;z-index:4;padding:4px 12px;background:rgba(26,14,46,.6);display:flex;justify-content:space-between;align-items:center;font-size:12px}

/* === LANDSCAPE & TABLET SUPPORT === */
@media (orientation:landscape) and (max-width:1024px){
  #g{max-width:100%!important;height:100dvh}
  .vn{flex-direction:row!important;overflow:hidden}
  .vnch{flex:1;max-width:55%;align-items:center;justify-content:center}
  .vnbg{max-width:55%}
  .dbox{flex:0 0 45%;max-width:45%;display:flex;flex-direction:column;justify-content:center;padding:16px 20px;overflow-y:auto}
  .dtext{font-size:15px;min-height:60px}
  .vc{flex:0 0 45%;max-width:45%;padding:10px 20px;overflow-y:auto;max-height:none}
  .vch{padding:10px 14px;font-size:14px}
  .vnbar{position:absolute;top:0;right:0;z-index:10;background:rgba(26,14,46,.8);border-radius:0 0 0 8px}
  .tw{flex-direction:row!important;align-items:center;justify-content:center;padding:20px}
  .tw .ta{width:100px;height:100px;margin-bottom:0;margin-right:16px}
  .tw .tm{font-size:36px}
  .tw .tb{max-width:320px}
  .s{flex-direction:row!important}
  .sc{flex:1;overflow-y:auto}
}
@media (min-width:768px){
  #g{max-width:600px}
  .dtext{font-size:16px}
  .vch{padding:13px 16px;font-size:14px}
  .tm{font-size:36px}
  .ta{width:150px;height:150px}
  .tb{max-width:320px}
  .bp{font-size:16px;padding:12px 24px}
}
@media (orientation:landscape) and (min-width:1024px){
  #g{max-width:900px}
  .vnch{max-width:50%}
  .dbox{max-width:50%;padding:24px}
  .vc{max-width:50%;padding:16px 24px;max-height:none}
  .dtext{font-size:17px}
  .vch{padding:14px 18px;font-size:15px}
}
/* Landscape: ending screen side-by-side */
@media (orientation:landscape) and (max-width:1024px){
  .ew{flex-direction:row!important;align-items:stretch}
  .ei{flex:1;max-width:45%;display:flex;align-items:center;justify-content:center}
  .et{flex:1;max-width:55%;display:flex;flex-direction:column;justify-content:center;padding:16px 20px}
}
/* Landscape: select screen grid */
@media (orientation:landscape) and (max-width:1024px){
  .sc{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:12px}
  .cc{margin:0!important}
}
/* Landscape: belly mode */
@media (orientation:landscape) and (max-width:1024px){
  .s.vn>.vnch{flex:1;max-width:55%}
  .s.vn>.dbox{flex:0 0 45%;max-width:45%}
  .s.vn>.vc{flex:0 0 45%;max-width:45%;max-height:none}
}
/* Allow text selection in inputs/textareas */
input,textarea{touch-action:auto!important;-webkit-user-select:text!important;user-select:text!important}
/* Button touch feedback */
button,.vch,[data-a]{cursor:pointer;-webkit-touch-callout:none}
button:active,.vch:active{opacity:0.7;transform:scale(0.97)}

.vnch img,.vnbg img{pointer-events:none;-webkit-user-drag:none}
.vch,[data-a]{min-height:36px;min-width:36px}
button[data-a]{min-height:36px}nsform:scale(0.97)}

.vnch img,.vnbg img{pointer-events:none;-webkit-user-drag:none}
/* === CITY MAP === */
.map{flex:1;position:relative;background:linear-gradient(135deg,#1a0e2e,#2d1b4e);overflow:hidden;min-height:300px}
.mapbg{position:absolute;inset:0;background:radial-gradient(circle at 30% 40%,rgba(167,139,250,.08),transparent 40%),radial-gradient(circle at 70% 60%,rgba(244,114,182,.06),transparent 40%),radial-gradient(circle at 50% 50%,rgba(124,58,237,.04),transparent 60%)}
.mpin{position:absolute;transform:translate(-50%,-50%);text-align:center;cursor:pointer;padding:4px;transition:.2s}
.mpin:active{transform:translate(-50%,-50%) scale(.92)}
.micon{font-size:26px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.mpin.here{z-index:10}
.mpin.here .micon{filter:drop-shadow(0 0 10px #7c3aed)}
.mlbl{font-size:8px;font-weight:600;color:#c4b5fd;margin-top:1px;white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.mchars{margin-top:1px}
.mcharp{width:18px;height:18px;border-radius:50%;object-fit:cover;border:1px solid rgba(167,139,250,.4)}
.myou{font-size:8px;color:#7c3aed;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.mloc{padding:12px 14px;background:rgba(26,14,46,.95);border-top:1px solid rgba(167,139,250,.2)}
.mlocname{font-size:15px;font-weight:700;margin-bottom:3px}
.mlocdesc{font-size:11px;color:#a78bfa;margin-bottom:8px;line-height:1.4}
.mcharcard{border:1px solid rgba(167,139,250,.2);border-radius:10px;padding:8px;margin-bottom:6px;background:rgba(167,139,250,.05)}
.mcharcard .mcrow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.mcharcard .mcavatar{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid rgba(167,139,250,.3)}
.mcharcard .mcname{font-weight:700;font-size:13px}
.mcharcard .mcsub{font-size:10px;color:#a78bfa}
.mcharcard .mcbtns{display:flex;gap:5px}
.mcharcard .mcbtns .b{font-size:11px;padding:5px 8px;flex:1;border-radius:6px}
.mempty{text-align:center;color:#a78bfa;font-size:12px;padding:16px}
.mbar{display:flex;gap:6px;padding:6px 14px 10px}
.mbar .b{font-size:12px;padding:6px 12px}
.mstats{font-size:11px;color:#a78bfa;display:flex;gap:10px}
.mstats b{color:#e9d5ff}

.no-anim *{animation:none!important;transition:none!important}
.no-anim .vc{opacity:1!important;display:flex!important}
.no-anim .s{animation:none!important;opacity:1!important}
.no-anim .dtext{opacity:1!important}
</style>
</head>

{id:"beerus",name:"Beerus",sub:"God of Destruction",altEnd:"Beerus gazes at you with an intensity that transcends his usual lazy demeanor. \"You... you truly gave me everything,\" he murmurs, pulling you against his warm, soft middle. \"I never thought I would say this to a mortal. But you are not a mortal to me anymore. You are MINE. And I take care of what is mine.\" His belly envelops you completely, and for the first time, the God of Destruction seems at peace.",ac:"#7c3aed",dr:7,bg:"https://media.base44.com/images/public/6a65151d5dd046764e8de589/9bd0e342f_generated_image.png",p:I.bp,e:I.be,cg2:"",
 spr:{happy:I.bh,angry:I.ba,sad:I.bs,surprised:I.bu,blush:I.bl,smug:I.bm,belly:I.bbelly},
 d:"Lazy, powerful, obsessed with food. The universe's most dangerous napper.",
 s:[
  {sp:"Narrator",t:"You materialize on Beerus' planet. The God of Destruction sprawls on a floating cushion, snoring softly. Whis is nowhere in sight.",ex:"smug",ch:[{t:"Wake him gently",a:2},{t:"Wait patiently",a:1},{t:"Poke him",a:-2}]},
  {sp:"Beerus",t:"Mmm... who dares disturb the sleep of a God of Destruction? You have exactly three seconds to justify your existence.",ex:"angry",ch:[{t:"I brought you a gift",a:3},{t:"I came to see you",a:2},{t:"I-I'm sorry!",a:1}]},
  {sp:"Beerus",t:"A gift? You know how to please a god. What is it? It better be worth waking up for.",ex:"surprised",ch:[{t:"Your favorite pudding",a:3},{t:"A rare cosmic delicacy",a:2},{t:"Myself",a:1}]},
  {sp:"Narrator",t:"Beerus' golden eyes light up. He devours the offering with terrifying, god-like speed. A satisfied purr rumbles through the planet.",ex:"happy",ch:[{t:"I can cook more anytime",a:3},{t:"Watch in awe",a:2},{t:"That was my lunch...",a:-1}]},
  {sp:"Beerus",t:"You amuse me, mortal. More than any food ever has. Perhaps I should keep you around... permanently.",ex:"smug",ch:[{t:"I'd like that",a:3},{t:"Keep me close",a:2},{t:"As what exactly?",a:1}]},
  {sp:"Beerus",t:"As my little belly pet. You'll live inside me, warm and safe forever. A god needs companionship, after all.",ex:"blush",ch:[{t:"Yes, my God",a:3,end:1},{t:"I'm scared but... yes",a:2,end:1},{t:"Absolutely not!",a:-3,back:4}]},
  {sp:"ENDING",t:"Beerus opens his mouth, warm divine energy flowing around you. You slip inside the God of Destruction like sinking into a warm bath. His belly is a cozy pocket dimension — soft, warm, glowing with golden light. You curl up like a pet as Beerus purrs in his sleep. You are Beerus' belly pet — cherished by a god.",ex:"happy",end:1}
 ]},
{id:"champa",name:"Champa",altEnd:"Champa's round face breaks into the biggest grin you've ever seen. \"You ACTUALLY stayed! Nobody stays!\" He squeezes you against his enormous belly, giggling. \"You're different. You're SPECIAL. And I'm gonna keep you forever and ever and... *sniffles* ...I'm not crying, you're crying! Get in here!\" He swallows you up with the biggest, happiest gulp of his life.",sub:"God of Destruction (U6)",ac:"#ea580c",dr:7,bg:"https://media.base44.com/images/public/6a65151d5dd046764e8de589/9c1787117_generated_image.png",p:I.cp,e:I.ce,
 spr:{happy:I.ch,angry:I.ca,sad:I.cs,surprised:I.cu,blush:I.cl,smug:I.cm,belly:I.cbelly},
 d:"Gluttonous, competitive, surprisingly lovable. Will fight you for the last dumpling.",
 s:[
  {sp:"Narrator",t:"You find Champa at a universe food tournament, surrounded by towers of empty plates. Vados watches with mild concern.",ex:"happy",ch:[{t:"Impressive eating!",a:2},{t:"Can I cook for you?",a:3},{t:"You ate ALL that?",a:1}]},
  {sp:"Champa",t:"Heh! You think that's impressive? I haven't even started yet! Vados, get this mortal a chair!",ex:"smug",ch:[{t:"I have a recipe you'd love",a:3},{t:"I bet you could eat more",a:2},{t:"Show me what you got",a:1}]},
  {sp:"Narrator",t:"You present your homemade dish. Champa's eyes go wide, his tail puffing up with excitement.",ex:"surprised",ch:[{t:"It's a family recipe",a:2},{t:"Made it just for you",a:3},{t:"It's nothing special",a:1}]},
  {sp:"Champa",t:"*devours the entire dish in seconds* THIS IS AMAZING! You're not allowed to leave!",ex:"happy",ch:[{t:"I can make more!",a:3},{t:"I'm glad you like it",a:2},{t:"Want seconds?",a:3}]},
  {sp:"Champa",t:"Nobody cooks for me like that. Not even Vados! You're staying with me now, no arguments!",ex:"smug",ch:[{t:"Forever?",a:2},{t:"I'd love to",a:3},{t:"Where would I stay?",a:1}]},
  {sp:"Champa",t:"Right here! In my belly! Nice and warm, just the two of us!",ex:"blush",ch:[{t:"That sounds perfect",a:3,end:1},{t:"You want to eat me?",a:2,end:1},{t:"No way!",a:-3,back:4}]},
  {sp:"ENDING",t:"Champa grins and opens wide. With a happy gulp, you're inside the chubby God of Destruction. His belly is warm and soft like a giant fluffy pillow. You snuggle in as Champa pats his tummy happily. 'Now you can cook for me from the inside!' You are Champa's belly pet — living the warm, well-fed life.",ex:"happy",end:1}
 ]},
{id:"husk",name:"Husk",altEnd:"Husk takes a long drag from his bottle, then looks at you with surprisingly soft eyes. \"You know... I haven't felt this way about anyone. Not since I was alive.\" He pulls you close, his belly warm against you. \"Stay. Just... stay. Please.\" The word 'please' from Husk carries more weight than any deity's command.",sub:"Bartender of Hazbin Hotel",ac:"#dc2626",bg:"https://media.base44.com/images/public/6a65151d5dd046764e8de589/681c30cb6_generated_image.png",p:I.hp,e:I.he,
 spr:{happy:I.hh,angry:I.ha,sad:I.hs,surprised:I.hu,blush:I.hl,smug:I.hm,belly:I.hbelly},
 d:"Grumpy cat demon, gambling addict, surprisingly tender when you get past the sarcasm.",
 s:[
  {sp:"Narrator",t:"You walk into the Hazbin Hotel bar. A grumpy cat demon with wings is cleaning a glass, not looking up.",ex:"smug",ch:[{t:"Whiskey, neat",a:3},{t:"Something sweet",a:2},{t:"Just water please",a:-1}]},
  {sp:"Husk",t:"Heh. You got taste. Most people stumble in here ordering dumb rainbow drinks. Sit down.",ex:"smug",ch:[{t:"I know what I like",a:2},{t:"You seem interesting",a:3},{t:"Just thirsty",a:1}]},
  {sp:"Narrator",t:"You settle onto a barstool. Husk slides your drink over with a lazy smirk. The bar is quiet, just the two of you.",ex:"happy",ch:[{t:"Want to play a game?",a:3},{t:"Tell me about yourself",a:2},{t:"What's the bet?",a:2}]},
  {sp:"Husk",t:"Poker? With me? You're either brave or stupid. I like both. I never lose.",ex:"smug",ch:[{t:"I'm feeling lucky",a:3},{t:"Loser owes a favor",a:3},{t:"Just for fun",a:1}]},
  {sp:"Narrator",t:"You lose the hand. Husk lays down his cards with a lazy grin. 'You owe me, kid.' His eyes glint with something unexpected.",ex:"surprised",ch:[{t:"Name your price",a:3},{t:"I'm all yours",a:3},{t:"Double or nothing?",a:1}]},
  {sp:"Husk",t:"The price is... you stay with me. In here. Warm and cozy in my gut. Forever. I don't want you walking out that door.",ex:"blush",ch:[{t:"Deal",a:3,end:1},{t:"You want to... eat me?",a:2,end:1},{t:"That's crazy",a:-2,back:4}]},
  {sp:"ENDING",t:"Husk finishes his drink and picks you up gently. 'Nothing personal, kid. Just... don't want to be alone anymore.' You slide down into the grumpy cat demon. His belly is warm, a bit messy, but surprisingly comfortable — like the back booth of his favorite bar. You are Husk's belly pet. Home sweet home.",ex:"happy",end:1}
 ]},
{id:"vox",name:"Vox",sub:"CEO of VoxTek",ac:"#06b6d4",bg:"https://media.base44.com/images/public/6a65151d5dd046764e8de589/cd3ac26f2_generated_image.png",p:I.vp,e:I.ve,
 spr:{happy:I.vh,angry:I.va,sad:I.vs,surprised:I.vu,blush:I.vl,smug:I.vm,belly:I.vbelly},
 d:"Charismatic TV demon, tech mogul, control freak. Wants to own everything — including you.",
 s:[
  {sp:"Narrator",t:"You enter Vox's penthouse office. Screens cover every wall. The TV demon turns to face you, his screen flickering with curiosity.",ex:"smug",ch:[{t:"Nice place",a:2},{t:"You're more impressive in person",a:3},{t:"Hi",a:1}]},
  {sp:"Vox",t:"Of course it is. I designed every pixel. And you're... new. Consider yourself exclusive content.",ex:"smug",ch:[{t:"I'm here for you",a:3},{t:"I'm your biggest fan",a:2},{t:"Just passing by",a:-1}]},
  {sp:"Narrator",t:"Vox moves closer, digital energy crackling between you. His screen shifts through colors — interested.",ex:"surprised",ch:[{t:"Show me your empire",a:3},{t:"Tell me your secrets",a:2},{t:"You're beautiful",a:3}]},
  {sp:"Vox",t:"Beautiful? Ha. I'm more than that. I'm the future of entertainment. I AM the screen everyone watches.",ex:"smug",ch:[{t:"I believe it",a:2},{t:"Show me the future",a:3},{t:"You're my future",a:3}]},
  {sp:"Narrator",t:"Vox takes your hand. A jolt of digital energy flows through you. His screen shows a heart for a split second.",ex:"blush",ch:[{t:"I don't want to leave",a:3},{t:"Keep me here",a:3},{t:"This is moving fast",a:1}]},
  {sp:"Vox",t:"Good. Because you're not leaving. You're going inside me — permanently. My most exclusive content.",ex:"smug",ch:[{t:"I'm yours",a:3,end:1},{t:"Inside... you?",a:2,end:1},{t:"Let me go",a:-3,back:4}]},
  {sp:"ENDING",t:"Vox's screen flickers with a bright smile. 'Welcome to prime time.' Digital energy flows around you as you're pulled into the TV demon. Inside, it's like a cozy digital apartment — screens, ambient blue lighting, perfect temperature. You are Vox's belly pet — his most exclusive content.",ex:"happy",end:1}
 ]},
{id:"vegeta",name:"Great Ape Vegeta",sub:"Oozaru Saiyan",ac:"#16a34a",bg:"https://media.base44.com/images/public/6a65151d5dd046764e8de589/dd2c94beb_generated_image.png",p:I.gp,e:I.ge,
 spr:{happy:I.gh,angry:I.ga,sad:I.gs,surprised:I.gu,blush:I.gl,smug:I.gm,belly:I.gbelly},
 d:"A towering were-ape under the full moon. Terrifyingly powerful, surprisingly gentle.",
 s:[
  {sp:"Narrator",t:"Under a full moon, a massive Oozaru towers over the landscape. His glowing red eyes find you. The ground shakes with each step.",ex:"angry",ch:[{t:"Stand your ground",a:3},{t:"Bow respectfully",a:2},{t:"RUN!",a:-3}]},
  {sp:"Narrator",t:"The great ape kneels down, sniffing you curiously. He doesn't attack. A low rumble emanates from his massive chest.",ex:"surprised",ch:[{t:"Offer him food",a:3},{t:"Touch his fur",a:2},{t:"Stay perfectly still",a:1}]},
  {sp:"Narrator",t:"The Oozaru lets out a deep rumble. Almost... a purr? His red eyes soften. He seems to like you.",ex:"happy",ch:[{t:"You're magnificent",a:3},{t:"Can I climb on you?",a:2},{t:"You won't hurt me?",a:1}]},
  {sp:"Narrator",t:"You climb onto his massive shoulder. The world looks so small from up here. Wind whips through his brown fur as he gazes at the moon.",ex:"happy",ch:[{t:"This is incredible",a:3},{t:"I feel safe with you",a:3},{t:"Don't drop me!",a:-1}]},
  {sp:"Narrator",t:"The great ape cups you gently in his enormous palm. His eyes are warm now. He brings you closer to his face.",ex:"blush",ch:[{t:"I belong with you",a:3},{t:"Protect me",a:2},{t:"What happens now?",a:1}]},
  {sp:"Narrator",t:"The Oozaru opens his mighty maw slowly, carefully. He wants to keep you safe inside him.",ex:"sad",ch:[{t:"I trust you",a:3,end:1},{t:"Will I be safe in there?",a:2,end:1},{t:"NO!",a:-3,back:4}]},
  {sp:"ENDING",t:"The massive Oozaru carefully lifts you to his maw. His red eyes soften as he opens wide, gentle despite his enormous size. You slide down into his great belly — warm, vast, like sleeping inside a mountain that breathes. His heartbeat surrounds you like a lullaby. You are the Great Ape's belly pet — protected by the most powerful creature in the universe.",ex:"happy",end:1}
 ]}

,{id:"anubis",name:"Anubis",sub:"Jackal Warrior of the Sands",ac:"#0ea5e9",dr:8,bg:I.ab,p:I.ap,e:I.ae,
 spr:{happy:I.ah,angry:I.aan,sad:I.asd,surprised:I.au,blush:I.al,smug:I.am,belly:I.abelly},
 d:"A fierce jackal warrior from the desert temples. Sharp blade, sharper wit, softer heart than she lets on.",
 s:[
  {sp:"Narrator",t:"A tall jackal warrior stands atop the temple steps, dagger at her hip glinting in the sunset. Her blue eyes lock onto you immediately.",ex:"smug",ch:[{t:"Approach confidently",a:3},{t:"Bow respectfully",a:2},{t:"Stay back, wary",a:-2}]},
  {sp:"Anubis",t:"\"Not many wander this far into the sands. You've got guts... or you're lost. Which is it?\"",ex:"smug",ch:[{t:"'Neither. I came looking for you'",a:3},{t:"'Bit of both, honestly'",a:2},{t:"'Just passing through'",a:-1}]},
  {sp:"Anubis",t:"She circles you once, sizing you up like prey — or a potential sparring partner. Her tail flicks with interest.",ex:"surprised",ch:[{t:"Hold her gaze steady",a:3},{t:"Compliment her blade",a:2},{t:"Ask about the temple",a:1}]},
  {sp:"Anubis",t:"\"Hmph. You've got spine. Most run the second they see the fangs.\" She sheathes her dagger and offers a clawed hand instead.",ex:"happy",ch:[{t:"Take her hand",a:3},{t:"Ask her to train you",a:3},{t:"Admit you're nervous",a:1}]},
  {sp:"Anubis",t:"Sitting beside a fire under the stars, she tells you stories of the old temple guardians. Her voice softens when she isn't performing toughness.",ex:"blush",ch:[{t:"Listen intently",a:3},{t:"Tell her you feel safe here",a:3},{t:"Ask what she's protecting",a:2}]},
  {sp:"Anubis",t:"She goes quiet, staring at her own hands. \"Being a guardian means being alone a lot. I'm... not used to company sticking around.\"",ex:"sad",ch:[{t:"I'm not going anywhere",a:3,end:1},{t:"You don't have to be alone",a:2,end:1},{t:"I should get going",a:-3,back:5}]},
  {sp:"ENDING",t:"Anubis exhales, a rare vulnerable smile crossing her muzzle. \"Fine. Have it your way.\" She scoops you up gently in clawed but careful hands, pressing you against her stomach with surprising tenderness. \"Guardians protect what matters most,\" she murmurs, easing you inside her belly. It's warm, safe, and her heartbeat thrums steady around you like temple drums. You've become the jackal warrior's most treasured, most protected belly pet.",ex:"happy",end:1}
 ]},
{id:"vincent",name:"Vincent",sub:"Obstagoon",ac:"#6366f1",bg:I.obg,p:I.op,e:I.oe,
 spr:{happy:I.oh,angry:I.oa,sad:I.os,surprised:I.ou,blush:I.ol,smug:I.om,belly:I.obelly},
 d:"Street-smart badger with a heart of gold. Edgy exterior, secretly a softie. Lives in a cozy alley hideaway.",
 et:"You became Vincent's belly pet. The tough Obstagoon who finally found someone to keep close. Safe in his alley, warm in his belly \u2014 you've never felt more at home.",
 s:[
  {sp:"Narrator",t:"You're walking through a moonlit alley when a figure steps out of the shadows. An Obstagoon with a black leather jacket and star-shaped eyes studies you.",ch:[{t:'"Nice jacket"',a:2},{t:'"Who are you?"',a:1},{t:'"I should go"',a:-2}]},
  {sp:"Vincent",t:"Heh. You got guts walking through MY alley. Name's Vincent. You ain't from around here, are ya?",ch:[{t:'"Just passing through"',a:1},{t:'"Heard this alley had the coolest Pokemon"',a:3},{t:'"Your alley? Since when?"',a:-1}]},
  {sp:"Narrator",t:"Vincent leads you deeper into the alley, where fairy lights hang from fire escapes. It's surprisingly cozy. He pulls out a crate for you to sit on.",ch:[{t:'"This is actually really nice"',a:3},{t:'"You decorated this yourself?"',a:2},{t:'"I expected something dirtier"',a:-2}]},
  {sp:"Vincent",ex:"sad",t:"Don't go telling everyone about this place, alright? It's... kinda my safe spot. Been living here since I evolved.",ch:[{t:'"Your secret is safe with me"',a:3},{t:'"Why did you evolve out here?"',a:2},{t:"\"That's kinda sad\"",a:1}]},
  {sp:"Narrator",t:"Vincent's star-shaped eyes catch the moonlight. He pulls you closer, his fur bristling with warmth. You know... you're the first person who didn't run from me.",ch:[{t:"\"I'm not afraid of you\"",a:3},{t:'"Why would I run?"',a:2},{t:'"Maybe I should run"',a:-3}]},
  {sp:"Vincent",ex:"blush",t:"His expression softens. You ain't like the others. They see the claws, the tongue, the fangs... and they bolt. But you stayed.",ch:[{t:'*Lean into his paw*',a:3},{t:'"Of course I stayed"',a:2},{t:'"Don\'t get sappy on me"',a:-1}]},
  {sp:"ENDING",t:"Vincent pulls you into a tight embrace, his warm fur enveloping you. You're mine now, understand? Gonna keep you right here... where you belong. You feel yourself sinking into his warm, soft midsection, safe and content. Vincent pats his belly with a satisfied grin, his tongue lolling out happily.",end:1}
 ]
},
{id:"fomo",name:"Fomo",sub:"The Mouse Predator",ac:"#2dd4bf",dr:0,bg:"",p:"fomo-smug.png",e:"fomo-happy.png",
 spr:{happy:"fomo-happy.png",angry:"fomo-angry.png",sad:"fomo-sad.png",surprised:"fomo-surprised.png",blush:"fomo-blush.png",smug:"fomo-smug.png",belly:"fomo-belly.png"},
 d:"A spotted, big-eared creature who lounges by the old pool at night. Playful, sly, and hungrier than he lets on. Something about him doesn't just want to hold you close \u2014 it wants to make you part of him, forever.",
 s:[
  {sp:"Narrator",t:"You wander past a fenced-off public pool, closed for the night. Under the flickering moonlight, a spotted creature with huge ears lounges by the water's edge, tail curled lazily behind him.",ch:[{t:'"Mind if I join you?"',a:2},{t:'"Isn\'t this place closed?"',a:1},{t:'"Sorry, wrong place"',a:-2}]},
  {sp:"Fomo",t:"Heh, look what wandered in. Most people don't notice me here \u2014 or if they do, they don't stick around. You're either brave or you don't know any better. Which is it?",ch:[{t:'"Bit of both, honestly"',a:3},{t:'"I go where I want"',a:1},{t:'"Should I be worried?"',a:-1}]},
  {sp:"Narrator",t:"Fomo pats the tile beside him, inviting you to sit. Up close, his spots seem to shimmer faintly, like they're holding some private secret just under the surface.",ch:[{t:"Sit down next to him",a:3},{t:'"What\'s with the spots?"',a:2},{t:"Keep your distance",a:-2}]},
  {sp:"Fomo",ex:"smug",t:"You noticed, huh? Let's just say... I hold onto things. Things I like. And once I decide I like something, I don't really let go of it. Not all the way, anyway.",ch:[{t:'"Sounds possessive"',a:1},{t:'"Is that a threat or an invitation?"',a:3},{t:'"That\'s a weird thing to say"',a:-1}]},
  {sp:"Fomo",ex:"sad",t:"Ha \u2014 don't look so nervous. Out here, alone, most nights... it gets quiet. Lonely, even. So when someone actually stays and talks to me instead of running? That means something. You mean something.",ch:[{t:"Rest your hand on his shoulder",a:3},{t:'"I don\'t scare easy"',a:2},{t:'"That\'s kind of sad"',a:1}]},
  {sp:"Fomo",ex:"blush",t:"His ears perk up and his grin softens into something almost shy. You really aren't planning on leaving, are you? Good. Because I wasn't planning on letting you.",ch:[{t:"\"I'm exactly where I want to be\"",a:3},{t:'"Let\'s find out together"',a:2},{t:'"Wait, what do you mean?"',a:-1}]},
  {sp:"ENDING",t:"Fomo pulls you into the warm water beside him, his big ears twitching happily. His arms wrap around you, spotted fur damp and impossibly soft. \"Just relax,\" he murmurs against your ear. \"I've got you now.\" Warmth spreads through you as he holds you close against his round middle \u2014 safe, content, and utterly his.",end:1}
 ]
}
,
{id:"wolf",name:"Wolf O'Donnell",sub:"Star Wolf Mercenary",ac:"#dc2626",dr:8,bg:"",p:"https://media.base44.com/images/public/6a65151d5dd046764e8de589/c5d1f2343_Screenshot_20260802_172430_YouTube.jpg",e:"https://media.base44.com/images/public/6a65151d5dd046764e8de589/c5d1f2343_Screenshot_20260802_172430_YouTube.jpg",
 spr:{happy:"https://media.base44.com/images/public/6a65151d5dd046764e8de589/c5d1f2343_Screenshot_20260802_172430_YouTube.jpg",angry:"https://media.base44.com/images/public/6a65151d5dd046764e8de589/c5d1f2343_Screenshot_20260802_172430_YouTube.jpg",sad:"https://media.base44.com/images/public/6a65151d5dd046764e8de589/c5d1f2343_Screenshot_20260802_172430_YouTube.jpg",surprised:"https://media.base44.com/images/public/6a65151d5dd046764e8de589/c5d1f2343_Screenshot_20260802_172430_YouTube.jpg",blush:"https://media.base44.com/images/public/6a65151d5dd046764e8de589/c5d1f2343_Screenshot_20260802_172430_YouTube.jpg",smug:"https://media.base44.com/images/public/6a65151d5dd046764e8de589/c5d1f2343_Screenshot_20260802_172430_YouTube.jpg",belly:"https://media.base44.com/images/public/6a65151d5dd046764e8de589/c5d1f2343_Screenshot_20260802_172430_YouTube.jpg"},
 d:"A scarred mercenary captain with a wicked grin and an appetite to match his reputation. Commands his own cruiser, answers to no one, and never turns down a good challenge \u2014 or a good meal.",
 s:[
  {sp:"Narrator",t:"You sneak aboard a docked mercenary cruiser on a dare, boots echoing on the metal floor. A scarred gray wolf in a leather jacket leans against the console, one red eye cracking open as he notices you.",ch:[{t:'"Nice ship"',a:2},{t:'"I heard this place doesn\'t take visitors"',a:1},{t:"Try to sneak back out",a:-2}]},
  {sp:"Wolf",t:"Heh. Got some nerve, sneaking onto Star Wolf's ship uninvited. Most people who try that don't get a second chance to brag about it. Lucky for you, I'm in a good mood tonight.",ch:[{t:'"Guess I got lucky then"',a:2},{t:'"I\'m not most people"',a:3},{t:'"I\'ll leave if you want"',a:-1}]},
  {sp:"Narrator",t:"Wolf pushes off the console and saunters closer, sizing you up with a predator's grin. The cockpit hums quietly around you, neon light glinting off his badge.",ch:[{t:"Hold your ground",a:3},{t:'"Something I can help with?"',a:2},{t:"Step back",a:-2}]},
  {sp:"Wolf",ex:"smug",t:"Not gonna lie \u2014 I like the ones who don't flinch. Most of my crew scattered years ago. Ship's been quiet since. A merc captain gets bored being the only interesting thing on board, you know?",ch:[{t:'"Sounds lonely up here"',a:2},{t:'"Maybe you need better company"',a:3},{t:'"Not my problem"',a:-2}]},
  {sp:"Wolf",ex:"sad",t:"Heh, don't go feeling sorry for me. I run my own show, always have. But yeah... it'd be nice having someone worth keeping around for once. Someone who isn't scared off by a few scars and a bad reputation.",ch:[{t:"Step closer",a:3},{t:'"Your reputation doesn\'t scare me"',a:2},{t:'"That\'s rough"',a:1}]},
  {sp:"Wolf",ex:"blush",t:"His grin softens into something more genuine, red eyes locked on yours. Careful, kid. Keep looking at me like that and I might just decide to keep you. Permanently. On this ship. With me.",ch:[{t:'"Is that a threat or a promise?"',a:3},{t:'"Maybe I want to be kept"',a:3},{t:'"I should go"',a:-3}]},
  {sp:"ENDING",t:"Wolf's grin widens into something hungry as he pulls you flush against him, his belly pressing warm and solid between you. \"Wrong move, kid,\" he chuckles low against your ear. \"Should've run when you had the chance.\" His arms wrap tight, and the world tilts as he settles you snug against his gut with a satisfied groan. \"Welcome aboard. Permanently.\"",end:1}
 ]
},
{id:"glacia",name:"Glacia",sub:"The Glaceon",ac:"#38bdf8",bg:"",p:"https://media.base44.com/images/public/6a65151d5dd046764e8de589/25654653e_GLACEON_9.png",e:"https://media.base44.com/images/public/6a65151d5dd046764e8de589/25654653e_GLACEON_9.png",
 spr:{happy:"https://media.base44.com/images/public/6a65151d5dd046764e8de589/25654653e_GLACEON_9.png",angry:"https://media.base44.com/images/public/6a65151d5dd046764e8de589/25654653e_GLACEON_9.png",sad:"https://media.base44.com/images/public/6a65151d5dd046764e8de589/25654653e_GLACEON_9.png",surprised:"https://media.base44.com/images/public/6a65151d5dd046764e8de589/25654653e_GLACEON_9.png",blush:"https://media.base44.com/images/public/6a65151d5dd046764e8de589/25654653e_GLACEON_9.png",smug:"https://media.base44.com/images/public/6a65151d5dd046764e8de589/25654653e_GLACEON_9.png",belly:"https://media.base44.com/images/public/6a65151d5dd046764e8de589/25654653e_GLACEON_9.png"},
 d:"A cool, composed Glaceon with a quiet elegance and a playful streak she rarely shows. Keeps to her frost cavern, watching visitors with sharp icy-blue eyes before deciding if they're worth melting for.",
 s:[
  {sp:"Narrator",t:"Deep in a frost-lined cavern, crystalline ice formations glitter under a pale blue light. A Glaceon sits poised atop a frozen ledge, tail curled neatly, studying you with calm, assessing eyes.",ch:[{t:'"Sorry to intrude"',a:2},{t:'"This place is beautiful"',a:2},{t:"Back away slowly",a:-1}]},
  {sp:"Glacia",t:"Hm. Not many make it this deep without freezing solid first. You must be either very brave, or very foolish. I haven't decided which yet.",ch:[{t:'"Maybe a bit of both"',a:3},{t:'"I\'m good with cold"',a:1},{t:'"I can leave if you want"',a:-1}]},
  {sp:"Narrator",t:"Glacia tilts her head, ear-fins catching the light like glass. She steps down from her ledge, frost crunching softly under each paw, circling you with quiet curiosity.",ch:[{t:"Stay perfectly still",a:2},{t:'"Do you get visitors often?"',a:2},{t:"Try to walk past her",a:-2}]},
  {sp:"Glacia",ex:"smug",t:"Rarely. Most creatures fear the cold, or fear me. It's rather... isolating, being the only cool head in a warm world. Though I've grown fond of the quiet. Mostly.",ch:[{t:'"I don\'t mind the quiet either"',a:2},{t:'"You don\'t seem so scary"',a:3},{t:'"That sounds lonely"',a:1}]},
  {sp:"Glacia",ex:"blush",t:"A faint shimmer of color rises under her fur \u2014 the closest thing to a blush an ice-type can manage. ...You're rather forward, aren't you. Most don't get this close and live to talk about it. I find I don't mind, with you.",ch:[{t:"Reach out gently",a:3},{t:'"I like being close to you"',a:3},{t:'"Should I be worried?"',a:-1}]},
  {sp:"Glacia",ex:"happy",t:"She presses close, cool and smooth, a soft satisfied hum vibrating in her chest. Then I suppose... I'll simply have to make sure you never want to leave. I've decided, you see. You're mine now.",ch:[{t:"Melt into her embrace",a:3},{t:'"I wasn\'t planning on leaving"',a:2},{t:'"W-wait, what do you mean?"',a:-1}]},
  {sp:"ENDING",t:"Glacia curls herself around you with surprising warmth beneath all that frost, her cool fur soft against your skin. \"There,\" she murmurs, voice a low, satisfied purr as her belly gently swells to hold you close. \"Safe. Quiet. Mine.\" The ice around you shimmers softly, and for the first time, the cavern doesn't feel cold at all.",end:1}
 ]
},
{id:"riko",name:"Riko",altEnd:"Riko's confident smirk crumbles into genuine, raw vulnerability. \"I... I was gonna drain you. That was the plan. But now... *voice cracking* ...I don't want to. I want you to WANT to be here.\" His eyes glisten. \"You chose me. A nobody. A level 3 mob. That's the strongest thing anyone's ever done for me.\" He pulls you in gently, no drain, no tricks. Just a small demon holding someone who finally saw him.",sub:"Low-Level Demon Mob",ac:"#ef4444",dr:10,bg:"",p:"riko-base.png",e:"riko-base.png",
 spr:{happy:"riko-happy.png",angry:"riko-angry.png",sad:"riko-sad.png",surprised:"riko-surprised.png",blush:"riko-blush.png",smug:"riko-smug.png",belly:"riko-belly.png"},
 d:"A scrappy low-level demon who compensates for his weak stats with one overpowered ability \u2014 his stomach. He can\'t fight worth a damn, but he can swallow beings ten times his level and keep them tucked away. Proud, cocky, and surprisingly clingy.",
 s:[
  {sp:"Narrator",t:"You wander into a dim crossroads lit by flickering hellfire lamps. A small red demon sits on a crate, kicking his feet boredly. He looks weak \u2014 barely a tutorial enemy \u2014 but something about that confident grin makes you hesitate.",ch:[{t:'"You don\'t look so tough"',a:-1},{t:'"What are you doing out here?"',a:2},{t:'"I should probably keep walking"',a:-1}]},
  {sp:"Riko",ex:"smug",t:"Tough? Nah. I\'m the weakest mob in this entire zone. Level 3, maybe 4 on a good day. But see \u2014 *pats his belly* \u2014 I got a trick up my sleeve. Er, my gut. Level doesn\'t matter much when you\'re INSIDE something, does it?",ch:[{t:'"What\'s that supposed to mean?"',a:2},{t:'"You swallowed someone?"',a:3},{t:'"Sure, buddy. Sure."',a:-1}]},
  {sp:"Riko",ex:"happy",t:"Heh, don\'t believe me? Fair enough. Most don\'t. They see a low-level mob and think \"easy fight.\" Then they wake up in here. *taps belly* I\'ve got a level 40 barbarian in there right now. Big guy. Thought he could take me. Now he\'s just... warm company.",ch:[{t:'"That\'s... actually impressive"',a:3},{t:'"Doesn\'t that feel wrong?"',a:1},{t:'"I bet I could take you"',a:-2}]},
  {sp:"Riko",ex:"sad",t:"Look, I KNOW I\'m the bottom of the food chain. Every other demon in this place could swat me like a fly. That\'s WHY I figured out how to do this. Nobody expects the weak one to be dangerous. It\'s the only thing keeping me alive down here, honestly.",ch:[{t:'"You\'re smarter than you look"',a:3},{t:'"So it\'s survival, not cruelty?"',a:2},{t:'"Sounds like you\'re scared"',a:-1}]},
  {sp:"Riko",ex:"blush",t:"Smart? *his ears twitch, face flushing darker red* Nobody\'s ever said that to me before. They just see \"low-level mob\" and write me off. But you\'re actually... talking to me. Like I\'m a real person. That\'s... huh. That\'s new.",ch:[{t:"Sit down next to him",a:3},{t:'"You ARE a real person"',a:3},{t:'"Don\'t get sappy on me"',a:-1}]},
  {sp:"Riko",ex:"smug",t:"Alright, cards on the table. I could swallow you right now. You\'re what, level 15? Easy. But... I don\'t want to. Not this time. I want you to STAY because you want to. *grins* ...Okay, maybe I want you to stay because I want to keep you. Same difference, right?",ch:[{t:'"I\'m not going anywhere"',a:3},{t:'"So you\'re asking nicely AND threatening?"',a:2},{t:'"I don\'t get eaten that easy"',a:-1}]},
  {sp:"ENDING",t:"Riko\'s tail swishes excitedly as he pulls you close, his small frame surprisingly strong. \"Told you,\" he whispers, voice cracking with genuine happiness. \"Nobody expects the weak one.\" His belly swells warm and round as he tucks you safely inside, the faint muffled voice of the barbarian inside grumbling in protest. \"Shush, you\'ve got company now,\" Riko giggles, patting his fuller gut. \"My little secret weapon. And my new favorite person.\"",end:1}
 ]
},
  {id:"aether",name:"Aether",sub:"The Sanctuary",altEnd:"Aether\'s arms close around you, gentle and certain. \"You came back.\" His belly is soft, warm, and utterly safe \u2014 a place where nothing is taken from you. You rest. You heal. And when you finally step out, the weight you carried is gone.",ac:"#a78bfa",bg:"",dr:-5,p:"https://storage.googleapis.com/dramaland-public/ugc_media/20260729/48ddd5322cc544c8a7be8350c5faf96d.jpg",e:"https://storage.googleapis.com/dramaland-public/ugc_media/20260729/48ddd5322cc544c8a7be8350c5faf96d.jpg",d:"A quiet Lucario who runs the only cafe in Destiny City where nobody has to perform. His belly is a sanctuary \u2014 the drain runs backwards in there. You come in carrying something, and you leave with none of it.",s:[
  {sp:"Narrator",t:"The Quiet Cafe smells of fresh coffee and old paper. A tall Lucario in a lilac sweater sits by the window, golden eyes lifting as you walk in. The seat across from him is already pulled out.",ch:[{t:"Sit down",a:3},{t:"Stand by the door",a:1},{t:"Ask if the seat is taken",a:2}]},
  {sp:"Aether",t:"Rest here. You don\'t have to explain yourself. I won\'t ask for more than you want to give.",ch:[{t:"That\'s... exactly what I needed",a:3},{t:"You don\'t even know me",a:1},{t:"What do you get out of this?",a:2}]},
  {sp:"Aether",t:"I get the quiet knowing that someone let go for a moment. That\'s the whole transaction. My belly is a place to put down what you carry \u2014 not to lose it.",ch:[{t:"Can I stay a while?",a:3},{t:"Show me",a:2},{t:"I don\'t trust this",a:-1}]},
  {sp:"Aether",t:"Of course. Slide in. It\'s warm, it\'s soft, and the drain runs the wrong way in here. Whatever you\'re carrying, you\'ll set it down. When you\'re ready, you walk out lighter.",ch:[{t:"I\'m ready",a:3,end:1},{t:"Just for a little while",a:2,end:1},{t:"I changed my mind",a:-3,back:2}]},
  {sp:"ENDING",t:"You curl up inside Aether\'s belly \u2014 a sanctuary of warmth and quiet. The world\'s noise fades to a distant murmur. No drain. No keeping. Just rest. And when you wake, you feel lighter than you have in months.",end:1}
]},
  {id:"luna",name:"Luna",sub:"Aether\'s Sister",altEnd:"Luna holds you close, silver fur warm against you. \"See? Not so scary.\" Her belly is slow and steady \u2014 a tide that never quite pulls you under. You feel watched over, kept, and for once, entirely willing.",ac:"#38bdf8",bg:"",dr:6,p:"https://storage.googleapis.com/dramaland-public/ugc_media/20260804/c5cc05853e574636bb6c15c0353dc6f3.jpg",e:"https://storage.googleapis.com/dramaland-public/ugc_media/20260804/c5cc05853e574636bb6c15c0353dc6f3.jpg",d:"A silver-furred Lucario with a sharp grin and a slower heartbeat. Aether\'s sister. Where he heals, she keeps \u2014 gently, slowly, like someone who learned early not to let go.",s:[
  {sp:"Narrator",t:"At a corner table in the Quiet Cafe, a silver-furred Lucario waves you over like you\'re old friends. Her grin is sharp, warm, and a little smug. \"You\'re the one my brother keeps talking about.\"",ch:[{t:"Your brother?",a:2},{t:"He talks about me?",a:3},{t:"Who are you?",a:1}]},
  {sp:"Luna",t:"Aether. Tall, lilac sweater, terrible at asking for things. I\'m Luna. His sister. He\'s all soft corners and quiet doors \u2014 I\'m the one who checks that nobody slams them.",ch:[{t:"You two are nothing alike",a:2},{t:"That\'s sweet, actually",a:3},{t:"Should I be worried?",a:1}]},
  {sp:"Luna",t:"Worried? No. But listen \u2014 if you\'re going to rest in his belly, know what you\'re getting. He heals you. Me? I keep you. Gently. Slowly. Like a sister who never learned how to let go.",ch:[{t:"That\'s intense",a:1},{t:"Show me",a:3},{t:"I\'ll stay with Aether",a:2}]},
  {sp:"Luna",t:"*laughs* Fair. Everyone needs a sister\'s belly sometimes \u2014 warm, watchful, no judgement. The drain\'s slow in here. You\'ll have time to decide if you want to stay forever.",ch:[{t:"I think I do",a:3,end:1},{t:"Just today",a:2,end:1},{t:"I\'ll pass",a:-2,back:2}]},
   {sp:"ENDING",t:"Luna tucks you into her belly with a sister\'s care \u2014 firm and fond. The drain is a gentle current instead of a pull. Above you, she hums and pats her middle. \"Rest. I\'ve got you. And I\'ve got all the time in the world.\"",end:1}
 ]},
 {id:"nyx",name:"Nyx Bellweather",sub:"The Midnight Courier",altEnd:"Nyx folds her cloak around you as the last lantern goes dark. \"Every dream has a door,\" she whispers. \"Yours is the one I choose to guard.\" You settle into the warm hush beneath her moonlit fur, carried safely through the sleeping city.",ac:"#d7b4ff",dr:0,bg:"",p:"nyx-base.png",e:"nyx-base.png",d:"A midnight-black feline who carries dreams between sleeping windows. She knows every quiet route through Destiny City and never loses a package.",spr:{happy:"nyx-happy.png",angry:"nyx-angry.png",sad:"nyx-sad.png",surprised:"nyx-surprised.png",blush:"nyx-blush.png",smug:"nyx-smug.png",belly:"nyx-belly.png"},s:[
  {sp:"Narrator",t:"A silver lantern swings beneath a rooftop arch. A midnight-black feline waits beside it, violet scarf trailing in the wind and a tiny bell chiming at her throat.",ch:[{t:"Follow the lantern",a:3},{t:"Ask who she is",a:2},{t:"Keep your distance",a:-1}]},
  {sp:"Nyx",ex:"smug",t:"Keep your voice down. The city is asleep, but it is not unaware. There is a difference.",ch:[{t:"What are you carrying?",a:2},{t:"I trust you",a:3},{t:"That sounds ominous",a:-1}]},
  {sp:"Nyx",ex:"happy",t:"I deliver dreams after midnight. The good ones go in silk envelopes. The dangerous ones get a bell tied to them.",ch:[{t:"Can I see the route?",a:3},{t:"Do you ever get lost?",a:2},{t:"I should go home",a:-2}]},
  {sp:"Nyx",ex:"blush",t:"You have the look of someone who wants to be shown the secret path. Try not to step on the moonbeams.",ch:[{t:"Take her paw",a:3},{t:"Lead the way",a:3},{t:"Maybe another night",a:-1}]},
  {sp:"Nyx",ex:"sad",t:"The last courier ran from the dark. I stayed. Someone has to make sure the gentle dreams reach the right windows.",ch:[{t:"I\'ll stay beside you",a:3},{t:"You don\'t have to do it alone",a:2},{t:"That sounds dangerous",a:-1}]},
  {sp:"Nyx",ex:"blush",t:"Then stay close. When the bell rings, the sleeping city opens a door just for us.",ch:[{t:"I\'m ready",a:3,end:1},{t:"Show me the lantern route",a:3,end:1},{t:"I changed my mind",a:-2,back:2}]},
  {sp:"ENDING",t:"Nyx lifts you into the warm fold of her cloak and carries you along the rooftop lantern route. Dreams drift past like fireflies. Her bell rings once, and every quiet door in Destiny City opens for you.",end:1}
 ]},
];

  {id:0,r:"You wish to speak? Very well. I have stood guard for millennia \u2014 a conversation is a pleasant change from silence. What would you know, little warrior?",a:1,next:[1,2,3]},
  {id:1,t:"What's your shrine like?",r:"Ancient. Powerful. Built by hands that no longer exist in this world. The thunder never stops here \u2014 it is the heartbeat of something older than memory. It suits me.",a:2,next:[4]},
  {id:2,t:"Are you a god or a warrior?",r:"Both. Neither. I was built to guard, and I chose to fight. The line between divine and mortal blurs when you have lived as long as I have. Titles lose meaning. Actions remain.",a:2,next:[4]},
  {id:3,t:"Why did you swallow me?",r:"You showed courage. Rare, in these soft times. Most flee. You stood. I keep what impresses me, and you impressed me. *thumps chest* So here you stay, little warrior.",a:3,next:[4]},
  {id:4,t:"Will you ever release me?",r:"Perhaps. When I have seen enough of your spirit. Or when the thunder finally stops. Neither is likely to happen soon. Rest well in there \u2014 I will not let harm come to what is mine.",a:1,next:[]},
],
vincent:[
  {id:0,r:"Heh, you wanna chat? Sure thing, mate. I don't get many visitors \u2014 well, visitors who can actually hold a conversation from inside my gut. What do you wanna know?",a:1,next:[1,2,3]},
  {id:1,t:"How'd you end up in this alley?",r:"Long story, mate. Streets raised me, alley kept me. Found my people here, found my music, found my rhythm. Then you wandered in and I thought... yeah, this one's staying. So here you are.",a:2,next:[4]},
  {id:2,t:"What's with the star-shaped eyes?",r:"Born with 'em. Rare trait among my kind \u2014 Obstagoon with star eyes are said to be destined for greatness. Or trouble. Usually both. *winks* You tell me which one this is.",a:2,next:[4]},
  {id:3,t:"Why'd you eat me?",r:"Couldn't let you walk away, could I? Not after you chose this alley. You walked into MY territory, chose ME. That means something on these streets. So now you're mine. Simple as that.",a:3,next:[4]},
  {id:4,t:"Do you ever think about leaving the alley?",r:"Sometimes. But the streets need someone who knows 'em. Someone who speaks the language. I'm that someone. And now, so are you \u2014 just... on the inside. *chuckles* Home sweet home, right?",a:1,next:[]},
],
fomo:[
  {id:0,r:"Mm? Oh, hey. Didn\'t hear you creep up on me. Come on, sit \u2014 the water\'s nice this time of night. What\'s on your mind?",a:1,next:[1,2,3]},
  {id:1,t:"What is this place?",r:"Old public pool. Shut down years ago, but nobody bothered to tell the water to stop glowing pretty like that. I come here when I want to be alone. Or... not alone, depending on who wanders by.",a:1,next:[4]},
  {id:2,t:"What\'s with all those spots?",r:"*grins, tail flicking* Curious little thing, aren\'t you? Let\'s just say every spot\'s got a story. Some of those stories... are still going. You keep asking questions like that, you might end up part of one.",a:2,next:[4]},
  {id:3,t:"You seem hungrier than the others...",r:"Heh. Perceptive. Most predators just want to hold onto something. Me? I want to *keep* it. All the way. There\'s a difference, and it\'s a good one \u2014 trust me.",a:2,next:[4]},
  {id:4,t:"Is it true you can... digest people?",r:"*soft, sly smile* Now why would you want to know that? ...Some things don\'t just get swallowed, sweetheart. Some things get absorbed. Become part of you. Permanently. Lucky for you, I only do that to the ones I really, really like.",a:3,next:[]},
],
wolf:[
  {id:0,r:"Heh, you're up here talkin' to me instead of running for the escape pod. Ballsy. Or dumb. What's on your mind, kid?",a:1,next:[1,2,3]},
  {id:1,t:"How'd you get this ship?",r:"Won it fair and square in a bounty dispute. Some things you take, some things you earn. This ship? Earned it the hard way. Same as everything else I've got.",a:2,next:[4]},
  {id:2,t:"Do you miss your old crew?",r:"...Sometimes. Ship gets quiet without a squad backing you up. But hey, silver lining \u2014 more room for you now. Funny how that works out.",a:2,next:[4]},
  {id:3,t:"Why'd you keep me here?",r:"Because you didn't run. Because you looked me in the eye instead of bolting for the airlock. That earns you a permanent seat on this ship \u2014 preferably somewhere close. Real close.",a:3,next:[4]},
  {id:4,t:"Ever gonna let me go?",r:"Let you go? Kid, you're the best thing that's docked on this ship in years. Get comfortable. Star Wolf doesn't give refunds.",a:1,next:[]},
],
glacia:[
  {id:0,r:"You came back. Interesting. Most don't return to the cold twice. What is it you want to know?",a:1,next:[1,2,3]},
  {id:1,t:"Why do you live all the way out here?",r:"The cave is quiet. Honest. Warmth complicates things \u2014 feelings, decisions, mistakes. Out here, everything stays crystal clear. Mostly.",a:2,next:[4]},
  {id:2,t:"Are you always this cool and composed?",r:"Usually, yes. It's rather effortless when you're an ice-type. Though... you seem to be one of the few things that unsettles that composure. Curious.",a:2,next:[4]},
  {id:3,t:"Why did you keep me?",r:"Because warmth found its way into my cave, and I decided I quite liked it. Rare things are worth preserving carefully. Permanently, in this case.",a:3,next:[4]},
  {id:4,t:"Will the ice ever melt?",r:"For you? Perhaps already has, a little. Don't tell the others. I do have a reputation to maintain, even from in here.",a:1,next:[]},
],
riko:[
  {id:0,r:"Oh, YOU\'re back. Most people don\'t visit a low-level mob twice. Either you\'re braver than most or dumber than most. Which is it?",a:1,next:[1,2,3]},
  {id:1,t:"What\'s your deal anyway?",r:"Me? I\'m a nobody. Level 3 mob, weakest in the district. Can\'t fight, can\'t cast, can\'t do squat \u2014 except one thing. *taps belly* I can put things in here that shouldn\'t fit. Strong things. Big things. And they don\'t come back out.",a:2,next:[4]},
  {id:2,t:"Who\'s in your belly right now?",r:"Heh, you noticed? *pats gut* Level 40 barbarian. Big guy, huge axe, zero brain cells. Thought he could farm me for XP. Now he\'s my warm little roommate. He\'s STILL grumbling in there \u2014 been three days. Very stubborn man.",a:2,next:[4]},
  {id:3,t:"Why don\'t you just eat me then?",r:"...I could. Easy. You\'re what, level 15? Light snack. But... *looks away, ears twitching* I don\'t want to. Not you. You actually talk to me like I\'m a person, not a loot pinata. That\'s... rare, down here.",a:3,next:[4]},
  {id:4,t:"Ever think about leveling up normally?",r:"And do what? Become another generic mid-boss? Get farmed by adventurers for drops? Nah. I like being the weak one with the secret. Nobody expects you, nobody respects you, nobody sees you coming. That\'s the whole game, friend.",a:1,next:[]},
],

function initWorld(){

  }

function updateWorld(){
  initWorld();
  // Characters only move when the day changes, not on every time-of-day tick
  if(S.worldDay!==S.day){
    S.worldDay=S.day;
    C.forEach((c)=>{
    if(isPrey(c.id))return;
    if(Math.random()<0.3){
      var locs=LOC.filter((l)=>{return l.id!=="home"});
      S.cpos[c.id]=locs[Math.floor(Math.random()*locs.length)].id;
    }else{
      var home=getHomeLoc(c.id);if(home)S.cpos[c.id]=home;
    }
  });
  // ==== BELLY PET CYCLE v4 ====
  // Riko is the only character with a strength drain. At 50% an occupant's
  // escape route seals permanently, but the drain continues to 100%.
  // Other hosts do not inherit Riko's drain mechanic.
  var notes=[];
  C.forEach((c)=>{
    var pets=getPets(c.id);
    if(pets.length===0)return;
    S.bd[c.id]=S.bd[c.id]||{};
    var out=[];
    pets.forEach((pid)=>{
      var g=gc(pid);
      if(c.id==="riko"){
        var previous=S.bd[c.id][pid]||0;
        var d=Math.min(100,previous+10);
        S.bd[c.id][pid]=d;
        if(previous<50&&d>=50){
          S.ach=S.ach||{};S.ach.keep=true;
          notes.push(g.name+" hit 50% drain in Riko\'s belly. Escape sealed permanently; drain continues.");
        }else if(previous<100&&d>=100){
          notes.push(g.name+" reached 100% drain in Riko\'s belly. Completely settled.");
        }
        if(d<50&&Math.random()<0.3){
          delete S.bd[c.id][pid];
          notes.push(g.name+" escaped Riko\'s belly at "+Math.round(d)+"% drain.");
        }else{
          out.push(pid);
        }
      }else if(c.id==="aether"){
        delete S.bd[c.id][pid];
        notes.push(g.name+" rested in Aether\'s belly and left refreshed.");
      }else{
        delete S.bd[c.id][pid];
        out.push(pid);
      }
    });
    if(out.length===0)delete S.bp[c.id];else S.bp[c.id]=out;
  });
  // Riko: 45% chance per day to hold ALL his options at once, each with their own drain
  var avail=C.map((c)=>{return c.id}).filter((id)=>{return !isPrey(id)});
  var RIKO_PREY=["vegeta","champa","wolf","anubis"];
  if(avail.indexOf("riko")!==-1&&Math.random()<0.45){
      var opts=RIKO_PREY.filter((id)=>{return avail.indexOf(id)!==-1&&!isBellyHost(id)});
    if(opts.length>0){
      var existing=getPets("riko");
      var merged=existing.slice();
      opts.forEach((id)=>{if(merged.indexOf(id)===-1)merged.push(id)});
      S.bp.riko=merged;
      S.bd.riko=S.bd.riko||{};
      opts.forEach((id)=>{S.bd.riko[id]=S.bd.riko[id]||0;S.cpos[id]=S.cpos["riko"]});
      opts.forEach((id)=>{avail.splice(avail.indexOf(id),1)});
      avail.splice(avail.indexOf("riko"),1);
      if(merged.length>=4){S.ach=S.ach||{};S.ach.fullHouse=true;}
      notes.push("Riko swallowed "+opts.map((id)=>gc(id).name).join(", ")+" in one go. "+merged.length+" occupants now, each draining separately.");
    }
  }
  // Everyone can belly pet anyone now: up to 2 fresh pairs per day
  var tries=0;
  var preyAvail=avail.filter((id)=>{return !isBellyHost(id)});
  while(tries<2&&avail.length>=2&&preyAvail.length>0){
    tries++;
    if(Math.random()<0.65){
      var pi=Math.floor(Math.random()*avail.length);var pred=avail.splice(pi,1)[0];
      var predPreyIndex=preyAvail.indexOf(pred);
      if(predPreyIndex!==-1)preyAvail.splice(predPreyIndex,1);
      if(preyAvail.length===0)break;
      var yi=Math.floor(Math.random()*preyAvail.length);var prey=preyAvail.splice(yi,1)[0];
      var preyAvailIndex=avail.indexOf(prey);
      if(preyAvailIndex!==-1)avail.splice(preyAvailIndex,1);
      S.bp[pred]=[prey];S.bd[pred]=S.bd[pred]||{};S.bd[pred][prey]=(gc(pred).dr||7)<0?30:0;
      S.cpos[prey]=S.cpos[pred];
      notes.push(gc(pred).name+" swallowed "+gc(prey).name+".");
    }else break;
  }
  if(notes.length>0)toast("\u{1F47D} "+notes.slice(0,3).join(" ")+(notes.length>3?" (+"+(notes.length-3)+" more)":""));
  }
  sv();
}

function tryEncounter(){
  if(Math.random()>=0.3)return false;
  var roll=Math.random();
  if(roll<0.35){
    S.coins=(S.coins||0)+2;
    toast(ENC_FLAVOR[Math.floor(Math.random()*ENC_FLAVOR.length)]+" (+2 coins)");
  }else if(roll<0.7){
    var b=ENC_BUMP[Math.floor(Math.random()*ENC_BUMP.length)];
    if(b.cid==="riko")b={cid:"riko",line:rikoEncounterLine()};
    var c=gc(b.cid);
    S.coins=(S.coins||0)+2;
    toast((c?c.name+": ":"")+"\""+b.line+"\" (+2 coins)");
  }else{
    var pool=C.filter((c)=>{return !isPrey(c.id)&&!isBellyHost(c.id)});
    if(pool.length===0)return false;
    S.encPred=pool[Math.floor(Math.random()*pool.length)].id;
    S.encText=ENC_RISK_TEXT[Math.floor(Math.random()*ENC_RISK_TEXT.length)];
    S.unnamedEncounter=S.encText===ENC_RISK_TEXT[2]&&Math.random()<0.6;
    S.scr="encounter";
    return true;
  }
  return false;
}
function encounterScreen(){
  var c=gc(S.encPred);
  if(!c){S.scr="cityMap";return R()}
  var investigateLabel=S.unnamedEncounter?"\u{1F47B} Follow the Presence":"\u{1F440} Investigate";
  return '<div class="s"><div class="h"><h2>\u2757 Random Encounter</h2></div>'
    +'<div class="mloc"><div class="mlocdesc" style="font-size:15px;line-height:1.6">'+S.encText+'</div>'
    +'<div class="mempty" style="border-style:solid;text-align:left;padding:14px">Your instincts tell you '+c.name+' might be nearby...</div>'
    +'<div class="mcbtns" style="margin-top:14px">'

    +'<button class="b bo" data-a="encIgnore" style="flex:1">\u{1F6B6} Keep Walking</button>'
    +'</div></div></div>';
}

function cityMap(){
  initWorld();
  var loc=LOC.find((l)=>{return l.id===S.loc})||LOC[0];
  var pins=LOC.map((l)=>{
    var here=l.id===S.loc;
    var hereChars=charsAt(l.id);
    var charImgs=hereChars.map((c)=>{return '<img class="mcharp" src="'+c.p+'" loading="lazy" style="border-color:'+c.ac+'"'+(S.bp[c.id]?' data-bp="1"':'')+'>'}).join('');
    return '<div class="mpin'+(here?' here':'')+'" data-a="goto" data-loc="'+l.id+'" style="left:'+l.x+'%;top:'+l.y+'%">'
      +'<div class="micon">'+l.icon+'</div>'
      +'<div class="mlbl">'+l.name+'</div>'
      +(charImgs?'<div class="mchars">'+charImgs+'</div>':'')
      +(here?'<div class="myou">\u{1F4CD} YOU</div>':'')
      +'</div>';
  }).join('');
  var hereChars=charsAt(loc.id);
  var localHosts=petHostsAt(loc.id);
  var localNpcs=npcsAt(loc.id);
  var actions='';
  if(hereChars.length>0||localNpcs.length>0){
    for(var i=0;i<hereChars.length;i++){
      var c=hereChars[i];
      var hasBelly=getPets(c.id).length>0;
      var pets=hasBelly?getPets(c.id):[];
      var petLabel=pets.map((pid)=>{var g=gc(pid);var d=petDrain(c.id,pid);return g.name+(d>0?" ("+Math.round(d)+"%"+(isEscapeLocked(c.id,pid)?" \ud83d\udd12":"")+")":"")}).join(', ');
      actions+='<div class="mcharcard">'
        +'<div class="mcrow"><img class="mcavatar" src="'+c.p+'" style="border-color:'+(hasBelly?'#f472b6':c.ac)+'">'
        +'<div><div class="mcname" style="color:'+c.ac+'">'+c.name+'</div>'
        +'<div class="mcsub">'+c.sub+'</div>'
        +(hasBelly?'<div style="font-size:10px;color:#f472b6;font-weight:600;margin-top:2px">\u{1F47D} '+pets.length+' belly pet'+(pets.length>1?'s':'')+': '+petLabel+(pets.some((pid)=>isEscapeLocked(c.id,pid))?' \u2014 escape sealed at 50%!':'')+'</div>':'')
        +'</div></div>'
        +'<div class="mcbtns">'
        +'<button class="b bs" data-a="talk" data-cid="'+c.id+'">\u{1F4AC} Talk</button>'
        +'<button class="b bp" data-a="date" data-id="'+c.id+'">\u2764\uFE0F Date</button>'
        +(S.ul[c.id]?'<button class="b bo" data-a="bellyMap" data-id="'+c.id+'">\u{1F47D} Belly</button>':'')
        +(hasBelly?'<button class="b bs" data-a="joinBelly" data-pid="'+c.id+'" style="border-color:#f472b6;flex:1">\u{1F91D} Join Belly ('+pets.length+' inside)</button>':'')
        +(hasBelly?pets.map((pid)=>'<button class="b bo" data-a="talkPrey" data-pid="'+c.id+'" data-preypid="'+pid+'" style="font-size:10px;flex:1">\u{1F4AC} '+gc(pid).name+' (muffled)</button>').join(''):'')
        +(localHosts.filter((h)=>h.id!==c.id).map((h)=>'<button class="b bo" data-a="askPetHost" data-host="'+h.id+'" data-visitor="'+c.id+'" style="font-size:10px;flex:1;border-color:#f472b6;color:#f9a8d4">\u{1F4AC} Ask '+h.name+' about pets</button>').join(''))
        +'</div></div>';
    }
    for(var ni=0;ni<localNpcs.length;ni++){
      var npc=localNpcs[ni];
      actions+='<div class="mcharcard" style="border-color:rgba(148,163,184,.35)">'
        +'<div class="mcrow"><div class="mcavatar" style="display:flex;align-items:center;justify-content:center;background:rgba(100,116,139,.2);font-size:28px">'+npc.icon+'</div>'

        +'<div class="mcbtns"><button class="b bs" data-a="npcTalk" data-npc="'+npc.id+'" style="flex:1">\u{1F4AC} Ask what they\'ve seen</button>'
        +(localHosts.length?localHosts.map((h)=>'<button class="b bo" data-a="askPetHost" data-host="'+h.id+'" data-visitor="npc:'+npc.id+'" style="font-size:10px;flex:1;border-color:#f472b6;color:#f9a8d4">\u{1F50E} Ask about '+h.name+'</button>').join(''):'')
        +'</div></div>';

    +'<div class="h"><h2>\u{1F5FA}\uFE0F Destiny City</h2><div class="mstats"><span>\u{1F4C5} Day <b>'+S.day+'</b></span><span>'+['Morning','Afternoon','Night','Late Night'][S.time||0]+'</span><span>\u26A1 Energy <b>'+S.energy+'/3</b></span></div></div>'
    +'<div class="map"><div class="mapbg"></div>'+pins+'</div>'
    +'<div class="mloc"><div class="mlocname">'+loc.icon+' '+loc.name+'</div><div class="mlocdesc">'+loc.desc+'</div>'+actions+'</div>'

function talkScreen(){
  var c=gc(S.tcid);
  if(!c){S.scr=S.bellyReturn||"cityMap";return R()}
  var tree=TALK[c.id]||TALK.beerus;
  var node=tree.find((n)=>{return n.id===S.tnid})||tree[0];
  // Riko names his occupants by name and brags about draining them
  if(S.tnid===0&&c.id==="riko"){
    var rp=getPets(c.id);
    if(rp.length>0){
      var r0=tree[0];
      node={r:"Heh. Look who\'s back. Good timing \u2014 I\'ve got company. Right now I\'m draining "+rp.map((pid)=>{var g=gc(pid);return g.name+" ("+Math.round(petDrain(c.id,pid))+"%)"}).join(", ")+". "+(rp.some((pid)=>isKept(c.id,pid))?"One of \'em already hit 50%. Stopped fighting, stopped leaving. Permanent. *pats belly* That\'s the dream.":"The drain\'s working. Give \'em a few more days and they\'ll stop wanting out. You\'re welcome to join the pile."),next:r0?r0.next:[]};
    }
  }
  var crossReact='';
  if(S.tnid===0&&S.ul&&Object.keys(S.ul).length>1){
    var dated=Object.keys(S.ul).filter((k)=>{return k!==c.id&&S.ul[k]});
    if(dated.length>0){
      crossReact=(CROSS_REACTIONS[c.id]||'')+'\n\n';
    }
  }
  if(S.tnid===-1){node={r:bellyTalkLine(c),next:[]};}
  var choices='';
  var bellyPet=S.bp[c.id];
  var pets2=bellyPet?getPets(c.id):[];
  if(S.tnid===-1){
    if(pets2.length>0){
      var plines=pets2.map((pid)=>{
        var g=gc(pid);var d=petDrain(c.id,pid);
        var tag=isKept(c.id,pid)?' (kept \u221E)':(d>0?' ('+Math.round(d)+'% drain)':'');
        return g.name+tag+': "'+preyDialogueLine(c.id,pid)+'"';
      });
      choices='<div style="padding:8px;border:1px dashed rgba(244,114,182,.3);border-radius:8px;margin-bottom:6px;font-size:12px;color:#f472b6;font-style:italic">'+plines.join('<br>')+'</div>';
    }
    choices+='<button class="vch" data-a="openGifts" style="border-color:#fbbf24;background:rgba(251,191,36,.1)">\u{1F381} Give Gift</button><div class="vt2" data-a="talkEnd">\u25B6 End Conversation</div>';
  }else if(node.next&&node.next.length>0){
    choices=node.next.map((nid)=>{
      var n=tree.find((t)=>{return t.id===nid});
      return n?'<button class="vch" data-a="talkChoice" data-nid="'+nid+'">'+n.t+'</button>':'';
    }).join('');
    if(S.tnid===0&&pets2.length>0){var prey=gc(pets2[0]);if(prey)choices='<button class="vch" data-a="askBelly" data-nid="-1" style="border-color:#f472b6">\u{1F47D} Ask about '+prey.name+'...</button>'+choices;}
  }else{
    choices='<button class="vch" data-a="openGifts" style="border-color:#fbbf24;background:rgba(251,191,36,.1)">\u{1F381} Give Gift</button><div class="vt2" data-a="talkEnd">\u25B6 End Conversation</div>';
  }
  var isBelly=S.bellyReturn==="bellyMode";
  var img=isBelly?(c.spr&&c.spr.belly||c.p):(c.spr&&c.spr.happy||c.p);
  var bg=c.bg||'';
  return '<div class="s vn">'
    +'<div class="vnbar"><button class="b inact" data-a="talkEnd">\u2190 Back</button></div>'
    +(bg?'<div class="vnbg"><img src="'+bg+'"></div>':'')
    +'<div class="vnch"><img src="'+img+'" style="max-width:100%;max-height:100%;object-fit:contain"></div>'
    +'<div class="dbox"><div class="dname" style="background:'+c.ac+';color:#fff">'+c.name+(isBelly?' \u2014 Belly Talk':'')+'</div><div class="dtext" id="tw" data-full="'+(crossReact+node.r).replace(/"/g,'&quot;')+'"></div></div>'
    +'<div class="vc" id="ch" style="display:none">'+choices+'</div>'
    +'</div>';
}

// VN Engine core
let twTimer=null, twIdx=0, twFull="";
function startTypewriter(text, cb){
  stopTypewriter();
  twFull=text; twIdx=0;
  const el=document.getElementById("tw");
  if(!el)return;
  el.innerHTML='<span id="twc"></span>';
  var ts=S.settings||{};
  const speed=(!ts.typewriter||ts.textSpeed===0)?0:(S.skip?8:(ts.textSpeed||35));
  if(speed===0){el.innerHTML=twFull;if(cb)cb();return}
  twTimer=setInterval(()=>{
    if(twIdx>=twFull.length){stopTypewriter();if(cb)cb();return}
    twIdx++;
    el.innerHTML=twFull.substring(0,twIdx)+'<span class="twc"></span>';
  },speed);
  // Tap to skip typewriter - use addEventListener for better mobile support
  var dbox=el.parentElement;
  dbox.addEventListener('click',(ev)=>{
    if(twIdx<twFull.length){stopTypewriter();el.innerHTML=twFull;if(cb)cb()}
    else if(cb)cb();
  });
  dbox.style.cursor='pointer';
}
function stopTypewriter(){if(twTimer){clearInterval(twTimer);twTimer=null}}
function showChoices(){const ch=document.getElementById("ch");if(ch){ch.style.display="flex";ch.style.opacity="1";ch.style.animation="f .3s forwards"}}
function vnAdvance(){
  if(twIdx<twFull.length){stopTypewriter();const el=document.getElementById("tw");if(el)el.innerHTML=twFull;showChoices();return}
  S.si++;R();
}
function fade(cb){const f=document.getElementById("fade");if(!f){cb();return}f.classList.add("show");setTimeout(()=>{cb();setTimeout(()=>f.classList.remove("show"),100)},300)}
function toggleAuto(){S.auto=!S.auto;toast(S.auto?"Auto-advance ON":"Auto-advance OFF");R()}
function toggleSkip(){S.skip=!S.skip;toast(S.skip?"Skip ON":"Skip OFF");R()}
function saveSlot(slot){
  const saves=JSON.parse(mem.get("dwd_saves")||"[]");
  saves[slot]={cid:S.cid,si:S.si,af:S.af,sc:S.sc,date:new Date().toISOString().substring(0,16).replace("T"," ")};
  mem.set("dwd_saves",JSON.stringify(saves));
  toast("Saved to slot "+(slot+1));
}
function loadSlot(slot){
  const saves=JSON.parse(mem.get("dwd_saves")||"[]");
  const s=saves[slot];
  if(!s)return;
  S.cid=s.cid;S.si=s.si;S.af=s.af;S.sc=s.sc;S.scr="vn";R();
}
function saveScreen(){
  const saves=JSON.parse(mem.get("dwd_saves")||"[]");
  let slots="";
  for(let i=0;i<3;i++){
    const s=saves[i];
    if(s){const c=gc(s.cid);slots+='<div class="slot" data-a="sl'+i+'"><div class="sh">Slot '+(i+1)+' — '+s.date+'</div><div class="sd">'+(c?c.name:'Unknown')+'</div><div class="ss">Scene '+(s.si+1)+' | ♥ '+s.af+' | Score '+s.sc+'</div></div>'}
    else{slots+='<div class="slot empty" data-a="sl'+i+'"><div class="sh">Slot '+(i+1)+'</div><div class="sd">Empty</div></div>'}
  }
  return '<div class="s"><div class="h"><button class="b bs" data-a="back2vn">← Back</button><h2>Save Game</h2></div><div class="sc"><div class="slots">'+slots+'</div></div></div>';
}
function loadScreen(){
  const saves=JSON.parse(mem.get("dwd_saves")||"[]");
  let slots="";
  for(let i=0;i<3;i++){
    const s=saves[i];
    if(s){const c=gc(s.cid);slots+='<div class="slot" data-a="ll'+i+'"><div class="sh">Slot '+(i+1)+' — '+s.date+'</div><div class="sd">'+(c?c.name:'Unknown')+'</div><div class="ss">Scene '+(s.si+1)+' | ♥ '+s.af+' | Score '+s.sc+'</div></div>'}
    else{slots+='<div class="slot empty"><div class="sh">Slot '+(i+1)+'</div><div class="sd">Empty</div></div>'}
  }
  return '<div class="s"><div class="h"><button class="b bs" data-a="back2vn">← Back</button><h2>Load Game</h2></div><div class="sc"><div class="slots">'+slots+'</div></div></div>';
}
